nd with the cards overlapping, pips on the 7–10, J, Q, K figures and a small suit symbol in the corner."],["🟢 Διαθέσιμος · 🟡 Away · 🔴 Παίζει τώρα","🟢 Available · 🟡 Away · 🔴 Playing now"],["Ενεργοί παίκτες: πάνω αριστερά στο κεντρικό μενού φαίνεται πόσοι παίκτες είναι online. Πατώντας το ανοίγεις τη λίστα με τα ονόματά τους, και πατώντας ένα όνομα βλέπεις το προφίλ του. Αν δεν θέλεις να φαίνεσαι στη λίστα, κλείσε το «Να φαίνομαι στη λίστα online» από τις Ρυθμίσεις.", "Players online: at the top left of the main menu you can see how many players are online. Tap it to open the list of their names, and tap a name to see that player's profile. If you don't want to appear in the list, turn off “Show me in the online list” in the Settings."],["Στη λίστα των online παικτών, που ανοίγει από τον αριθμό στο κεντρικό μενού, φαίνεται το username σου όσο η εφαρμογή είναι ανοιχτή (με κίτρινη τελίτσα αν είσαι away και κόκκινη όταν παίζεις). Αν δεν θέλεις να φαίνεσαι εκεί, κλείσε το «Να φαίνομαι στη λίστα online» από τις Ρυθμίσεις· τότε μετράς μόνο στον αριθμό. Το όνομα σβήνεται από τη λίστα μόλις κλείσεις την εφαρμογή.", "The list of online players, which opens from the number in the main menu, shows your username while the app is open (with a yellow dot if you are away and a red one while you are playing). If you don't want to appear there, turn off “Show me in the online list” in the Settings; then you are only counted in the number. Your name is removed from the list as soon as you close the app."],["Κάποιοι παίκτες δεν εμφανίζονται στη λίστα: έχουν επιλέξει να μη φαίνονται.", "Some players are not shown in the list: they have chosen not to appear."],["Κανένας παίκτης δεν φαίνεται online αυτή τη στιγμή.", "No players appear to be online right now."],["Η λίστα δεν είναι διαθέσιμη αυτή τη στιγμή.", "The list is not available right now."],["Δεν μπόρεσα να φορτώσω τη λίστα. Δοκίμασε ξανά.", "I couldn't load the list. Please try again."],["Να φαίνομαι στη λίστα online", "Show me in the online list"],["Ενεργοί παίκτες", "Players online"],["Ανανέωση", "Refresh"],["(εσύ)", "(you)"],["Αν πατήσεις το σήμα που ήδη φαίνεται, το βγάζεις. Από το προφίλ αλλάζεις και το username σου, μία φορά κάθε 30 μέρες.","If you tap the badge that is already showing, you remove it. You can also change your username from your profile, once every 30 days."],["Τώρα σε λένε ","You are currently "],[". Μπορείς να αλλάζεις username μία φορά κάθε 30 μέρες. Τα στατιστικά, οι φίλοι και τα σήματά σου μένουν ίδια.",". You can change your username once every 30 days. Your stats, friends and badges stay the same."],["Μπορείς να το αλλάξεις ξανά από: ","You can change it again from: "],["Νέο username (3-14 γράμματα)","New username (3-14 characters)"],["Αυτό είναι ήδη το username σου.","That is already your username."],["Μετά την αλλαγή δεν θα μπορείς να το ξαναλλάξεις για 30 μέρες. Πάτα ξανά για επιβεβαίωση.","After the change you won't be able to change it again for 30 days. Tap again to confirm."],["Επιβεβαίωση","Confirm"],["Το username άλλαξε.","Your username has been changed."],["Άλλαξες username πριν λιγότερο από 30 μέρες.","You changed your username less than 30 days ago."],["Σούπερ τσάκα","Super cut"],["Παπούτσι","Shoe"],["Αστραπή","Lightning"],["Βόμβα","Bomb"],["Όταν κόβεις Άσσο αντιπάλου, παίζει το στυλ που διάλεξες και το βλέπουν όλοι στο τραπέζι. Μόνο για Pilotta Plus.","When you cut an opponent's Ace, the style you chose plays and everyone at the table sees it. Pilotta Plus only."],["Πάτα ένα στυλ για να το δεις και να το ακούσεις.","Tap a style to see and hear it."],["Ξεκλείδωσε με Plus","Unlock with Plus"],["Πλαίσιο τραπεζιού","Table frame"],["Μεγέθυνση/σμίκρυνση: με τα κουμπιά «−» και «+» πάνω δεξιά, κάτω από τα σκορ, μικραίνεις ή μεγαλώνεις όλη την οθόνη του παιχνιδιού (100%, 90%, 80%, 70%), ώστε να χωράνε όλα χωρίς κύλιση. Το θυμάται την επόμενη φορά.","Zoom: use the “−” and “+” buttons at the top right, below the scores, to shrink or enlarge the whole game screen (100%, 90%, 80%, 70%) so everything fits without scrolling. It is remembered next time."],["Παίζει τώρα","Playing now"],["Ψάξε παίκτες: αν στο τραπέζι σου λείπουν παίκτες, ο οικοδεσπότης πατάει «Ψάξε παίκτες» και οι κενές θέσεις γεμίζουν με τυχαίους παίκτες που ψάχνουν παιχνίδι. Αν δεν βρεθούν σε 1 λεπτό, σε ρωτάει αν θες να παίξετε με bots. Με τυχαίους παίκτες το παιχνίδι μετράει στο rating, με bots όχι.","Find players: if your table is missing players, the host taps “Find players” and the empty seats are filled with random players who are looking for a game. If none are found within a minute, it asks whether you want to play with bots. With random players the game counts towards your rating, with bots it doesn't."],["Ψάξε παίκτες: βρίσκει τυχαίους παίκτες για τις κενές θέσεις και το παιχνίδι μετράει στο rating.","Find players: finds random players for the empty seats, and the game counts towards your rating."],["Δεν βρέθηκαν ακόμα παίκτες. Θες να παίξετε με bots;","No players found yet. Do you want to play with bots?"],["Ακύρωση αναζήτησης","Cancel search"],["Συνέχεια αναζήτησης","Keep searching"],["Παίξτε με bots","Play with bots"],["Ψάξε παίκτες","Find players"],["Η συνδρομή δεν είναι διαθέσιμη αυτή τη στιγμή. Δοκίμασε ξανά αργότερα.","The subscription is not available right now. Try again later."],["Η πληρωμή εκκρεμεί. Το Plus θα ενεργοποιηθεί μόλις ολοκληρωθεί.","The payment is pending. Plus will be activated as soon as it completes."],["Η συνδρομή ακυρώθηκε.","The subscription was cancelled."],["Η συνδρομή είναι ήδη ενεργή στον λογαριασμό σου στο Google Play. Δοκίμασε ξανά σε λίγο.","The subscription is already active on your Google Play account. Try again in a moment."],["Το Plus ενεργοποιείται αυτόματα, το πολύ μέσα σε μία ώρα.","Plus is activated automatically, within an hour at most."],["Η αγορά μέσω Google Play δεν είναι διαθέσιμη αυτή τη στιγμή.","Buying through Google Play is not available right now."],["Συνδρομή με αυτόματη ανανέωση μέσω Google Play. Ακυρώνεις όποτε θες από το Google Play και το Plus μένει μέχρι το τέλος της περιόδου που έχεις πληρώσει. Το ετήσιο κοστίζει περίπου όσο 7,5 μήνες.","A subscription that renews automatically through Google Play. You can cancel any time in Google Play, and Plus stays until the end of the period you have already paid for. The yearly plan costs about the same as 7.5 months."],["Με το Plus ξεκλειδώνεις το θέμα «Διάστημα» (επιφάνειες, φόντα, φύλλα, avatars, emotes), τα στυλ της Σούπερ τσάκας, παίρνεις το σήμα Pilotta Plus, προτεραιότητα στην αναμονή του Γρήγορου παιχνιδιού, 50% έκπτωση σε κάθε θέμα του Καταστήματος και δεν βλέπεις διαφημίσεις. Το παιχνίδι μένει δωρεάν για όλους: το Plus δεν δίνει πλεονέκτημα στο τραπέζι.","With Plus you unlock the «Space» theme (table surfaces, backgrounds, card designs, avatars, emotes) and the Super cut styles, get the Pilotta Plus badge, priority in the Quick match queue, 50% off every theme in the Store, and you see no ads. The game stays free for everyone: Plus gives no advantage at the table."],["Διαχείριση ή ακύρωση συνδρομής","Manage or cancel subscription"],["1,99 € / μήνα","€1.99 / month"],["14,99 € / έτος","€14.99 / year"],["Συνδρομή με αυτόματη ανανέωση. Ακυρώνεις όποτε θες και το Plus μένει μέχρι το τέλος της περιόδου που έχεις πληρώσει. Το ετήσιο κοστίζει περίπου όσο 7,5 μήνες.","A subscription that renews automatically. You can cancel any time, and Plus stays until the end of the period you have paid for. The yearly plan costs about the same as 7.5 months."],["Η πληρωμή γίνεται στη σελίδα της Stripe. Το θέμα ξεκλειδώνει αυτόματα στον λογαριασμό σου, το πολύ μέσα σε μία ώρα.","The payment is made on the Stripe page. The theme unlocks automatically on your account within an hour at most."],["Αγορά","Buy"],["Αγορά · ","Buy · "],["Συνδέσου πρώτα, για να μπει το θέμα στον λογαριασμό σου.","Sign in first, so the theme is added to your account."],["Η αγορά ακυρώθηκε.","The purchase was cancelled."],["Η πληρωμή εκκρεμεί. Το θέμα θα ξεκλειδώσει μόλις ολοκληρωθεί.","The payment is pending. The theme will unlock as soon as it completes."],["Η αγορά δεν είναι διαθέσιμη αυτή τη στιγμή. Δοκίμασε ξανά αργότερα.","The purchase is not available right now. Try again later."],["Το έχεις ήδη αγοράσει. Δοκίμασε ξανά σε λίγο.","You have already bought it. Try again in a moment."],["Κυπριακό καφενείο","Cypriot café"],["Ξύλινο τραπέζι","Wooden table"],["Μάρμαρο","Marble"],["Καρό τραπεζομάντιλο","Checked tablecloth"],["Ψάθα","Straw weave"],["Πλακάκια","Tiles"],["Πέτρινος τοίχος","Stone wall"],["Παντζούρια","Shutters"],["Κληματαριά","Vine pergola"],["Δαντέλα","Lace"],["Κεραμίδια","Roof tiles"],["Φλιτζάνι","Coffee cup"],["Μπρίκι","Briki"],["Κομπολόι","Worry beads"],["Τάβλι","Backgammon"],["Ελιά","Olive"],["Ένα καφεδάκι!","A little coffee!"],["Φτου, μάτι!","Phew, evil eye!"],["Θέματα","Themes"],["Το έχεις ✓","You own it ✓"],["Τιμή: ","Price: "],["Με Pilotta Plus: ","With Pilotta Plus: "],["(έκπτωση 50%)","(50% off)"],["έκπτωση 50% με το Pilotta Plus που έχεις","50% off with your Pilotta Plus"],["έκπτωση 50% με Plus","50% off with Plus"],["Η αγορά θα ανοίξει σύντομα.","Purchase will open soon."],["Δες το στην Εμφάνιση","See it in Appearance"],["Το έχεις ήδη. Θα το βρεις στις επιλογές της Εμφάνισης.","You already own it. You will find it in the Appearance options."],["Περισσότερα θέματα έρχονται σύντομα.","More themes are coming soon."],["με Pilotta Plus","with Pilotta Plus"],["5 επιφάνειες τραπεζιού, 5 φόντα, 5 σχέδια φύλλων, 5 avatars και 5 emotes με θέμα το κυπριακό καφενείο.","5 table surfaces, 5 backgrounds, 5 card backs, 5 avatars and 5 emotes themed on the Cypriot café."],["Υπάρχει νέα έκδοση του παιχνιδιού. Θέλεις να ενημερώσεις τώρα;","A new version of the game is available. Do you want to update now?"],["Νέα έκδοση","New version"],["Αργότερα","Later"],["Ενημέρωση","Update"],["Το παιχνίδι κόπηκε. Ο γύρος τελειώνει.","The bid failed. The round ends."],["Οι αντίπαλοι πήραν αρκετούς πόντους και το παιχνίδι κόπηκε. Ο γύρος τελειώνει εδώ.","The opponents have taken enough points and the bid failed. The round ends here."],["Αν οι αντίπαλοι πάρουν τόσους πόντους που το άνοιγμα δεν μπορεί πια να επιτευχθεί, ο γύρος τελειώνει αμέσως (αρκεί η ομάδα του ανοίγματος να έχει πάρει τουλάχιστον μία μπάζα).","If the opponents take so many points that the bid can no longer succeed, the round ends at once (as long as the bidding team has won at least one trick)."],["Αν δεν παίξεις όταν έρθει η σειρά σου, παίρνεις ένα strike κάθε 30 δευτερόλεπτα και οι άλλοι βλέπουν × στο πρώτο και ×× στο δεύτερο δίπλα στο όνομά σου. Στο τρίτο βγαίνεις από το τραπέζι και παίζει bot στη θέση σου. Τα strikes δεν μηδενίζονται αν γυρίσεις, και ισχύουν μόνο για το ίδιο παιχνίδι.","If you do not play when it is your turn, you get a strike every 30 seconds, and the others see × for the first and ×× for the second next to your name. On the third you are removed from the table and a bot plays in your place. Strikes are not reset if you come back, and they only count for the same game."],["Προειδοποιήσεις: ","Warnings: "],["Στην 3η θα βγεις από το τραπέζι και θα παίξει bot στη θέση σου.","On the 3rd you will be removed from the table and a bot will play in your place."],["Σε έβγαλαν από το τραπέζι","You were removed from the table"],["Δεν απάντησες 3 φορές. Τη θέση σου πήρε bot.","You did not answer 3 times. A bot took your place."],["Σε έβγαλαν από το τραπέζι, γιατί δεν απάντησες 3 φορές.","You were removed from the table because you did not answer 3 times."],["Παίξτε με φίλους που είναι στο ίδιο δωμάτιο, χωρίς internet. Ο ένας φτιάχνει το τραπέζι και οι άλλοι το βρίσκουν.","Play with friends in the same room, without internet. One person creates the table and the others find it."],["Δεν μπόρεσα να ξεκινήσω. Δώσε τις άδειες Bluetooth/Κοντινές συσκευές και άνοιξε Bluetooth και Wi-Fi.","Could not start. Allow the Bluetooth/Nearby devices permissions and turn on Bluetooth and Wi-Fi."],["Δεν μπόρεσα να ψάξω. Δώσε τις άδειες Bluetooth/Κοντινές συσκευές και άνοιξε Bluetooth και Wi-Fi.","Could not search. Allow the Bluetooth/Nearby devices permissions and turn on Bluetooth and Wi-Fi."],["Ψάχνουμε… Ο φίλος σου πρέπει να έχει πατήσει «Φτιάξε τραπέζι».","Searching… Your friend must have tapped “Create a table”."],["Πήγαινε στο Κύριο μενού για να παίξεις με φίλους κοντά σου.","Go to the Main menu to play with friends near you."],["Αυτή η επιλογή υπάρχει μόνο στην εφαρμογή Android.","This option is only available in the Android app."],["Δεν μπόρεσα να συνδεθώ. Δοκίμασε ξανά.","Could not connect. Try again."],["Χάθηκε η σύνδεση με τον οικοδεσπότη.","Lost connection to the host."],["Τραπέζια κοντά σου","Tables near you"],["Φτιάξε τραπέζι","Create a table"],["Βρες τραπέζι","Find a table"],["Ξεκινάω…","Starting…"],["Το γρήγορο παιχνίδι και το παιχνίδι με φίλους θέλουν λογαριασμό. Συνδέσου από το κύριο μενού.","Quick match and playing with friends require an account. Sign in from the main menu."],["Το γρήγορο παιχνίδι, το παιχνίδι με φίλους και το «Κοντά μου» θέλουν λογαριασμό. Συνδέσου από το κύριο μενού.","Quick match, playing with friends and Nearby require an account. Sign in from the main menu."],["Συνέχισε ως επισκέπτης ή συνδέσου","Continue as a guest or sign in"],["Χωρίς λογαριασμό μπορείς να παίξεις έως ","Without an account you can play up to "],[" παιχνίδια με bots"," games against bots"],[" (σου απομένουν "," (remaining: "],["Με λογαριασμό παίζεις online με φίλους, κρατάς στατιστικά και rating και εμφανίζεσαι στη γενική κατάταξη.","With an account you can play online with friends, keep stats and a rating, and appear on the global leaderboard."],["Σύνδεση ή δημιουργία λογαριασμού","Sign in or create an account"],["Συνέχεια ως επισκέπτης","Continue as a guest"],["Σύνδεση με Google","Sign in with Google"],["ή με email","or with email"],["Διάλεξε username","Choose a username"],["Έτσι θα σε βλέπουν οι άλλοι παίκτες. Το email σου δεν φαίνεται σε κανέναν.","This is how other players will see you. Your email is not shown to anyone."],["Θα σου ζητηθεί να επιβεβαιώσεις με Google.","You will be asked to confirm with Google."],["Ο browser μπλόκαρε το παράθυρο της Google. Επίτρεψε τα αναδυόμενα παράθυρα και ξαναδοκίμασε.","Your browser blocked the Google window. Allow pop-ups and try again."],["Υπάρχει ήδη λογαριασμός με αυτό το email. Συνδέσου με email και κωδικό.","An account with this email already exists. Sign in with email and password."],["Αυτή η διεύθυνση δεν έχει εγκριθεί για σύνδεση με Google.","This address is not approved for Google sign-in."],["Αυτός ο τρόπος σύνδεσης δεν έχει ενεργοποιηθεί ακόμα.","This sign-in method is not enabled yet."],["Για οποιαδήποτε ερώτηση για τα δεδομένα σου, επικοινώνησε μαζί μας: ","For any question about your data, contact us: "],["Κωδικός τραπεζιού","Table code"],["Η θέση σου σε αυτή τη λίστα: ","Your position on this list: "],["Γράψε το username ενός φίλου. Για να γίνετε φίλοι πρέπει να αποδεχτεί το αίτημα. Οι φίλοι βλέπουν τα στατιστικά σου.","Type a friend's username. You become friends once they accept your request. Friends can see your statistics."],["Δεν έχεις φίλους ακόμα. Στείλε ένα αίτημα με το username τους.","You have no friends yet. Send a request with their username."],["Γράψε ένα σωστό username (3 έως 14 γράμματα ή αριθμούς).","Type a valid username (3 to 14 letters or numbers)."],["Δεν βρέθηκε παίκτης με αυτό το username.","No player found with that username."],["Αυτό είναι το δικό σου username.","That is your own username."],["Είστε ήδη φίλοι.","You are already friends."],["Είχε ήδη στείλει αίτημα σε εσένα, οπότε είστε πλέον φίλοι!","They had already sent you a request, so you are now friends!"],["Έχεις ήδη στείλει αίτημα. Περίμενε να το αποδεχτεί.","You have already sent a request. Wait for them to accept it."],["Το αίτημα στάλθηκε. Όταν το αποδεχτεί, θα εμφανιστεί στη λίστα σου.","The request was sent. When they accept it, they will appear in your list."],["Κάτι πήγε στραβά. Έλεγξε το internet και δοκίμασε ξανά.","Something went wrong. Check your internet and try again."],["Δεν μπόρεσα να το ολοκληρώσω. Δοκίμασε ξανά.","Could not complete that. Try again."],["Δεν μπόρεσα να φορτώσω. Έλεγξε το internet.","Could not load. Check your internet connection."],["Δεν μπόρεσα να φορτώσω την κατάταξη. Έλεγξε το internet.","Could not load the leaderboard. Check your internet connection."],["Έγινε! Είστε πλέον φίλοι.","Done! You are now friends."],["Ο φίλος αφαιρέθηκε.","Friend removed."],["θέλει να γίνετε φίλοι","wants to be your friend"],["Δεν έχει παίξει ακόμα","Has not played yet"],["δεν έχει παίξει","has not played"],["Μετράνε μόνο παιχνίδια με 4 πραγματικούς παίκτες (με φίλους ή γρήγορο παιχνίδι), όχι με bots ή Κοντά μου. Στη γενική κατάταξη φαίνονται μόνο το όνομα και το rating. Στις εβδομαδιαίες και μηνιαίες λίστες φαίνονται οι πόντοι Elo που κέρδισες στην περίοδο.","Only games with 4 real players count (with friends or quick match), not games with bots or Nearby. The general leaderboard shows only name and rating. The weekly and monthly lists show the Elo points you won in that period."],["Δεν υπάρχει κανείς ακόμα σε αυτή τη λίστα. Παίξε με 4 πραγματικούς παίκτες για να μπεις.","Nobody is on this list yet. Play with 4 real players to get on it."],["Δεν υπάρχει κανείς ακόμα σε αυτή τη λίστα.","Nobody is on this list yet."],["Εμφάνιση στη γενική κατάταξη: ΝΑΙ","Show me on the general leaderboard: YES"],["Εμφάνιση στη γενική κατάταξη: ΟΧΙ","Show me on the general leaderboard: NO"],["Εμφάνιση στη γενική κατάταξη","Show me on the general leaderboard"],["Φορτώνω τα στατιστικά σου…","Loading your statistics…"],["Επόμενη κατηγορία: ","Next category: "],[" στους "," at "],[" · σου λείπουν "," · you need "],["Είσαι στην ανώτατη κατηγορία!","You are in the top category!"],["Το παιχνίδι δεν μετρά στην κατάταξη (όριο παιχνιδιών της ημέρας).","This game does not count for the leaderboard (daily game limit)."],[" (ανέβηκες κατηγορία!)"," (you moved up a category!)"],[" (έπεσες κατηγορία)"," (you dropped a category)"],["Κατάταξη:","Ranking:"],["Άρχοντας της Πιλόττας","Lord of Pilotta"],["Προχωρημένος","Advanced"],["Έμπειρος","Experienced"],["Αρχάριος","Beginner"],["Μάστρος","Master"],["% νίκες","% wins"],[" παιχνίδια · "," games · "],[" παιχνίδια"," games"],["Αιτήματα","Requests"],["Οι φίλοι μου","My friends"],["Αποδοχή","Accept"],["Απόρριψη","Decline"],["Αφαίρεση","Remove"],["Αίτημα","Request"],["Username φίλου","Friend's username"],["Φορτώνω…","Loading…"],["Συνολικά","Overall"],["Εβδομάδα","Week"],["Μήνας","Month"],["Γενική","General"],["Κατάταξη","Leaderboard"],["Φίλοι","Friends"],[" (εσύ)"," (you)"],["Κοντά μου (χωρίς internet): παίζεις με φίλους που είναι στο ίδιο δωμάτιο, χωρίς internet. Ο ένας φτιάχνει το τραπέζι και οι άλλοι το βρίσκουν.","Nearby (no internet): you play with friends in the same room, without internet. One person creates the table and the others find it."],["Καλώς ήρθες στην Πιλόττα Παντού!","Welcome to Pilotta Pantou!"],["Παίζεις με τον Σύντροφό σου εναντίον δύο αντιπάλων. Θες μια γρήγορη ξενάγηση στα κουμπιά του παιχνιδιού;","You play with your Partner against two opponents. Would you like a quick tour of the game's buttons?"],["Ναι, δείξε μου τα κουμπιά","Yes, show me the buttons"],["Όχι, ξέρω να παίζω","No, I know how to play"],["Ξενάγηση, βήμα ","Quick guide, step "],["Παράλειψη","Skip"],["Το κεντρικό μενού","The main menu"],["Τρόποι παιχνιδιού","Ways to play"],["Μέσα στο παιχνίδι","During the game"],["Νέο παιχνίδι: ξεκινάς παιχνίδι, μόνος σου με bots, με φίλους ή γρήγορο παιχνίδι online.","New game: play on your own against bots, with friends, or in an online quick match."],["Πώς παίζεται (οδηγός): μια εξήγηση του παιχνιδιού, βήμα βήμα.","How to play (guide): an explanation of the game, step by step."],["Κανόνες: όλοι οι κανόνες και η βαθμολόγηση.","Rules: all the rules and how scoring works."],["Ρυθμίσεις: ήχος, επιφάνεια τραπεζιού, σχέδιο φύλλων, avatar και emotes.","Settings: sound, table surface, card design, avatar and emotes."],["Το κουμπί με τη σφαίρα αλλάζει τη γλώσσα, Ελληνικά ή English.","The globe button switches the language between Greek and English."],["Γρήγορο παιχνίδι: μπαίνεις σε ένα τραπέζι με άλλους τυχαίους παίκτες. Όπου λείπουν παίκτες, παίζουν bots. Με Pilotta Plus έχεις προτεραιότητα στην αναμονή.","Quick match: you join a table with random players. Bots fill any empty seats. With Pilotta Plus you get priority in the queue."],["Με φίλους: φτιάχνεις τραπέζι και δίνεις τον κωδικό, ή μπαίνεις με τον κωδικό ενός φίλου. Διαλέγεις μόνος σου θέση. Αν φύγει ο οικοδεσπότης, το παιχνίδι συνεχίζεται με άλλον παίκτη και τη θέση του παίρνει bot.","With friends: create a table and share its code, or join with a friend's code. You choose your own seat. If the host leaves, the game carries on with another player and a bot takes his seat."],["Offline (με bots): παίζεις μόνος σου με 3 bots.","Offline (with bots): play on your own against 3 bots."],["Πάνω βλέπεις τους πόντους: Εμείς, Στόχος και Αυτοί. Το χρώμα κάθε ομάδας φαίνεται και δίπλα στα ονόματα.","The scores are at the top: We, Target and They. Each team's colour also appears next to the player names."],["Τα φύλλα σου είναι κάτω. Τα φύλλα που μπορείς να παίξεις έχουν περίγραμμα, και πατάς πάνω τους για να τα ρίξεις.","Your cards are at the bottom. The cards you can play are outlined: tap one to play it."],["Πάνω δεξιά έχεις πάντα τους Κανόνες και το Μενού. Από το Μενού ανοίγεις και τις Ρυθμίσεις.","The Rules and the Menu are always at the top right. The Menu also opens the Settings."],["Σε παιχνίδι με άλλους παίκτες (γρήγορο ή με φίλους) έχεις και το κουμπί 💬 για emotes. Στο παιχνίδι με φίλους έχεις επίσης μικρόφωνο και κάμερα.","In a game with other players (quick match or with friends) you also have the 💬 button for emotes. In a game with friends you also have a microphone and camera."],["Αυτό το username δεν επιτρέπεται. Διάλεξε άλλο.","This username is not allowed. Choose another one."],["Δώσε τον κωδικό στους φίλους σου. Όσοι κάθονται απέναντι παίζουν μαζί. Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.","Give the code to your friends. Players sitting opposite each other are partners. If you do not have enough players, the host can add bots to the empty seats."],["Ομάδα Α: θέσεις 1 και 3","Team A: seats 1 and 3"],["Ομάδα Β: θέσεις 2 και 4","Team B: seats 2 and 4"],["Ομάδα Α","Team A"],["Ομάδα Β","Team B"],["Θέση 1","Seat 1"],["Θέση 2","Seat 2"],["Θέση 3","Seat 3"],["Θέση 4","Seat 4"],["Έπαιξες τα 2 δοκιμαστικά παιχνίδια. Φτιάξε λογαριασμό για να συνεχίσεις.","You have played the 2 trial games. Create an account to continue."],["Για να παίξεις Κοντά μου χρειάζεται λογαριασμός. Τον φτιάχνεις μία φορά, με internet.","To play Nearby you need an account. You only create it once, online."],["Για να παίξεις online χρειάζεται λογαριασμός.","To play online you need an account."],["Σύνδεση / Λογαριασμός","Sign in / Account"],["Νέος λογαριασμός","New account"],["Σύνδεση","Sign in"],["Δημιουργία λογαριασμού","Create account"],["Ξέχασα τον κωδικό","I forgot my password"],["Κωδικός (τουλάχιστον 6)","Password (at least 6 characters)"],["Username (3-14 γράμματα)","Username (3-14 characters)"],["Διάβασα και αποδέχομαι τη ","I have read and accept the "],["Δήλωση απορρήτου","Privacy statement"],["Για να συνεχίσεις αποδέξου τη Δήλωση απορρήτου.","To continue, accept the Privacy statement."],["Γράψε email και κωδικό.","Type your email and password."],["Γράψε πρώτα το email σου.","Type your email first."],["Σου στείλαμε email για να αλλάξεις κωδικό.","We sent you an email to reset your password."],["Αυτό το email χρησιμοποιείται ήδη.","This email is already in use."],["Το email δεν είναι σωστό.","The email is not valid."],["Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.","The password needs at least 6 characters."],["Λάθος email ή κωδικός.","Wrong email or password."],["Πολλές προσπάθειες. Περίμενε λίγο.","Too many attempts. Please wait a moment."],["Δεν υπάρχει σύνδεση στο internet.","There is no internet connection."],["Η σύνδεση με email δεν έχει ενεργοποιηθεί ακόμα.","Email sign-in is not enabled yet."],["Αυτό το username το έχει ήδη κάποιος.","Someone already has this username."],["Το username θέλει 3 έως 14 γράμματα, αριθμούς ή _ (χωρίς κενά).","The username needs 3 to 14 letters, numbers or _ (no spaces)."],["Κάτι πήγε στραβά. Έλεγξε το internet και δοκίμασε ξανά.","Something went wrong. Check your internet and try again."],["Μισό λεπτό…","One moment…"],["Στέλνω…","Sending…"],["Τι αποθηκεύουμε όταν φτιάχνεις λογαριασμό: το email σου (το κρατά η υπηρεσία σύνδεσης της Google, Firebase), το username και το avatar σου, και τα αποτελέσματα των online παιχνιδιών σου.","What we store when you create an account: your email (kept by Google's sign-in service, Firebase), your username and avatar, and the results of your online games."],["Τα στατιστικά σου (παιχνίδια, νίκες) τα βλέπουν μόνο οι φίλοι σου. Στη γενική κατάταξη φαίνονται μόνο το username και το rating σου. Το email σου δεν το βλέπει κανένας άλλος παίκτης.","Only your friends can see your statistics (games, wins). The general leaderboard shows only your username and rating. No other player sees your email."],["Δεν πουλάμε και δεν δίνουμε τα στοιχεία σου σε κανέναν. Τα παιχνίδια Κοντά μου και με bots δεν στέλνουν στατιστικά πουθενά.","We do not sell or give your details to anyone. Nearby games and games with bots do not send statistics anywhere."],["Μπορείς να διαγράψεις τον λογαριασμό σου όποτε θέλεις από το προφίλ σου. Τότε σβήνονται το email, το username, το avatar και τα στατιστικά σου.","You can delete your account at any time from your profile. Your email, username, avatar and statistics are then erased."],["Θα διαγραφούν ο λογαριασμός, το username, το avatar και τα στατιστικά σου. Δεν γίνεται αναίρεση. Γράψε τον κωδικό σου για να επιβεβαιώσεις.","Your account, username, avatar and statistics will be deleted. This cannot be undone. Type your password to confirm."],["Διαγραφή λογαριασμού","Delete account"],["Αποσύνδεση","Sign out"],["Διαγράφω…","Deleting…"],["Γράψε τον κωδικό σου.","Type your password."],["Διαγραφή","Delete"],["Άκυρο","Cancel"],["Ο κωδικός σου","Your password"],["Emotes άλλων: ","Others' emotes: "],["Το avatar σου","Your avatar"],["Τα emotes σου","Your emotes"],["Διάλεξε μία από τις 10 θέσεις και μετά ένα emote για να την αλλάξεις.","Pick one of the 10 slots, then an emote to replace it."],["Παρακαλώ","You're welcome"],["Βιάσου","Hurry up"],["Φωτιά!","Fire!"],["Μπράβο!","Bravo!"],["Μπράβο","Nice"],["Ωπ!","Whoa!"],["Χα χα","Haha"],["Ουφ","Phew"],["Εύκολο","Easy"],["Χμμ","Hmm"],["Ευχαριστώ","Thanks"],["Πάμε!","Let's go!"],["Σχέδιο φύλλων","Card design"],["Κλασικό","Classic"],["Λευκαρίτικο","Lefkara lace"],["Θάλασσα","Sea"],["Νύχτα","Night"],["Μπορντό","Burgundy"],["Μπλε","Blue"],["Τιρκουάζ","Teal"],["Ξύλο","Wood"],["Μπορείς να ξεκινήσεις όποτε θέλεις. Όσοι δεν έχουν διαλέξει θέση μπαίνουν σε τυχαία θέση και οι κενές θέσεις παίρνουν bots.","You can start whenever you like. Players who haven't chosen a seat are placed at random, and bots fill the empty seats."],["Διάλεξε θέση ή περίμενε. Αν ο οικοδεσπότης ξεκινήσει, θα μπεις σε τυχαία θέση.","Choose a seat or wait. If the host starts, you will get a random seat."],["Το παιχνίδι ξεκίνησε χωρίς εσένα.","The game started without you."],["Περιμένουν να καθίσουν: ","Waiting to sit: "],["Κενή (bot)","Empty (bot)"],["Αν η ομάδα του ανοίγματος αποτύχει, η δήλωση και η πιλόττα της πάνε στους αντιπάλους.","If the bidding team fails, its declaration and pilotta go to the opponents."],["Σε «Κλειστό» η ομάδα που χάνει δεν παίρνει τίποτα. Η δήλωση και η πιλόττα της πάνε στην ομάδα που κερδίζει.","In «Closed» the losing team gets nothing. Its declaration and pilotta go to the winning team."],["Αν η ομάδα του ανοίγματος αποτύχει, οι δηλώσεις της πάνε στους αντιπάλους.","If the bidding team fails, its declarations go to the opponents."],["Πόντοι γύρου (μόνο από τις μπάζες):","Round points (tricks only):"],["Μικρόφωνο: ΟΧΙ","Microphone: OFF"],["Μικρόφωνο: ΝΑΙ","Microphone: ON"],["Κάμερα: ΟΧΙ","Camera: OFF"],["Κάμερα: ΝΑΙ","Camera: ON"],["Δεν δόθηκε άδεια για μικρόφωνο.","Microphone permission was denied."],["Δεν δόθηκε άδεια για κάμερα.","Camera permission was denied."],["Η συσκευή ή ο browser δεν επιτρέπει μικρόφωνο.","This device or browser does not allow the microphone."],["Η συσκευή ή ο browser δεν επιτρέπει κάμερα.","This device or browser does not allow the camera."],["Πιλόττα Παντού","Pilotta Pantou"],["Οι γύροι αποθηκεύονται ανώνυμα (χωρίς ονόματα), για να γίνονται καλύτερα τα bots.","Rounds are saved anonymously (no names) to help improve the bots."],["Δώσε τον κωδικό στους φίλους σου. Οι θέσεις 1 και 3 παίζουν μαζί, και οι θέσεις 2 και 4. Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.","Give the code to your friends. Seats 1 and 3 play together, as do seats 2 and 4. If there are not enough players, the host can put bots in the empty seats."],["Βάλε bots στις κενές θέσεις","Add bots to empty seats"],["Βγάλε","Remove"],["Για να ξεκινήσει το παιχνίδι πρέπει και οι 4 θέσεις να είναι γεμάτες.","All 4 seats must be filled to start the game."],["Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.","If there are not enough players, the host can put bots in the empty seats."],["Με φίλους","With friends"],["Γράψε το όνομά σου. Μετά φτιάξε τραπέζι ή γράψε τον κωδικό που σου έδωσε ο φίλος σου.","Type your name. Then create a table or type the code your friend gave you."],["Νέο τραπέζι","New table"],["Κωδικός","Code"],["Μπες","Join"],["Όνομα","Name"],["Πίσω","Back"],["Συνδέομαι…","Connecting…"],["Δεν μπόρεσα να συνδεθώ. Έλεγξε το internet.","Could not connect. Check your internet."],["Ο κωδικός έχει 4 γράμματα.","The code has 4 letters."],["Δεν βρέθηκε τραπέζι με αυτόν τον κωδικό.","No table found with this code."],["Το παιχνίδι έχει ήδη ξεκινήσει.","The game has already started."],["Το τραπέζι είναι γεμάτο.","The table is full."],["Κάτσε","Sit here"],["Ξεκίνα","Start"],["Φύγε","Leave"],["(εσύ)","(you)"],["Περιμένουμε τον οικοδεσπότη να ξεκινήσει.","Waiting for the host to start."],["Στόχος","Target"],["Τραπέζι","Table"],["Δώσε τον κωδικό στους φίλους σου. Οι θέσεις 1 και 3 παίζουν μαζί, και οι θέσεις 2 και 4. Οι κενές θέσεις παίζονται από bots.","Give the code to your friends. Seats 1 and 3 play together, as do seats 2 and 4. Bots play the empty seats."],["Η σύνδεση για παιχνίδι με φίλους δεν έχει ρυθμιστεί σε αυτή την έκδοση.","Playing with friends is not set up in this version."],["Περιμένουμε…","Waiting…"],["Ήχος: ΝΑΙ","Sound: ON"],["Ήχος: ΟΧΙ","Sound: OFF"],["παίρνει όλες τις υπόλοιπες μπάζες","takes all the remaining tricks"],["Πώς θέλεις να παίξεις;","How do you want to play?"],["Γρήγορο παιχνίδι","Quick match"],["Με φίλους","With friends"],["Offline (με bots)","Offline (with bots)"],["Θα σε βάζει σε τραπέζι με 4 τυχαίους παίκτες online.","It puts you at a table with random players online."],["Μέχρι 4 άτομα στο ίδιο τραπέζι. Κάθε παίκτης που μπαίνει θα διαλέγει πού θα κάτσει.","Up to 4 people at the same table. Each player who joins will choose where to sit."],["Δεν είναι έτοιμο ακόμα. Σύντομα.","Not ready yet. Coming soon."],["Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Συνήθως λες την ψηλότερη δήλωσή σου, αλλά μπορείς να πεις και λιγότερο, και μετράει μόνο όσο δηλώσεις: με πενήντα που δηλώνεις 20 δείχνεις την ψηλότερη τρίτη και μετράνε 20, με δύο τρίτες λες 20 και μετράνε 40, με πενήντα και τρίτη λες 50 και μετράνε 70. Αν η δήλωση της ομάδας σου κερδίσει, τις δείχνεις όλες και μετράνε όλες. Αν δηλώσεις περισσότερο από όσο έχεις, δεν μετράει. Την τετράδα τη δηλώνεις μόνο με την αξία της.","In the 1st trick, you may declare yourself before you play a card. It is optional: if you play a card, you declare nothing. Usually you announce your highest declaration, but you may announce less, and only what you announce counts: with a fifty announced as 20 you show its highest tierce and 20 counts; with two tierces you say 20 and 40 counts; with a fifty and a tierce you say 50 and 70 counts. If your team's declaration wins, you show them all and they all count. If you announce more than you have, it doesn't count. A carré can only be announced for its own value."],["Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Συνήθως λες την ψηλότερη δήλωσή σου, αλλά μπορείς να πεις και λιγότερο: μετράει μόνο όσο δηλώσεις (με πενήντα που δηλώνεις 20, δείχνεις την ψηλότερη τρίτη και μετράνε 20). Με δύο τρίτες λες 20 και μετράνε 40. Αν η δήλωση της ομάδας σου κερδίσει, δείχνεις όλες τις δηλώσεις σου. Αν δηλώσεις περισσότερο από όσο έχεις, δεν μετράει. Την τετράδα τη δηλώνεις μόνο με την αξία της.","In the 1st trick, you may declare yourself before you play a card. It is optional: if you play a card, you declare nothing. Usually you announce your highest declaration, but you can announce less: only what you announce counts (with a fifty announced as 20, you show its highest tierce and 20 counts). With two tierces you say 20 and 40 counts. If your team's declaration wins, you show all your declarations. If you announce more than you have, it doesn't count. A carré can only be announced for its own value."],["Ξεκινούν από 80, πολλαπλάσια του 10, και κάθε άνοιγμα ανεβάζει. Η 250 σημαίνει όλες τις μπάζες, και με τις δηλώσεις μπορείς να πας πιο ψηλά. Το μέγιστο άνοιγμα είναι 800.","Bids start at 80, in multiples of 10, and each bid must be higher than the last. 250 means all the tricks, and with declarations you can go higher. The highest bid allowed is 800."],["Οποιοσδήποτε αντίπαλος του ψηλότερου ανοίγματος μπορεί να πει «Κλειστό» όποτε έρθει η σειρά του, μέχρι να κλείσουν τα ανοίγματα. Το άνοιγμα μετράει ×2 και τα ανοίγματα κλείνουν. Μετά, μόνο η ομάδα του ανοίγματος μπορεί να πει «Ανοιχτό» (×4).","Either opponent of the highest bidder may say «Closed» on their turn, as long as bidding is still open. The bid then counts ×2 and bidding ends. After that, only the bidding team may say «Open» (×4)."],["150: τέσσερα εννιάρια, ζητώ Βαλέ ή να με γυρίσει εκεί που τον έχει. 160: τέσσερις Άσοι, να με γυρίσει όπου είναι πιο δυνατός στα κόζια. 220: τέσσερις Βαλέδες, ζητώ εννιάρι ή να με γυρίσει όπου το έχει (τουλάχιστον στο Σπαθί).","150: four nines. I ask for the Jack, or for my partner to switch to the suit where he holds it. 160: four Aces. My partner should switch to his strongest trump suit. 220: four Jacks. I ask for the nine, or for my partner to switch to the suit where he holds it (at least in Clubs)."],["Μετράει μόνο η ομάδα με τη μεγαλύτερη δήλωση, και παίρνει και του συντρόφου. Στα ίσα ισχύει η σειρά που τελειώνει σε ψηλότερο φύλλο. Στα απολύτως ίσα, κερδίζει όποια είναι σε κόζια, αλλιώς δεν μετράει καμία.","Only the team with the highest declaration scores, and it also scores its partner's declarations. On a tie, the run ending in the higher card wins. On an exact tie, the one in trumps wins; otherwise neither counts."],["Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το κάνεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η μπάζα, όπου μπορεί να δείξει ο αντίπαλος.","In the 2nd trick, if your team has the highest declaration, press «Show your declaration» before you play a card. If you don't, it is lost and the declarations are compared again in the 3rd trick, where the opponents may show theirs."],["80 σημαίνει Βαλές ή εννιάρι και τουλάχιστον έναν Άσο. 90: και τα δύο κόζια. 100: πες μου τους Άσους σου. 130 και 140: έχω πενήντα. 180 και 190: έχω πέντε στη σειρά. 150: τέσσερα εννιάρια. 160: τέσσερις Άσοι. 220: τέσσερις Βαλέδες.","80 means Jack or nine and at least one Ace. 90: both top trumps. 100: tell me your Aces. 130 and 140: I have a fifty. 180 and 190: I have a run of five. 150: four nines. 160: four Aces. 220: four Jacks."],["Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο: Βαλές της φυλής του 1, εννιάρι της φυλής του με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, και κάθε Άσος εκτός κοζιών 1 ακόμα.","When your partner bids, you raise by 10 for each point: Jack of his suit 1, nine of his suit with at least one more trump 1, Jack and nine together 3, and 1 more for each Ace outside trumps."],["Πόσο ανεβαίνεις έχει νόημα: άνοιγμα 80 ή +10 πάνω από το προηγούμενο άνοιγμα σημαίνει Βαλές ή 9 με Άσο. 90 ή +20: Βαλές και 9. 100 ή +30: ζητάς από τον σύντροφο να πει τους Άσους του εκτός κοζιών.","The size of your raise matters: opening 80 or raising by 10 means Jack or 9 with an Ace. 90 or +20: Jack and 9. 100 or +30: you ask your partner to show his Aces outside trumps."],["Πόσο ανεβαίνεις: 80 ή +10 πάνω από το προηγούμενο άνοιγμα = Βαλές ή 9 με Άσο. 90 ή +20 = Βαλές και 9. 100 ή +30 = ο σύντροφος να πει τους Άσους του εκτός κοζιών, και προσθέτει 10 για κάθε τέτοιο Άσο.","How much you raise: 80 or +10 over the previous bid = Jack or 9 with an Ace. 90 or +20 = Jack and 9. 100 or +30 = your partner should show his Aces outside trumps, adding 10 for each one."],["Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο που έχεις: Βαλές της φυλής του 1, εννιάρι με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, κάθε Άσος εκτός κοζιών 1.","When your partner bids, you raise by 10 for each point you have: Jack of his suit 1, nine with at least one more trump 1, Jack and nine together 3, each Ace outside trumps 1."],["Όταν τα κόζια είναι δικά σας και πετάς φύλλα σε μπάζα του συντρόφου: κατεβαίνεις (Ρήγας, Ντάμα, 9) αν δεν έχεις Άσο σε εκείνη τη φυλή, ανεβαίνεις (9, Βαλές, Ρήγας) αν έχεις.","When your team holds the trumps and you discard on your partner's trick: play high to low (King, Queen, 9) if you have no Ace in that suit, low to high (9, Jack, King) if you do."],["Το σκορ μετριέται σε δεκάδες. Στους πόντους του γύρου, αν το τελευταίο ψηφίο είναι 7 ή πάνω, στρογγυλοποιείς προς τα πάνω (17 γίνεται 2), αλλιώς προς τα κάτω (16 γίνεται 1).","The score is kept in tens. For round points, if the last digit is 7 or more you round up (17 becomes 2), otherwise you round down (16 becomes 1)."],["Το άνοιγμα πετυχαίνει όταν η ομάδα κάνει τουλάχιστον όσους πόντους έταξε. Η δήλωση και η πιλόττα της μετρούν ήδη σε αυτό (π.χ. άνοιγμα 80 με τρίτη: πρέπει να κάνει 60).","The bid succeeds when the team makes at least as many points as it bid. Its declarations and pilotta count towards this (e.g. a bid of 80 with a tierce: it must make 60)."],["Η ομάδα του ανοίγματος ανοίγει πρώτα κόζια για να πάρει τα κόζια των αντιπάλων. Όταν ο σύντροφος παίζει κόζια, ρίχνεις τα δυνατά σου κόζια (όχι το 9 αν βγει ο Βαλές).","The bidding team leads trumps early to draw the opponents' trumps. When your partner leads trumps, you play your strong trumps (but not the 9 if the Jack has been played)."],["Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το πατήσεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η.","In the 2nd trick, if your team has the highest declaration, press «Show your declaration» before you play a card. If you don't, it is lost and the declarations are compared again in the 3rd trick."],["Πιλόττα: Ρήγας και Ντάμα στα κόζια, 20. Μετράει πάντα και δεν δηλώνεται στην 1η μπάζα. Την ανακοινώνεις όταν ρίξεις το πρώτο (πιλόττα) και το δεύτερο (ρεπιλόττα).","Pilotta: King and Queen of trumps, worth 20. It always counts and is not declared in the 1st trick. You announce it as you play the first card («Pilotta») and the second («Repilotta»)."],["100: ο σύντροφος να πει ποιους Άσους έχει, ανεξάρτητα από τα κόζια του. Έτσι ανοίγεις και όταν ο αντίπαλος έχει ήδη προσφέρει 80 σε άλλη φυλή, αντί για 90.","100: your partner should say which Aces he has, regardless of his trumps. This lets you open 100 instead of 90 even when an opponent has already bid 80 in another suit."],["4 παίκτες σε 2 ομάδες: εσύ και ο Σύντροφος απέναντι στο Bot 1 και στο Bot 2. 32 φύλλα, από το 7 ως τον Άσο. Η φορά είναι αντίθετη από των δεικτών του ρολογιού.","4 players in 2 teams: you and your Partner against Bot 1 and Bot 2. 32 cards, from 7 up to Ace. Play goes counter-clockwise."],["Η ομάδα του ανοίγματος που παίρνει όλες τις μπάζες παίρνει 25 αντί για 16. Αν οι αντίπαλοι πάρουν όλες τις μπάζες («ανάποδο»), κερδίζουν αμέσως το παιχνίδι.","If the bidding team takes all the tricks, it gets 25 instead of 16. If the opponents take all the tricks («reverse»), they win the game immediately."],["Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Δεν το έχεις; Αν έχεις κόζια, πρέπει να κόψεις, ακόμα και πάνω από τον σύντροφό σου. Αυτό είναι το τσάκκισμα.","You must follow suit. Can't? If you have trumps, you must cut, even if your partner is winning. This is forced trumping (tsakkisma)."],["Οποιοσδήποτε αντίπαλος του ψηλότερου ανοίγματος μπορεί να πει «Κλειστό» (×2 στο άνοιγμα). Η ομάδα του ανοίγματος μπορεί τότε να απαντήσει «Ανοιχτό» (×4).","Any opponent of the highest bid may say «Closed» (×2 on the bid). The bidding team may then answer «Open» (×4)."],["Αν η ομάδα δεν είχε δήλωση και έκανε μόνο 70, χάνει. Οι αντίπαλοι παίρνουν 8 (άνοιγμα) + 16 (ολόκληρος ο γύρος) = 24, και η ομάδα του ανοίγματος τίποτα.","If the team had no declaration and made only 70, it fails. The opponents get 8 (bid) + 16 (whole round) = 24, and the bidding team gets nothing."],["Κερδίζει όποιος φτάσει πρώτος στον στόχο (101 έως 601, ανά 50). Αν φτάσουν και οι δύο, κερδίζει το μεγαλύτερο σκορ. Σε ισοπαλία παίζεται κι άλλος γύρος.","The first team to reach the target wins (101 to 601, in steps of 50). If both reach it, the higher score wins. If they are tied, another round is played."],["Ποτέ δεν προσθέτεις πόντους που δεν μπορεί να βγάλει η ομάδα. Αν ο σύντροφος επιμένει και έχεις δήλωση, μπορείς να του βάλεις «ψεύτικους» πόντους.","Never add points your team cannot make. If your partner keeps raising and you have a declaration, you can add «fake» points to help him."],["Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Αν δεν έχεις και έχεις κόζια, πρέπει να τσακκίσεις (να κόψεις), ακόμα κι αν κερδίζει ο σύντροφός σου.","You must follow suit. If you can't and you have trumps, you must cut (forced trumping), even if your partner is winning."],["Άνοιγμα 80 στο Καρό: η ομάδα πρέπει να κάνει τουλάχιστον 80 από τους 162 πόντους του γύρου. Έχει τρίτη (20); Χρειάζεται μόνο 60 από τα φύλλα.","Bid 80 in Diamonds: the team must make at least 80 of the round's 162 points. Does it have a tierce (20)? Then it needs only 60 from the cards."],["Στο παιχνίδι: Πιλόττα με Ντάμα σημαίνει τουλάχιστον 3 κόζια, με Ρήγα σημαίνει μόνο την πιλόττα. Όταν κόβεις στην 1η μπάζα, ρίχνεις μικρό κόζι.","In play: a pilotta started with the Queen means at least 3 trumps; started with the King, it means only the pilotta. When you cut in the 1st trick, use a small trump."],["Η ομάδα έκανε 100 πόντους και είχε τρίτη: παίρνει 10 (φύλλα) + 2 (τρίτη) + 8 (άνοιγμα) = 20 στο σκορ. Οι αντίπαλοι με 62 πόντους παίρνουν 6.","The team made 100 points and had a tierce: it scores 10 (cards) + 2 (tierce) + 8 (bid) = 20. The opponents, with 62 points, get 6."],["5. Μετράτε πόντους. Αν η ομάδα του ανοίγματος έκανε όσους υποσχέθηκε, τους παίρνει μαζί με το άνοιγμα. Αλλιώς τους παίρνουν οι αντίπαλοι.","5. Count the points. If the bidding team made what it bid, it scores them plus the bid. Otherwise the opponents take them."],["Οι φυλές: Κούπα ♥, Καρό ♦, Σπαθί ♣, Πίκα ♠. Τα φύλλα σου εμφανίζονται ανά φυλή, κόκκινη και μαύρη εναλλάξ, από το μικρό στο μεγάλο.","The suits: Hearts ♥, Diamonds ♦, Clubs ♣, Spades ♠. Your cards are sorted by suit, alternating red and black, from low to high."],["Αν έχεις τα πιο δυνατά φύλλα μιας φυλής, ρίχνεις τον Άσο της για να δείξεις στον σύντροφο ότι θα του κάνεις τις μπάζες που του λείπουν.","If you hold the top cards of a suit, play its Ace to show your partner that you will win the tricks he is missing."],["Αποτυχημένο: οι αντίπαλοι παίρνουν το άνοιγμα, 16 για τον γύρο, τις δηλώσεις τους και την πιλόττα. Η ομάδα του ανοίγματος παίρνει 0.","Failed bid: the opponents get the bid, 16 for the round, their declarations and the pilotta. The bidding team gets 0."],["Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100, με 9 150, με βαλέδες 200 (7 και 8 δεν μετράνε).","Three in a row: 20. Four in a row: 50. Five or more: 100. Four of a kind: 100; nines 150, Jacks 200 (7s and 8s don't count)."],["Αν η ομάδα του ανοίγματος πετύχει: παίρνει τους πόντους της, το άνοιγμα και τις δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους.","If the bidding team succeeds: it gets its points, the bid and the declarations. The opponents get their own."],["Όλες οι μπάζες από την ομάδα του ανοίγματος: 25 αντί για 16. Όλες οι μπάζες από τους αντιπάλους: «ανάποδο», κερδίζουν το παιχνίδι.","All tricks to the bidding team: 25 instead of 16. All tricks to the opponents: «reverse», and they win the game."],["Δήλωση (προαιρετική): αν έχεις, πες τη δήλωσή σου πριν ρίξεις φύλλο (συνήθως την ψηλότερη, και μετράει μόνο όσο πεις). Αν ρίξεις φύλλο χωρίς δήλωση, δεν δηλώνεις τίποτα.","Declaration (optional): if you have one, announce it before you play a card (usually your highest, and only what you announce counts). If you play a card without declaring, you declare nothing."],["Ο «Οδηγός παιχνιδιού» στο μενού προτείνει κάθε κίνηση και την εξηγεί. Είναι κλειστός από την αρχή και ανοίγει από το ίδιο μενού.","The «Game coach» in the menu suggests every move and explains it. It is off from the start and can be turned on from the same menu."],["Πετυχημέντο άνοιγμα: η ομάδα παίρνει πόντους φύλλων, άνοιγμα και δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους πόντους.","Successful bid: the team gets its card points, the bid and its declarations. The opponents get their own points."],["Ρήγας και Ντάμα στα κόζια είναι η πιλόττα (20). Δεν δηλώνεται, αλλά μετράει πάντα. Την ανακοινώνεις όταν ρίχνεις τα φύλλα.","King and Queen of trumps are the pilotta (20). It is not declared, but it always counts. You announce it when you play the cards."],["Αν αποτύχει: οι αντίπαλοι παίρνουν το άνοιγμα, 162 πόντους και τις δηλώσεις, και η ομάδα του ανοίγματος παίρνει μηδέν.","If it fails: the opponents get the bid, the 162 points and the declarations, and the bidding team gets nothing."],["Κάθε γύρος έχει 8 μπάζες και 162 πόντους. Οι πόντοι έρχονται από τα φύλλα που μαζεύουν οι μπάζες και από τις δηλώσεις.","Each round has 8 tricks and 162 points. Points come from the cards won in tricks and from declarations."],["Το άνοιγμα 250 σημαίνει όλες τις μπάζες. Με δηλώσεις μπορεί να ανέβει ακόμα παραπάνω. Το απόλυτο μέγιστο είναι 800.","A bid of 250 means all the tricks. With declarations it can go even higher. The absolute maximum is 800."],["Όταν παίζονται κόζια, ο επόμενος πρέπει να ρίξει πιο δυνατό κόζια αν έχει. Αν δεν έχει, ρίχνει όποιο κόζια θέλει.","When trumps are led, each player must play a higher trump if he has one. If not, he plays any trump."],["Κόζια: Βαλές 20, 9 14, Άσος 11, 10 10, Ρήγας 4, Ντάμα 3. Άλλες φυλές: Άσος 11, 10 10, Ρήγας 4, Ντάμα 3, Βαλές 2.","Trumps: Jack 20, 9 14, Ace 11, 10 10, King 4, Queen 3. Other suits: Ace 11, 10 10, King 4, Queen 3, Jack 2."],["80: Βαλές ή εννιάρι και τουλάχιστον έναν Άσο εκτός κοζιών. Ο σύντροφος να πει αν έχει το άλλο και ποιους Άσους.","80: Jack or nine and at least one Ace outside trumps. Your partner should say whether he has the other one, and which Aces."],["Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100 (εννιάρια 150, βαλέδες 200).","Three in a row: 20. Four in a row: 50. Five or more: 100. Four of a kind: 100 (nines 150, Jacks 200)."],[" Έχεις και πιλόττα (Ρήγα και Ντάμα στα κόζια): δεν δηλώνεται, την ανακοινώνεις όταν ρίξεις το πρώτο από τα δύο."," You also have the pilotta (King and Queen of trumps): it is not declared; you announce it when you play the first of the two."],["Ο σύντροφός σου ανέβασε +20: ζητά τους Άσους σου, αλλά μόνο αν έχεις τουλάχιστον ένα κόζι στη φυλή του. Έχεις ","Your partner raised by 20: he is asking for your Aces, but only if you have at least one trump in his suit. You have "],["90: και Βαλές και εννιάρι. Ο σύντροφος προσθέτει 10 για κάθε Άσο εκτός κοζιών, αν έχει τουλάχιστον ένα κόζι.","90: both Jack and nine. Your partner adds 10 for each Ace outside trumps, if he has at least one trump."],["Δοκίμασε να παίξεις πρώτα με χαμηλά ανοίγματα (80 με 100) μέχρι να συνηθίσεις τις μπάζες και το τσάκκισμα.","Start with low bids (80 to 100) until you get used to the tricks and forced trumping."],["3. 1η μπάζα: δηλώνεις αν έχεις δήλωση (προαιρετικό). 2η μπάζα: η ομάδα με τη μεγαλύτερη δήλωση τη δείχνει.","3. 1st trick: declare if you have a declaration (optional). 2nd trick: the team with the highest declaration shows it."],["Έχεις Βαλέ ή εννιάρι της φυλής με Άσο εκτός και τουλάχιστον 3 κόζια. Το 80 το λέει και στον σύντροφό σου.","You have the Jack or nine of the suit, an outside Ace and at least 3 trumps. Bidding 80 also tells your partner this."],["Το άνοιγμα είναι υπόσχεση: η ομάδα του πρέπει να κάνει τόσους πόντους. Αλλιώς τους παίρνουν οι αντίπαλοι.","The bid is a promise: the team must make that many points. Otherwise the opponents take them."],["Τελειώνουν όταν μετά από ένα άνοιγμα ακολουθούν 3 πάσο στη σειρά. Ένα νέο άνοιγμα μηδενίζει το μέτρημα.","Bidding ends when a bid is followed by 3 passes in a row. A new bid restarts the count."],["Κόζια: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7. Στις άλλες φυλές: Άσος, 10, Ρήγας, Ντάμα, Βαλές, 9, 8, 7.","Trumps: Jack, 9, Ace, 10, King, Queen, 8, 7. In other suits: Ace, 10, King, Queen, Jack, 9, 8, 7."],["Έχεις πέντε φύλλα στη σειρά (εκατό) με Βαλέ: το bid είναι 80 (μόνο Βαλές) ή 90 (Βαλές και 9) συν τα 100.","You have five in a row (a hundred) with the Jack: bid 80 (Jack only) or 90 (Jack and 9) plus the 100."],["Ανοίγεις κόζια για να χάσουν οι αντίπαλοι τα δυνατά τους κόζια. Παίζεις μικρό για να μη χάσεις πόντους.","You lead trumps to draw out the opponents' strong trumps. You lead low so you don't lose points."],["Χωρίς φυλή και χωρίς κόζια, ρίχνεις ό,τι θες. Την επόμενη μπάζα ανοίγει όποιος κέρδισε την προηγούμενη.","With no suit and no trumps, you play whatever you like. The winner of the previous trick leads the next."],["2. Ανοίγματα: λέτε πάσο ή προσφέρετε πόντους και φυλή. Η φυλή του τελευταίου ανοίγματος γίνεται κόζια.","2. Bidding: each player passes or bids points and a suit. The suit of the last bid becomes trumps."],["Δίνεις τη μπάζα επίτηδες: κρατάς τον Άσο για αργότερα, ώστε να πάρεις και το 10 που δεν έχει παιχτεί.","You give up the trick on purpose: you keep your Ace for later, so you can also catch the 10 that hasn't been played yet."],["Πιλόττα με Ντάμα σημαίνει τουλάχιστον 3 κόζια. Πιλόττα με Ρήγα σημαίνει ότι κρατάς μόνο την πιλόττα.","A pilotta started with the Queen means at least 3 trumps. Started with the King, it means you hold only the pilotta."],["Έχεις Βαλέ, εννιάρι και 4 ή περισσότερα κόζια. Το 100 ζητά από τον σύντροφο να πει τους Άσους του.","You have the Jack, the nine and 4 or more trumps. Bidding 100 asks your partner to show his Aces."],["130 (10 έως Ρήγας ή Βαλές έως Άσος) και 140 (άλλο πενήντα): έχω πενήντα. Ψάχνω εννιάρι και Άσους.","130 (10 to King or Jack to Ace) and 140 (another fifty): I have a fifty. I'm looking for the nine and Aces."],["180 και 190: έχω πέντε ή περισσότερα στη σειρά (100) με Βαλέ. 180 = μόνο Βαλές (80+100), 190 = Βαλές και εννιάρι (90+100).","180 and 190: I have a run of five or more (100) with the Jack. 180 = Jack only (80+100), 190 = Jack and nine (90+100)."],["Δεν έχεις ούτε τη φυλή ούτε κόζια; Ρίχνεις ό,τι θες. Στη μπάζα που κέρδισες ανοίγεις την επόμενη.","You have neither the suit nor trumps? Play anything. Whoever wins a trick leads the next one."],["Δεν έχεις ούτε τη φυλή ούτε κόζια, ρίχνεις ό,τι θες. Ρίχνεις αυτό που σου χρειάζεται λιγότερο.","You have neither the suit nor trumps, so you can play anything. Play the card you need least."],["Είναι το πιο δυνατό φύλλο της φυλής που έμεινε, άρα παίρνει τη μπάζα (εκτός αν κοπεί με κόζι).","It is the highest card left in the suit, so it wins the trick (unless someone cuts with a trump)."],["Ένα φύλλο μετράει σε μία μόνο δήλωση. Μεγάλη σειρά σπάει σε δύο (π.χ. 7-8-9 και 10 έως Άσος).","A card can count in only one declaration. A long run splits into two (e.g. 7-8-9 and 10 to Ace)."],["Δεν μπορείς να κερδίσεις τη μπάζα, οπότε ρίχνεις το φύλλο που χάνει τους λιγότερους πόντους.","You can't win the trick, so you play the card that gives away the fewest points."],["Η φυλή του τελευταίου ανοίγματος γίνεται κόζια. Τα ανοίγματα κλείνουν όταν ακολουθούν 3 πάσο.","The suit of the last bid becomes trumps. Bidding ends when 3 passes follow."],[" Θυμήσου: η ομάδα σου πρέπει να κάνει τόσους πόντους από τους 162, και οι δηλώσεις μετράνε."," Remember: your team must make that many points out of 162, and declarations count."],["Δεν έχεις αρκετή δύναμη στα κόζια (Βαλέ ή 9 με Άσο εκτός και 3 κόζια). Πάσο είναι ασφαλές.","You don't have enough in trumps (Jack or 9 with an outside Ace and 3 trumps). It's safer to pass."],["ζητά 3 μπάζες σε μια φυλή εκτός κόζια, δηλαδή Άσο, 10 και Ρήγα (10 για κάθε τέτοια φυλή).","he is asking for 3 tricks in a suit outside trumps, i.e. Ace, 10 and King (10 for each such suit)."],["Όταν παίζονται κόζια, ρίχνεις πιο δυνατό κόζια αν έχεις. Αλλιώς ρίχνεις όποιο κόζια θες.","When trumps are led, play a higher trump if you have one. Otherwise play any trump."],["Ο σύντροφός σου ανέβασε το άνοιγμα κατά 30 (ή άνοιξε 100): ζητά τους Άσους σου. Έχεις ","Your partner raised the bid by 30 (or opened 100): he is asking for your Aces. You have "],["Είναι το πιο δυνατό κόζι που έμεινε: παίρνει τη μπάζα και τραβά τα κόζια των αντιπάλων.","It is the highest trump left: it wins the trick and draws out the opponents' trumps."],["Το σκορ μετριέται σε δεκάδες. Κερδίζει η ομάδα που φτάνει πρώτη τον στόχο που διάλεξες.","The score is kept in tens. The first team to reach the target you chose wins."],["Αν πεις «Ανοιχτό», το άνοιγμα μετράει ×4. Μόνο η ομάδα του ανοίγματος μπορεί να το πει.","If you say «Open», the bid counts ×4. Only the bidding team can say it."],["Η ομάδα σου έχει τη μεγαλύτερη δήλωση. Αν ρίξεις φύλλο χωρίς να τη δείξεις, χάνεται.","Your team has the highest declaration. If you play a card without showing it, it is lost."],["Όταν κόβεις φυλή στην 1η μπάζα, ρίχνεις μικρό κόζι για να το καταλάβει ο σύντροφος.","When you cut a suit in the 1st trick, use a small trump so your partner gets the message."],["Κάθε παίκτης λέει πάσο ή άνοιγμα: 80 ή πάνω, πολλαπλάσια του 10, μαζί με μια φυλή.","Each player passes or bids 80 or more, in multiples of 10, together with a suit."],["Κάθε άνοιγμα έχει και φυλή, και η φυλή του τελευταίου ανοίγματος γίνεται κόζια.","Each bid also names a suit, and the suit of the last bid becomes trumps."],["Το άνοιγμα πρέπει να είναι μεγαλύτερο από το τελευταίο. Το χέρι σου αντέχει ","The bid must be higher than the last one. Your hand can support "],["Με «Κλειστό» ή «Ανοιχτό» παίρνει πόντους μόνο η ομάδα που κερδίζει τον γύρο.","With «Closed» or «Open», only the team that wins the round scores."],["Ο γύρος έχει 162 πόντους: 152 από τα φύλλα και 10 για την τελευταία μπάζα.","A round has 162 points: 152 from the cards and 10 for the last trick."],["Με αυτό το φύλλο παίρνεις τη μπάζα, και είναι το πιο μικρό που κερδίζει.","This card wins the trick, and it is the lowest card that does."],["Με το κουμπί «Προηγούμενη μπάζα» βλέπεις τα φύλλα της τελευταίας μπάζας.","Use the «Previous trick» button to see the cards of the last trick."],["Ο σύντροφός σου παίρνει τη μπάζα, δεν χρειάζεται να ρίξεις μεγάλο φύλλο.","Your partner is winning the trick, so you don't need to play a high card."],["Παίζεις με τον Σύντροφό σου εναντίον δύο αντιπάλων. 4 παίκτες, 32 φύλλα.","You play with your Partner against two opponents. 4 players, 32 cards."],["Έχεις τέσσερα φύλλα στη σειρά (πενήντα): το bid το λέει στον σύντροφο.","You have four in a row (a fifty): your bid tells your partner."],["Παίζετε σε ζευγάρια: εσύ με τον Σύντροφο απέναντι στο Bot 1 και στο Bot 2.","You play in pairs: you and your Partner against Bot 1 and Bot 2."],["Η πιλόττα της ομάδας που χάνει πάει στην ομάδα που κερδίζει τον γύρο.","The losing team's pilotta goes to the team that wins the round."],[" και το χέρι σου δεν αρκεί για να το ξεπεράσεις με ασφάλεια. Πάσο."," and your hand is not enough to beat it safely. Pass."],["4. Παίζονται 8 μπάζες. Όποιος παίρνει τη μπάζα ανοίγει την επόμενη.","4. 8 tricks are played. The winner of a trick leads the next."],["Σε «Κλειστό» που πετυχαίνει, δεν μετράνε οι δηλώσεις των αντιπάλων.","When «Closed» succeeds, the opponents' declarations don't count."],[". Πάτα «Δηλώνω» πριν ρίξεις φύλλο. Αν κερδίσει, τις δείχνεις όλες.",". Press «Declare» before you play a card. If it wins, you show them all."],["Ο σύντροφός σου παίρνει τη μπάζα, οπότε βάζεις πολλούς πόντους (","Your partner is winning the trick, so you give him plenty of points ("],["Στα κόζια η σειρά είναι: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7.","In trumps the order is: Jack, 9, Ace, 10, King, Queen, 8, 7."],["Μια μπάζα χωρίς πόντους μετράει 10 (20 αν είναι η τελευταία).","A trick with no points counts 10 (20 if it is the last)."],["Έχεις μόνο ένα επιτρεπτό φύλλο, οπότε δεν υπάρχει επιλογή.","You have only one legal card, so there is no choice."],["Διάλεξε στόχο σκορ. Όποια ομάδα τον φτάσει πρώτη κερδίζει.","Choose a target score. The first team to reach it wins."],["Δεν έχεις δήλωση (τρία φύλλα στη σειρά ή τέσσερα ίδια).","You have no declaration (three in a row or four of a kind)."],["Οι bots παίζουν έτσι, οπότε μπορείς να τους διαβάζεις.","The bots play this way, so you can read their signals."],[" αλλά δεν έχεις τέτοια δήλωση. Δεν μετράει."," but you do not h
