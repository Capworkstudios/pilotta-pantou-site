assword."], ["Αυτό το email χρησιμοποιείται ήδη.", "This email is already in use."], ["Το email δεν είναι σωστό.", "The email is not valid."], ["Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.", "The password needs at least 6 characters."], ["Λάθος email ή κωδικός.", "Wrong email or password."], ["Πολλές προσπάθειες. Περίμενε λίγο.", "Too many attempts. Wait a little."], ["Δεν υπάρχει σύνδεση στο internet.", "There is no internet connection."], ["Η σύνδεση με email δεν έχει ενεργοποιηθεί ακόμα.", "Sign-in with email is not switched on yet."], ["Αυτό το username το έχει ήδη κάποιος.", "Someone already has this username."], ["Το username θέλει 3 έως 14 γράμματα, αριθμούς ή _ (χωρίς κενά).", "The username needs 3 to 14 letters, numbers or _ (no spaces)."], ["Κάτι πήγε στραβά. Έλεγξε το internet και δοκίμασε ξανά.", "Something went wrong. Check your internet and try again."], ["Μισό λεπτό…", "One moment…"], ["Στέλνω…", "Sending…"], ["Τι αποθηκεύουμε όταν φτιάχνεις λογαριασμό: το email σου (το κρατά η υπηρεσία σύνδεσης της Google, Firebase), το username και το avatar σου, και τα αποτελέσματα των online παιχνιδιών σου.", "What we store when you create an account: your email (kept by Google's sign-in service, Firebase), your username and avatar, and the results of your online games."], ["Τα στατιστικά σου (παιχνίδια, νίκες) τα βλέπουν μόνο οι φίλοι σου. Στη γενική κατάταξη φαίνονται μόνο το username και το rating σου. Το email σου δεν το βλέπει κανένας άλλος παίκτης.", "Only your friends can see your statistics (games, wins). The general leaderboard shows only your username and rating. No other player sees your email."], ["Δεν πουλάμε και δεν δίνουμε τα στοιχεία σου σε κανέναν. Τα παιχνίδια Κοντά μου και με bots δεν στέλνουν στατιστικά πουθενά.", "We do not sell or give your details to anyone. Nearby games and games with bots do not send statistics anywhere."], ["Μπορείς να διαγράψεις τον λογαριασμό σου όποτε θέλεις από το προφίλ σου. Τότε σβήνονται το email, το username, το avatar και τα στατιστικά σου.", "You can delete your account whenever you like from your profile. Then your email, username, avatar and statistics are erased."], ["Θα διαγραφούν ο λογαριασμός, το username, το avatar και τα στατιστικά σου. Δεν γίνεται αναίρεση. Γράψε τον κωδικό σου για να επιβεβαιώσεις.", "Your account, username, avatar and statistics will be deleted. This cannot be undone. Type your password to confirm."], ["Διαγραφή λογαριασμού", "Delete account"], ["Αποσύνδεση", "Sign out"], ["Διαγράφω…", "Deleting…"], ["Γράψε τον κωδικό σου.", "Type your password."], ["Διαγραφή", "Delete"], ["Άκυρο", "Cancel"], ["Ο κωδικός σου", "Your password"], ["Emotes άλλων: ", "Others' emotes: "], ["Το avatar σου", "Your avatar"], ["Τα emotes σου", "Your emotes"], ["Διάλεξε μία από τις 5 θέσεις και μετά ένα emote για να την αλλάξεις.", "Pick one of the 5 slots, then an emote to replace it."], ["Παρακαλώ", "You're welcome"], ["Βιάσου", "Hurry up"], ["Φωτιά!", "Fire!"], ["Μπράβο!", "Bravo!"], ["Μπράβο", "Nice"], ["Ωπ!", "Whoa!"], ["Χα χα", "Haha"], ["Ουφ", "Phew"], ["Εύκολο", "Easy"], ["Χμμ", "Hmm"], ["Ευχαριστώ", "Thanks"], ["Πάμε!", "Let's go!"], ["Σχέδιο φύλλων", "Card design"], ["Κλασικό", "Classic"], ["Λευκαρίτικο", "Lefkara lace"], ["Θάλασσα", "Sea"], ["Νύχτα", "Night"], ["Μπορντό", "Burgundy"], ["Μπλε", "Blue"], ["Τιρκουάζ", "Teal"], ["Ξύλο", "Wood"], ["Μπορείς να ξεκινήσεις όποτε θέλεις. Όσοι δεν έχουν διαλέξει θέση μπαίνουν σε τυχαία θέση και οι κενές θέσεις παίρνουν bots.", "You can start whenever you like. Players who have not chosen a seat get a random seat and the empty seats get bots."], ["Διάλεξε θέση ή περίμενε. Αν ο οικοδεσπότης ξεκινήσει, θα μπεις σε τυχαία θέση.", "Choose a seat or wait. If the host starts, you will get a random seat."], ["Το παιχνίδι ξεκίνησε χωρίς εσένα.", "The game started without you."], ["Περιμένουν να καθίσουν: ", "Waiting to sit: "], ["Κενή (bot)", "Empty (bot)"], ["Αν η ομάδα της προσφοράς αποτύχει, η δήλωση και η πιλόττα της πάνε στους αντιπάλους.", "If the bidding team fails, its declaration and pilotta go to the opponents."], ["Σε «Κλειστό» η ομάδα που χάνει δεν παίρνει τίποτα: ούτε πόντους, ούτε δήλωση, ούτε πιλόττα.", "In «Closed» the losing team gets nothing: no points, no declaration, no pilotta."], ["Αν η ομάδα της προσφοράς αποτύχει, οι δηλώσεις της πάνε στους αντιπάλους.", "If the bidding team fails, its declarations go to the opponents."], ["Πόντοι γύρου (μόνο από τις μπάζες):", "Round points (from tricks only):"], ["Μικρόφωνο: ΟΧΙ", "Microphone: OFF"], ["Μικρόφωνο: ΝΑΙ", "Microphone: ON"], ["Κάμερα: ΟΧΙ", "Camera: OFF"], ["Κάμερα: ΝΑΙ", "Camera: ON"], ["Δεν δόθηκε άδεια για μικρόφωνο.", "Microphone permission was not given."], ["Δεν δόθηκε άδεια για κάμερα.", "Camera permission was not given."], ["Η συσκευή ή ο browser δεν επιτρέπει μικρόφωνο.", "This device or browser does not allow the microphone."], ["Η συσκευή ή ο browser δεν επιτρέπει κάμερα.", "This device or browser does not allow the camera."], ["Πιλόττα Παντού", "Pilotta Anywhere"], ["Οι γύροι αποθηκεύονται ανώνυμα (χωρίς ονόματα), για να γίνονται καλύτερα τα bots.", "Rounds are saved anonymously (no names) to help improve the bots."], ["Δώσε τον κωδικό στους φίλους σου. Οι θέσεις 1 και 3 παίζουν μαζί, και οι θέσεις 2 και 4. Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.", "Give the code to your friends. Seats 1 and 3 play together, and seats 2 and 4. If there are not enough players, the host can put bots in the empty seats."], ["Βάλε bots στις κενές θέσεις", "Add bots to empty seats"], ["Βγάλε", "Remove"], ["Για να ξεκινήσει το παιχνίδι πρέπει και οι 4 θέσεις να είναι γεμάτες.", "All 4 seats must be filled to start the game."], ["Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.", "If there are not enough players, the host can put bots in the empty seats."], ["Με φίλους", "With friends"], ["Γράψε το όνομά σου. Μετά φτιάξε τραπέζι ή γράψε τον κωδικό που σου έδωσε ο φίλος σου.", "Type your name. Then create a table or type the code your friend gave you."], ["Νέο τραπέζι", "New table"], ["Κωδικός", "Code"], ["Μπες", "Join"], ["Όνομα", "Name"], ["Πίσω", "Back"], ["Συνδέομαι…", "Connecting…"], ["Δεν μπόρεσα να συνδεθώ. Έλεγξε το internet.", "Could not connect. Check your internet."], ["Ο κωδικός έχει 4 γράμματα.", "The code has 4 letters."], ["Δεν βρέθηκε τραπέζι με αυτόν τον κωδικό.", "No table found with this code."], ["Το παιχνίδι έχει ήδη ξεκινήσει.", "The game has already started."], ["Το τραπέζι είναι γεμάτο.", "The table is full."], ["Κάτσε", "Sit here"], ["Ξεκίνα", "Start"], ["Φύγε", "Leave"], ["(εσύ)", "(you)"], ["Περιμένουμε τον οικοδεσπότη να ξεκινήσει.", "Waiting for the host to start."], ["Στόχος", "Target"], ["Τραπέζι", "Table"], ["Δώσε τον κωδικό στους φίλους σου. Οι θέσεις 1 και 3 παίζουν μαζί, και οι θέσεις 2 και 4. Οι κενές θέσεις παίζονται από bots.", "Give the code to your friends. Seats 1 and 3 play together, and seats 2 and 4. Empty seats are played by bots."], ["Η σύνδεση για παιχνίδι με φίλους δεν έχει ρυθμιστεί σε αυτή την έκδοση.", "Playing with friends is not set up in this version."], ["Περιμένουμε…", "Waiting…"], ["Ήχος: ΝΑΙ", "Sound: ON"], ["Ήχος: ΟΧΙ", "Sound: OFF"], ["παίρνει όλες τις υπόλοιπες μπάζες", "takes all the remaining tricks"], ["Πώς θέλεις να παίξεις;", "How do you want to play?"], ["Γρήγορο παιχνίδι", "Quick match"], ["Με φίλους", "With friends"], ["Offline (με bots)", "Offline (with bots)"], ["Θα σε βάζει σε τραπέζι με 4 τυχαίους παίκτες online.", "It will put you at a table with 4 random players online."], ["Μέχρι 4 άτομα στο ίδιο τραπέζι. Κάθε παίκτης που μπαίνει θα διαλέγει πού θα κάτσει.", "Up to 4 people at the same table. Each player who joins will choose where to sit."], ["Δεν είναι έτοιμο ακόμα. Σύντομα.", "Not ready yet. Coming soon."], ["Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου την ψηλότερη δήλωσή σου πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Δηλώνεις πάντα μόνο την ψηλότερη (π.χ. με δύο τρίτες λες 20, με πενήντα και τρίτη λες 50). Αν η ψηλότερη δήλωση της ομάδας σου κερδίσει, τις δείχνεις όλες και μετράνε όλες. Λάθος ποσό σημαίνει ότι δεν μετράει.", "In the 1st trick, if you like, you declare your highest declaration by yourself before you play a card. It is not compulsory: if you play a card, you declare nothing. You always declare only the highest (e.g. with two tierces you say 20, with a fifty and a tierce you say 50). If the highest declaration of your team wins, you show them all and they all count. A wrong amount means it doesn't count."], ["Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου την ψηλότερη δήλωσή σου, πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Δηλώνεις πάντα μόνο την ψηλότερη: με δύο τρίτες (40) λες 20. Αν η ψηλότερη δήλωση της ομάδας σου κερδίσει, δείχνεις όλες τις δηλώσεις σου. Λάθος ποσό σημαίνει ότι δεν μετράει.", "In the 1st trick, if you like, you declare your highest declaration by yourself, before you play a card. It is not compulsory: if you play a card, you declare nothing. You always declare only the highest: with two tierces (40) you say 20. If the highest declaration of your team wins, you show all your declarations. A wrong amount means it doesn't count."], ["Ξεκινούν από 80, πολλαπλάσια του 10, και κάθε προσφορά ανεβάζει. Η 250 σημαίνει όλες τις μπάζες, και με τις δηλώσεις μπορείς να πας πιο ψηλά. Το μέγιστο που γίνεται είναι 820: 250 για όλες τις μπάζες, 550 από δηλώσεις (τέσσερα Βαλέ 200, τέσσερα 9 150 και δύο ακόμα τετράδες 100) και 20 η πιλόττα.", "They start at 80, multiples of 10, and every bid raises. 250 means all the tricks, and with declarations you can go higher. The maximum possible is 820: 250 for all the tricks, 550 from declarations (four Jacks 200, four 9s 150 and two more fours of a kind 100) and 20 for the pilotta."], ["Οποιοσδήποτε αντίπαλος της ψηλότερης προσφοράς μπορεί να πει «Κλειστό» όποτε έρθει η σειρά του, μέχρι να κλείσουν οι προσφορές. Η προσφορά μετράει ×2 και οι προσφορές κλείνουν. Μετά, μόνο η ομάδα της προσφοράς μπορεί να πει «Ανοιχτό» (×4).", "Any opponent of the highest bid may say «Closed» whenever it is his turn, until the bids close. The bid counts ×2 and the bidding ends. After that, only the bidding team may say «Open» (×4)."], ["150: τέσσερα εννιάρια, ζητώ Βαλέ ή να με γυρίσει εκεί που τον έχει. 160: τέσσερις Άσοι, να με γυρίσει όπου είναι πιο δυνατός στα κόζια. 220: τέσσερις Βαλέδες, ζητώ εννιάρι ή να με γυρίσει όπου το έχει (τουλάχιστον στο Σπαθί).", "150: four nines, I ask for the Jack or to be turned to where he has it. 160: four Aces, turn me to where he is strongest in trumps. 220: four Jacks, I ask for the nine or to be turned to where he has it (at least in Clubs)."], ["Μετράει μόνο η ομάδα με τη μεγαλύτερη δήλωση, και παίρνει και του συντρόφου. Στα ίσα ισχύει η σειρά που τελειώνει σε ψηλότερο φύλλο. Στα απολύτως ίσα, κερδίζει όποια είναι σε κόζια, αλλιώς δεν μετράει καμία.", "Only the team with the biggest declaration counts, and it also takes its partner's. On a tie the run ending in the higher card wins. On an absolute tie, the one in trumps wins, otherwise none counts."], ["Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το κάνεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η μπάζα, όπου μπορεί να δείξει ο αντίπαλος.", "In the 2nd trick, if your team has the biggest declaration, press «Show your declaration» before you play a card. If you don't, it is lost and the count is redone in the 3rd trick, where the opponent may show."], ["80 σημαίνει Βαλές ή εννιάρι και τουλάχιστον έναν Άσο. 90: και τα δύο κόζια. 100: πες μου τους Άσους σου. 130 και 140: έχω πενήντα. 180 και 190: έχω πέντε στη σειρά. 150: τέσσερα εννιάρια. 160: τέσσερις Άσοι. 220: τέσσερις Βαλέδες.", "80 means Jack or nine and at least one Ace. 90: both trumps. 100: tell me your Aces. 130 and 140: I have a fifty. 180 and 190: I have a five-run. 150: four nines. 160: four Aces. 220: four Jacks."], ["Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο: Βαλές της φυλής του 1, εννιάρι της φυλής του με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, και κάθε Άσος εκτός κοζιών 1 ακόμα.", "When your partner bids, you add 10 for each point: Jack of his suit 1, nine of his suit with one more trump 1, Jack and nine together 3, and each Ace outside trumps 1 more."], ["Πόσο ανεβαίνεις έχει νόημα: άνοιγμα 80 ή +10 πάνω από την προηγούμενη προσφορά σημαίνει Βαλές ή 9 με Άσο. 90 ή +20: Βαλές και 9. 100 ή +30: ζητάς από τον σύντροφο να πει τους Άσους του.", "How much you raise has meaning: opening 80 or +10 over the previous bid means Jack or 9 with an Ace. 90 or +20: Jack and 9. 100 or +30: you ask your partner to tell his Aces."], ["Πόσο ανεβαίνεις: 80 ή +10 πάνω από την προηγούμενη προσφορά = Βαλές ή 9 με Άσο. 90 ή +20 = Βαλές και 9. 100 ή +30 = ο σύντροφος να πει τους Άσους του, και προσθέτει 10 για κάθε Άσο.", "How much you raise: 80 or +10 over the previous bid = Jack or 9 with an Ace. 90 or +20 = Jack and 9. 100 or +30 = the partner says his Aces, and adds 10 for each Ace."], ["Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο που έχεις: Βαλές της φυλής του 1, εννιάρι με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, κάθε Άσος εκτός κοζιών 1.", "When your partner bids, you add 10 for each point you have: Jack of his suit 1, nine with one more trump 1, Jack and nine together 3, each Ace outside trumps 1."], ["Όταν τα κόζια είναι δικά σας και πετάς φύλλα σε μπάζα του συντρόφου: κατεβαίνεις (Ρήγας, Ντάμα, 9) αν δεν έχεις Άσο σε εκείνη τη φυλή, ανεβαίνεις (9, Βαλές, Ρήγας) αν έχεις.", "When trumps are yours and you throw cards on your partner's trick: you go down (King, Queen, 9) if you have no Ace in that suit, you go up (9, Jack, King) if you do."], ["Το σκορ μετριέται σε δεκάδες. Στους πόντους του γύρου, αν το τελευταίο ψηφίο είναι 7 ή πάνω, στρογγυλοποιείς προς τα πάνω (17 γίνεται 2), αλλιώς προς τα κάτω (16 γίνεται 1).", "The score is counted in tens. In the round points, if the last digit is 7 or more, you round up (17 becomes 2), otherwise down (16 becomes 1)."], ["Η προσφορά πετυχαίνει όταν η ομάδα κάνει τουλάχιστον όσους πόντους έταξε. Η δήλωση και η πιλόττα της μετρούν ήδη σε αυτό (π.χ. προσφορά 80 με τρίτη: πρέπει να κάνει 60).", "The bid succeeds when the team makes at least as many points as it promised. Its declaration and pilotta already count towards that (e.g. bid 80 with a tierce: it must make 60)."], ["Η ομάδα της προσφοράς ανοίγει πρώτα κόζια για να πάρει τα κόζια των αντιπάλων. Όταν ο σύντροφος παίζει κόζια, ρίχνεις τα δυνατά σου κόζια (όχι το 9 αν βγει ο Βαλές).", "The bidding team leads trumps first to take the opponents' trumps. When your partner plays trumps, you play your strong trumps (not the 9 if the Jack comes out)."], ["Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το πατήσεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η.", "In the 2nd trick, if your team has the biggest declaration, press «Show your declaration» before you play a card. If you don't, it is lost and the count is redone in the 3rd."], ["Πιλόττα: Ρήγας και Ντάμα στα κόζια, 20. Μετράει πάντα και δεν δηλώνεται στην 1η μπάζα. Την ανακοινώνεις όταν ρίξεις το πρώτο (πιλόττα) και το δεύτερο (ρεπιλόττα).", "Pilotta: King and Queen of trumps, 20. It always counts and is not declared in the 1st trick. You announce it when you play the first (pilotta) and the second (repilotta)."], ["100: ο σύντροφος να πει ποιους Άσους έχει, ανεξάρτητα από τα κόζια του. Έτσι ανοίγεις και όταν ο αντίπαλος έχει ήδη προσφέρει 80 σε άλλη φυλή, αντί για 90.", "100: the partner says which Aces he has, regardless of his trumps. This way you can open even when the opponent has already bid 80 in another suit, instead of 90."], ["4 παίκτες σε 2 ομάδες: εσύ και ο Σύντροφος απέναντι σε Ανατολή και Δύση. 32 φύλλα, από το 7 ως τον Άσο. Η φορά είναι αντίθετη από των δεικτών του ρολογιού.", "4 players in 2 teams: you and the Partner against East and West. 32 cards, from the 7 up to the Ace. Play goes counter-clockwise."], ["Η ομάδα της προσφοράς που παίρνει όλες τις μπάζες παίρνει 25 αντί για 16. Αν οι αντίπαλοι πάρουν όλες τις μπάζες («ανάποδο»), κερδίζουν αμέσως το παιχνίδι.", "The bidding team that takes all the tricks gets 25 instead of 16. If the opponents take all the tricks («reverse»), they win the game immediately."], ["Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Δεν το έχεις; Αν έχεις κόζια, πρέπει να κόψεις, ακόμα και πάνω από τον σύντροφό σου. Αυτό είναι το τσάκκισμα.", "You must play a card of the suit led. Don't have it? If you have trumps, you must cut, even over your partner. This is forced trumping (tsakkisma)."], ["Οποιοσδήποτε αντίπαλος της ψηλότερης προσφοράς μπορεί να πει «Κλειστό» (×2 στην προσφορά). Η ομάδα της προσφοράς μπορεί τότε να απαντήσει «Ανοιχτό» (×4).", "Any opponent of the highest bid may say «Closed» (×2 on the bid). The bidding team may then answer «Open» (×4)."], ["Αν η ομάδα δεν είχε δήλωση και έκανε μόνο 70, χάνει. Οι αντίπαλοι παίρνουν 8 (προσφορά) + 16 (ολόκληρος ο γύρος) = 24, και η ομάδα της προσφοράς τίποτα.", "If the team had no declaration and made only 70, it loses. The opponents get 8 (bid) + 16 (whole round) = 24, and the bidding team nothing."], ["Κερδίζει όποιος φτάσει πρώτος στον στόχο (101 έως 601, ανά 50). Αν φτάσουν και οι δύο, κερδίζει το μεγαλύτερο σκορ. Σε ισοπαλία παίζεται κι άλλος γύρος.", "The first to reach the goal wins (101 to 601, in steps of 50). If both reach it, the higher score wins. On a tie another round is played."], ["Ποτέ δεν προσθέτεις πόντους που δεν μπορεί να βγάλει η ομάδα. Αν ο σύντροφος επιμένει και έχεις δήλωση, μπορείς να του βάλεις «ψεύτικους» πόντους.", "You never add points the team cannot make. If your partner insists and you have a declaration, you can add «fake» points for him."], ["Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Αν δεν έχεις και έχεις κόζια, πρέπει να τσακκίσεις (να κόψεις), ακόμα κι αν κερδίζει ο σύντροφός σου.", "You must play a card of the suit led. If you don't have it and you have trumps, you must cut (force-trump), even if your partner is winning."], ["Προσφορά 80 στο Καρό: η ομάδα πρέπει να κάνει τουλάχιστον 80 από τους 162 πόντους του γύρου. Έχει τρίτη (20); Χρειάζεται μόνο 60 από τα φύλλα.", "Bid 80 in Diamonds: the team must make at least 80 of the 162 points of the round. It has a tierce (20)? It needs only 60 from the cards."], ["Στο παιχνίδι: Πιλόττα με Ντάμα σημαίνει τουλάχιστον 3 κόζια, με Ρήγα σημαίνει μόνο την πιλόττα. Όταν κόβεις στην 1η μπάζα, ρίχνεις μικρό κόζι.", "In the game: Pilotta with the Queen means at least 3 trumps, with the King it means only the pilotta. When you cut in the 1st trick, you play a small trump."], ["Η ομάδα έκανε 100 πόντους και είχε τρίτη: παίρνει 10 (φύλλα) + 2 (τρίτη) + 8 (προσφορά) = 20 στο σκορ. Οι αντίπαλοι με 62 πόντους παίρνουν 6.", "The team made 100 points and had a tierce: it gets 10 (cards) + 2 (tierce) + 8 (bid) = 20 on the score. The opponents with 62 points get 6."], ["5. Μετράτε πόντους. Αν η ομάδα της προσφοράς έκανε όσους υποσχέθηκε, τους παίρνει μαζί με την προσφορά. Αλλιώς τους παίρνουν οι αντίπαλοι.", "5. You count points. If the bidding team made what it promised, it takes them together with the bid. Otherwise the opponents take them."], ["Οι φυλές: Κούπα ♥, Καρό ♦, Σπαθί ♣, Πίκα ♠. Τα φύλλα σου εμφανίζονται ανά φυλή, κόκκινη και μαύρη εναλλάξ, από το μικρό στο μεγάλο.", "The suits: Hearts ♥, Diamonds ♦, Clubs ♣, Spades ♠. Your cards are shown by suit, alternating red and black, from small to big."], ["Αν έχεις τα πιο δυνατά φύλλα μιας φυλής, ρίχνεις τον Άσο της για να δείξεις στον σύντροφο ότι θα του κάνεις τις μπάζες που του λείπουν.", "If you hold the strongest cards of a suit, you play its Ace to show your partner that you will make the tricks he is missing."], ["Αποτυχημένη: οι αντίπαλοι παίρνουν την προσφορά, 16 για τον γύρο, τις δηλώσεις τους και την πιλόττα. Η ομάδα της προσφοράς παίρνει 0.", "Failed: the opponents get the bid, 16 for the round, their declarations and the pilotta. The bidding team gets 0."], ["Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100, με 9 150, με βαλέδες 200 (7 και 8 δεν μετράνε).", "Three in a row: 20. Four: 50. Five or more: 100. Four of a kind: 100, with nines 150, with Jacks 200 (7s and 8s don't count)."], ["Αν η ομάδα της προσφοράς πετύχει: παίρνει τους πόντους της, την προσφορά και τις δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους.", "If the bidding team succeeds: it gets its points, the bid and the declarations. The opponents get their own."], ["Όλες οι μπάζες από την ομάδα της προσφοράς: 25 αντί για 16. Όλες οι μπάζες από τους αντιπάλους: «ανάποδο», κερδίζουν το παιχνίδι.", "All tricks by the bidding team: 25 instead of 16. All tricks by the opponents: «reverse», they win the game."], ["Δήλωση (προαιρετική): αν έχεις, πες την ψηλότερη δήλωσή σου πριν ρίξεις φύλλο. Αν ρίξεις φύλλο χωρίς δήλωση, δεν δηλώνεις τίποτα.", "Declaration (optional): if you have one, say your highest declaration before you play a card. If you play a card without declaring, you declare nothing."], ["Ο «Οδηγός παιχνιδιού» στο μενού προτείνει κάθε κίνηση και την εξηγεί. Είναι ενεργός από την αρχή και κλείνει από το ίδιο μενού.", "The «Game coach» in the menu suggests every move and explains it. It is on from the start and can be switched off from the same menu."], ["Πετυχημένη προσφορά: η ομάδα παίρνει πόντους φύλλων, προσφορά και δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους πόντους.", "Successful bid: the team gets card points, the bid and declarations. The opponents get their own points."], ["Ρήγας και Ντάμα στα κόζια είναι η πιλόττα (20). Δεν δηλώνεται, αλλά μετράει πάντα. Την ανακοινώνεις όταν ρίχνεις τα φύλλα.", "King and Queen of trumps are the pilotta (20). It is not declared, but it always counts. You announce it when you play the cards."], ["Αν αποτύχει: οι αντίπαλοι παίρνουν την προσφορά, 162 πόντους και τις δηλώσεις, και η ομάδα της προσφοράς παίρνει μηδέν.", "If it fails: the opponents take the bid, 162 points and the declarations, and the bidding team gets zero."], ["Κάθε γύρος έχει 8 μπάζες και 162 πόντους. Οι πόντοι έρχονται από τα φύλλα που μαζεύουν οι μπάζες και από τις δηλώσεις.", "Each round has 8 tricks and 162 points. Points come from the cards the tricks collect and from declarations."], ["Η προσφορά 250 σημαίνει όλες τις μπάζες. Με δηλώσεις μπορεί να ανέβει ακόμα παραπάνω. Το απόλυτο μέγιστο είναι 820.", "A bid of 250 means all the tricks. With declarations it can go even higher. The absolute maximum is 820."], ["Όταν παίζονται κόζια, ο επόμενος πρέπει να ρίξει πιο δυνατό κόζια αν έχει. Αν δεν έχει, ρίχνει όποιο κόζια θέλει.", "When trumps are played, the next player must play a higher trump if he has one. If not, he plays any trump he likes."], ["Κόζια: Βαλές 20, 9 14, Άσος 11, 10 10, Ρήγας 4, Ντάμα 3. Άλλες φυλές: Άσος 11, 10 10, Ρήγας 4, Ντάμα 3, Βαλές 2.", "Trumps: Jack 20, 9 14, Ace 11, 10 10, King 4, Queen 3. Other suits: Ace 11, 10 10, King 4, Queen 3, Jack 2."], ["80: Βαλές ή εννιάρι και τουλάχιστον έναν Άσο εκτός κοζιών. Ο σύντροφος να πει αν έχει το άλλο και ποιους Άσους.", "80: Jack or nine and at least one Ace outside trumps. The partner says if he has the other and which Aces."], ["Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100 (εννιάρια 150, βαλέδες 200).", "Three in a row: 20. Four: 50. Five or more: 100. Four of a kind: 100 (nines 150, Jacks 200)."], [" Έχεις και πιλόττα (Ρήγα και Ντάμα στα κόζια): δεν δηλώνεται, την ανακοινώνεις όταν ρίξεις το πρώτο από τα δύο.", " You also have the pilotta (King and Queen of trumps): it is not declared, you announce it when you play the first of the two."], ["Ο σύντροφός σου ανέβασε +20: ζητά τους Άσους σου, αλλά μόνο αν έχεις τουλάχιστον ένα κόζι στη φυλή του. Έχεις ", "Your partner raised +20: he asks for your Aces, but only if you have at least one trump in his suit. You have "], ["90: και Βαλές και εννιάρι. Ο σύντροφος προσθέτει 10 για κάθε Άσο εκτός κοζιών, αν έχει τουλάχιστον ένα κόζι.", "90: both Jack and nine. The partner adds 10 for each Ace outside trumps, if he has at least one trump."], ["Δοκίμασε να παίξεις πρώτα με χαμηλές προσφορές (80 με 100) μέχρι να συνηθίσεις τις μπάζες και το τσάκκισμα.", "Try playing first with low bids (80 to 100) until you get used to the tricks and forced trumping."], ["3. 1η μπάζα: δηλώνεις αν έχεις δήλωση (προαιρετικό). 2η μπάζα: η ομάδα με τη μεγαλύτερη δήλωση τη δείχνει.", "3. 1st trick: you declare if you have a declaration (optional). 2nd trick: the team with the biggest declaration shows it."], ["Έχεις Βαλέ ή εννιάρι της φυλής με Άσο εκτός και τουλάχιστον 3 κόζια. Το 80 το λέει και στον σύντροφό σου.", "You have the Jack or nine of the suit with an outside Ace and at least 3 trumps. The 80 also tells your partner."], ["Η προσφορά είναι υπόσχεση: η ομάδα της πρέπει να κάνει τόσους πόντους. Αλλιώς τους παίρνουν οι αντίπαλοι.", "The bid is a promise: its team must make that many points. Otherwise the opponents take them."], ["Τελειώνουν όταν μετά από μια προσφορά ακολουθούν 3 πάσο στη σειρά. Μια νέα προσφορά μηδενίζει το μέτρημα.", "It ends when a bid is followed by 3 passes in a row. A new bid resets the count."], ["Κόζια: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7. Στις άλλες φυλές: Άσος, 10, Ρήγας, Ντάμα, Βαλές, 9, 8, 7.", "Trumps: Jack, 9, Ace, 10, King, Queen, 8, 7. In other suits: Ace, 10, King, Queen, Jack, 9, 8, 7."], ["Έχεις πέντε φύλλα στη σειρά (εκατό) με Βαλέ: το bid είναι 80 (μόνο Βαλές) ή 90 (Βαλές και 9) συν τα 100.", "You have five in a row (a hundred) with the Jack: the bid is 80 (Jack only) or 90 (Jack and 9) plus the 100."], ["Ανοίγεις κόζια για να χάσουν οι αντίπαλοι τα δυνατά τους κόζια. Παίζεις μικρό για να μη χάσεις πόντους.", "You lead trumps so the opponents lose their strong trumps. You play small so you don't lose points."], ["Χωρίς φυλή και χωρίς κόζια, ρίχνεις ό,τι θες. Την επόμενη μπάζα ανοίγει όποιος κέρδισε την προηγούμενη.", "With no suit and no trumps, you play whatever you like. The winner of the previous trick leads the next."], ["2. Προσφορές: λέτε πάσο ή προσφέρετε πόντους και φυλή. Η φυλή της τελευταίας προσφοράς γίνεται κόζια.", "2. Bids: you say pass or bid points and a suit. The suit of the last bid becomes trumps."], ["Δίνεις τη μπάζα επίτηδες: κρατάς τον Άσο για αργότερα, ώστε να πάρεις και το 10 που δεν έχει παιχτεί.", "You give the trick away on purpose: you keep the Ace for later, so you also take the 10 that has not been played."], ["Πιλόττα με Ντάμα σημαίνει τουλάχιστον 3 κόζια. Πιλόττα με Ρήγα σημαίνει ότι κρατάς μόνο την πιλόττα.", "Pilotta with the Queen means at least 3 trumps. Pilotta with the King means you keep only the pilotta."], ["Έχεις Βαλέ, εννιάρι και 4 ή περισσότερα κόζια. Το 100 ζητά από τον σύντροφο να πει τους Άσους του.", "You have Jack, nine and 4 or more trumps. The 100 asks your partner to tell his Aces."], ["130 (10 έως Ρήγας ή Βαλές έως Άσος) και 140 (άλλο πενήντα): έχω πενήντα. Ψάχνω εννιάρι και Άσους.", "130 (10 to King or Jack to Ace) and 140 (another fifty): I have a fifty. I'm looking for a nine and Aces."], ["180 και 190: έχω πέντε ή περισσότερα στη σειρά (100) με Βαλέ. 180 = μόνο Βαλές (80+100), 190 = Βαλές και εννιάρι (90+100).", "180 and 190: I have a run of five or more (100) with the Jack. 180 = Jack only (80+100), 190 = Jack and nine (90+100)."], ["Δεν έχεις ούτε τη φυλή ούτε κόζια; Ρίχνεις ό,τι θες. Στη μπάζα που κέρδισες ανοίγεις την επόμενη.", "You have neither the suit nor trumps? Play whatever you like. You lead the next trick you win."], ["Δεν έχεις ούτε τη φυλή ούτε κόζια, ρίχνεις ό,τι θες. Ρίχνεις αυτό που σου χρειάζεται λιγότερο.", "You have neither the suit nor trumps, so you play whatever you like. Play the card you need least."], ["Είναι το πιο δυνατό φύλλο της φυλής που έμεινε, άρα παίρνει τη μπάζα (εκτός αν κοπεί με κόζι).", "It is the highest card of the suit left, so it takes the trick (unless cut by a trump)."], ["Ένα φύλλο μετράει σε μία μόνο δήλωση. Μεγάλη σειρά σπάει σε δύο (π.χ. 7-8-9 και 10 έως Άσος).", "A card counts in one declaration only. A long run splits in two (e.g. 7-8-9 and 10 to Ace)."], ["Δεν μπορείς να κερδίσεις τη μπάζα, οπότε ρίχνεις το φύλλο που χάνει τους λιγότερους πόντους.", "You can't win the trick, so you play the card that loses the fewest points."], ["Η φυλή της τελευταίας προσφοράς γίνεται κόζια. Οι προσφορές κλείνουν όταν ακολουθούν 3 πάσο.", "The suit of the last bid becomes trumps. Bidding ends when 3 passes follow."], [" Θυμήσου: η ομάδα σου πρέπει να κάνει τόσους πόντους από τους 162, και οι δηλώσεις μετράνε.", " Remember: your team must make that many points out of 162, and declarations count."], ["Δεν έχεις αρκετή δύναμη στα κόζια (Βαλέ ή 9 με Άσο εκτός και 3 κόζια). Πάσο είναι ασφαλές.", "You don't have enough trump strength (Jack or 9 with an outside Ace and 3 trumps). Passing is safe."], ["ζητά 3 μπάζες σε μια φυλή εκτός κόζια, δηλαδή Άσο, 10 και Ρήγα (10 για κάθε τέτοια φυλή).", "asks for 3 tricks in a suit outside trumps, that is Ace, 10 and King (10 for each such suit)."], ["Όταν παίζονται κόζια, ρίχνεις πιο δυνατό κόζια αν έχεις. Αλλιώς ρίχνεις όποιο κόζια θες.", "When trumps are played, you play a higher trump if you have one. Otherwise you play any trump you like."], ["Ο σύντροφός σου ανέβασε την προσφορά κατά 30 (ή άνοιξε 100): ζητά τους Άσους σου. Έχεις ", "Your partner raised the bid by 30 (or opened 100): he asks for your Aces. You have "], ["Είναι το πιο δυνατό κόζι που έμεινε: παίρνει τη μπάζα και τραβά τα κόζια των αντιπάλων.", "It is the highest trump left: it takes the trick and draws out the opponents' trumps."], ["Το σκορ μετριέται σε δεκάδες. Κερδίζει η ομάδα που φτάνει πρώτη τον στόχο που διάλεξες.", "The score is counted in tens. The first team to reach the goal you chose wins."], ["Αν πεις «Ανοιχτό», η προσφορά μετράει ×4. Μόνο η ομάδα της προσφοράς μπορεί να το πει.", "If you say «Open», the bid counts ×4. Only the bidding team can say it."], ["Η ομάδα σου έχει τη μεγαλύτερη δήλωση. Αν ρίξεις φύλλο χωρίς να τη δείξεις, χάνεται.", "Your team has the biggest declaration. If you play a card without showing it, it is lost."], ["Όταν κόβεις φυλή στην 1η μπάζα, ρίχνεις μικρό κόζι για να το καταλάβει ο σύντροφος.", "When you cut a suit in the 1st trick, you play a small trump so your partner understands."], ["Κάθε παίκτης λέει πάσο ή προσφορά: 80 ή πάνω, πολλαπλάσια του 10, μαζί με μια φυλή.", "Each player says pass or bids: 80 or more, multiples of 10, together with a suit."], ["Κάθε προσφορά έχει και φυλή, και η φυλή της τελευταίας προσφοράς γίνεται κόζια.", "Every bid also has a suit, and the suit of the last bid becomes trumps."], ["Η προσφορά πρέπει να είναι μεγαλύτερη από την τελευταία. Το χέρι σου αντέχει ", "The bid must be higher than the last one. Your hand can handle "], ["Με «Κλειστό» ή «Ανοιχτό» παίρνει πόντους μόνο η ομάδα που κερδίζει τον γύρο.", "With the «Previous trick» button you see the cards of the last trick."], ["Ο γύρος έχει 162 πόντους: 152 από τα φύλλα και 10 για την τελευταία μπάζα.", "With «Closed» or «Open», only the team that wins the round scores."], ["Με αυτό το φύλλο παίρνεις τη μπάζα, και είναι το πιο μικρό που κερδίζει.", "With this card you take the trick, and it is the smallest that wins."], ["Με το κουμπί «Προηγούμενη μπάζα» βλέπεις τα φύλλα της τελευταίας μπάζας.", "You play with your Partner against two opponents. 4 players, 32 cards."], ["Ο σύντροφός σου παίρνει τη μπάζα, δεν χρειάζεται να ρίξεις μεγάλο φύλλο.", "Your partner takes the trick, you don't need to play a big card."], ["Παίζεις με τον Σύντροφό σου εναντίον δύο αντιπάλων. 4 παίκτες, 32 φύλλα.", "You play with your Partner against two opponents. 4 players, 32 cards."], ["Έχεις τέσσερα φύλλα στη σειρά (πενήντα): το bid το λέει στον σύντροφο.", "You have four in a row (fifty): the bid tells your partner."], ["Παίζετε σε ζευγάρια: εσύ με τον Σύντροφο απέναντι σε Ανατολή και Δύση.", "You play in pairs: you and the Partner against East and West."], ["Η πιλόττα της ομάδας που χάνει πάει στην ομάδα που κερδίζει τον γύρο.", "The pilotta of the losing team goes to the team that wins the round."], [" και το χέρι σου δεν αρκεί για να την ξεπεράσεις με ασφάλεια. Πάσο.", " and your hand is not enough to beat it safely. Pass."], ["4. Παίζονται 8 μπάζες. Όποιος παίρνει τη μπάζα ανοίγει την επόμενη.", "4. 8 tricks are played. The winner of a trick leads the next."], ["Σε «Κλειστό» που πετυχαίνει, δεν μετράνε οι δηλώσεις των αντιπάλων.", "When a «Closed» succeeds, the opponents' declarations don't count."], [". Πάτα «Δηλώνω» πριν ρίξεις φύλλο. Αν κερδίσει, τις δείχνεις όλες.", ". Press «Declare» before you play a card. If it wins, you show them all."], ["Ο σύντροφός σου παίρνει τη μπάζα, οπότε βάζεις πολλούς πόντους (", "Your partner takes the trick, so you put on many points ("], ["Στα κόζια η σειρά είναι: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7.", "In trumps the order is: Jack, 9, Ace, 10, King, Queen, 8, 7."], ["Μια μπάζα χωρίς πόντους μετράει 10 (20 αν είναι η τελευταία).", "A trick with no points counts 10 (20 if it is the last)."], ["Έχεις μόνο ένα επιτρεπτό φύλλο, οπότε δεν υπάρχει επιλογή.", "You have only one allowed card, so there is no choice."], ["Διάλεξε στόχο σκορ. Όποια ομάδα τον φτάσει πρώτη κερδίζει.", "Choose a goal score. The first team to reach it wins."], ["Δεν έχεις δήλωση (τρία φύλλα στη σειρά ή τέσσερα ίδια).", "You have no declaration (three in a row or four of a kind)."], ["Οι bots παίζουν έτσι, οπότε μπορείς να τους διαβάζεις.", "The bots play this way, so you can read them."], [" αλλά η ψηλότερη δήλωσή σου είναι άλλη. Δεν μετράει.", " but your highest declaration is another one. It doesn't count."], ["Δεν δήλωσες τίποτα, οπότε η δήλωσή σου δεν μετράει.", "You declared nothing, so your declaration doesn't count."], ["Η δήλωση δεν δείχτηκε, οπότε η μέτρηση ξαναγίνεται.", "The declaration was not shown, so the count is redone."], ["Ανοίγεις με χαμηλό φύλλο για να μη δώσεις πόντους.", "You lead a low card so you don't give away points."], [" και καμία δεν είναι σε κόζια. Δεν μετράει καμία.", " and none of them is in trumps. None counts."], ["Οι πόντοι μετριούνται σε δεκάδες: 10 πόντοι = 1.", "Points are counted in tens: 10 points = 1."], [" πήρε όλες τις μπάζες και κερδίζει το παιχνίδι.", " took all the tricks and wins the game."], [" και έχεις κόζια: πρέπει να κόψεις (τσάκκισμα)", " and you have trumps: you must cut (forced trumping)"], ["Συνεχίζεις το παιχνίδι από εκεί που έμεινες.", "You continue the game where you left off."], [" και ο σύντροφός του απαντούν στο «Κλειστό»…", " and his partner respond to «Closed»…"], ["Δεν έχει γίνει προσφορά ακόμα. Ελάχιστη 80.", "No bid has been made yet. Minimum 80."], ["Έχεις Βαλέ και εννιάρι με ακριβώς 3 κόζια.", "You have Jack and nine with exactly 3 trumps."], [", ακόμα κι αν κερδίζει ο σύντροφός σου.", ", even if your partner is winning."], ["Κάθε παίκτης τη δείχνει στη σειρά του.", "Each player shows it in turn."], ["1. Μοιράζονται 8 φύλλα στον καθένα.", "1. Each player is dealt 8 cards."], ["Συμβάσεις προσφορών με τον σύντροφο", "Bid conventions with your partner"], ["ζητά το 10 κάτω από τους Άσους σου.", "asks for the 10 under your Aces."], ["Αυτή τη φορά κέρδισαν οι αντίπαλοι", "This time the opponents won"], [" μοιράζει. Ξεκινούν οι προσφορές.", " deals. Bidding starts."], ["Παίζεις πρώτος σε αυτή τη μπάζα.", "You play first in this trick."], ["Δεν έδειξες τη δήλωση. Χάνεται.", "You did not show the declaration. It is lost."], ["Το χέρι σου είναι οριακό. Πάσο.", "Your hand is borderline. Pass."], ["Όλοι είπαν πάσο. Ξαναμοιράζουν.", "Everyone passed. Redeal."], ["Όλοι πάσο. Μοιράζει ο επόμενος.", "Everyone passed. The next player deals."], [" (πιο δ
