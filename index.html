.","You did not answer 3 times. A bot took your place."],["Σε έβγαλαν από το τραπέζι, γιατί δεν απάντησες 3 φορές.","You were removed from the table because you did not answer 3 times."],["Παίξτε με φίλους που είναι στο ίδιο δωμάτιο, χωρίς internet. Ο ένας φτιάχνει το τραπέζι και οι άλλοι το βρίσκουν.","Play with friends in the same room, without internet. One person creates the table and the others find it."],["Δεν μπόρεσα να ξεκινήσω. Δώσε τις άδειες Bluetooth/Κοντινές συσκευές και άνοιξε Bluetooth και Wi-Fi.","Could not start. Allow the Bluetooth/Nearby devices permissions and turn on Bluetooth and Wi-Fi."],["Δεν μπόρεσα να ψάξω. Δώσε τις άδειες Bluetooth/Κοντινές συσκευές και άνοιξε Bluetooth και Wi-Fi.","Could not search. Allow the Bluetooth/Nearby devices permissions and turn on Bluetooth and Wi-Fi."],["Ψάχνουμε… Ο φίλος σου πρέπει να έχει πατήσει «Φτιάξε τραπέζι».","Searching… Your friend must have tapped “Create a table”."],["Πήγαινε στο Κύριο μενού για να παίξεις με φίλους κοντά σου.","Go to the Main menu to play with friends near you."],["Αυτή η επιλογή υπάρχει μόνο στην εφαρμογή Android.","This option is only available in the Android app."],["Δεν μπόρεσα να συνδεθώ. Δοκίμασε ξανά.","Could not connect. Try again."],["Χάθηκε η σύνδεση με τον οικοδεσπότη.","Lost connection to the host."],["Τραπέζια κοντά σου","Tables near you"],["Φτιάξε τραπέζι","Create a table"],["Βρες τραπέζι","Find a table"],["Ξεκινάω…","Starting…"],["Το γρήγορο παιχνίδι και το παιχνίδι με φίλους θέλουν λογαριασμό. Συνδέσου από το κύριο μενού.","Quick match and playing with friends require an account. Sign in from the main menu."],["Το γρήγορο παιχνίδι, το παιχνίδι με φίλους και το «Κοντά μου» θέλουν λογαριασμό. Συνδέσου από το κύριο μενού.","Quick match, playing with friends and Nearby require an account. Sign in from the main menu."],["Συνέχισε ως επισκέπτης ή συνδέσου","Continue as a guest or sign in"],["Χωρίς λογαριασμό μπορείς να παίξεις έως ","Without an account you can play up to "],[" παιχνίδια με bots"," games against bots"],[" (σου απομένουν "," (remaining: "],["Με λογαριασμό παίζεις online με φίλους, κρατάς στατιστικά και rating και εμφανίζεσαι στη γενική κατάταξη.","With an account you can play online with friends, keep stats and a rating, and appear on the global leaderboard."],["Σύνδεση ή δημιουργία λογαριασμού","Sign in or create an account"],["Συνέχεια ως επισκέπτης","Continue as a guest"],["Σύνδεση με Google","Sign in with Google"],["ή με email","or with email"],["Διάλεξε username","Choose a username"],["Έτσι θα σε βλέπουν οι άλλοι παίκτες. Το email σου δεν φαίνεται σε κανέναν.","This is how other players will see you. Your email is not shown to anyone."],["Θα σου ζητηθεί να επιβεβαιώσεις με Google.","You will be asked to confirm with Google."],["Ο browser μπλόκαρε το παράθυρο της Google. Επίτρεψε τα αναδυόμενα παράθυρα και ξαναδοκίμασε.","Your browser blocked the Google window. Allow pop-ups and try again."],["Υπάρχει ήδη λογαριασμός με αυτό το email. Συνδέσου με email και κωδικό.","An account with this email already exists. Sign in with email and password."],["Αυτή η διεύθυνση δεν έχει εγκριθεί για σύνδεση με Google.","This address is not approved for Google sign-in."],["Αυτός ο τρόπος σύνδεσης δεν έχει ενεργοποιηθεί ακόμα.","This sign-in method is not enabled yet."],["Για οποιαδήποτε ερώτηση για τα δεδομένα σου, επικοινώνησε μαζί μας: ","For any question about your data, contact us: "],["Κωδικός τραπεζιού","Table code"],["Η θέση σου σε αυτή τη λίστα: ","Your position on this list: "],["Γράψε το username ενός φίλου. Για να γίνετε φίλοι πρέπει να αποδεχτεί το αίτημα. Οι φίλοι βλέπουν τα στατιστικά σου.","Type a friend's username. You become friends once they accept your request. Friends can see your statistics."],["Δεν έχεις φίλους ακόμα. Στείλε ένα αίτημα με το username τους.","You have no friends yet. Send a request with their username."],["Γράψε ένα σωστό username (3 έως 14 γράμματα ή αριθμούς).","Type a valid username (3 to 14 letters or numbers)."],["Δεν βρέθηκε παίκτης με αυτό το username.","No player found with that username."],["Αυτό είναι το δικό σου username.","That is your own username."],["Είστε ήδη φίλοι.","You are already friends."],["Είχε ήδη στείλει αίτημα σε εσένα, οπότε είστε πλέον φίλοι!","They had already sent you a request, so you are now friends!"],["Έχεις ήδη στείλει αίτημα. Περίμενε να το αποδεχτεί.","You have already sent a request. Wait for them to accept it."],["Το αίτημα στάλθηκε. Όταν το αποδεχτεί, θα εμφανιστεί στη λίστα σου.","The request was sent. When they accept it, they will appear in your list."],["Κάτι πήγε στραβά. Έλεγξε το internet και δοκίμασε ξανά.","Something went wrong. Check your internet and try again."],["Δεν μπόρεσα να το ολοκληρώσω. Δοκίμασε ξανά.","Could not complete that. Try again."],["Δεν μπόρεσα να φορτώσω. Έλεγξε το internet.","Could not load. Check your internet connection."],["Δεν μπόρεσα να φορτώσω την κατάταξη. Έλεγξε το internet.","Could not load the leaderboard. Check your internet connection."],["Έγινε! Είστε πλέον φίλοι.","Done! You are now friends."],["Ο φίλος αφαιρέθηκε.","Friend removed."],["θέλει να γίνετε φίλοι","wants to be your friend"],["Δεν έχει παίξει ακόμα","Has not played yet"],["δεν έχει παίξει","has not played"],["Μετράνε μόνο παιχνίδια με 4 πραγματικούς παίκτες (με φίλους ή γρήγορο παιχνίδι), όχι με bots ή Κοντά μου. Στη γενική κατάταξη φαίνονται μόνο το όνομα και το rating. Στις εβδομαδιαίες και μηνιαίες λίστες φαίνονται οι πόντοι Elo που κέρδισες στην περίοδο.","Only games with 4 real players count (with friends or quick match), not games with bots or Nearby. The general leaderboard shows only name and rating. The weekly and monthly lists show the Elo points you won in that period."],["Δεν υπάρχει κανείς ακόμα σε αυτή τη λίστα. Παίξε με 4 πραγματικούς παίκτες για να μπεις.","Nobody is on this list yet. Play with 4 real players to get on it."],["Δεν υπάρχει κανείς ακόμα σε αυτή τη λίστα.","Nobody is on this list yet."],["Εμφάνιση στη γενική κατάταξη: ΝΑΙ","Show me on the general leaderboard: YES"],["Εμφάνιση στη γενική κατάταξη: ΟΧΙ","Show me on the general leaderboard: NO"],["Εμφάνιση στη γενική κατάταξη","Show me on the general leaderboard"],["Φορτώνω τα στατιστικά σου…","Loading your statistics…"],["Επόμενη κατηγορία: ","Next category: "],[" στους "," at "],[" · σου λείπουν "," · you need "],["Είσαι στην ανώτατη κατηγορία!","You are in the top category!"],["Το παιχνίδι δεν μετρά στην κατάταξη (όριο παιχνιδιών της ημέρας).","This game does not count for the leaderboard (daily game limit)."],[" (ανέβηκες κατηγορία!)"," (you moved up a category!)"],[" (έπεσες κατηγορία)"," (you dropped a category)"],["Κατάταξη:","Ranking:"],["Άρχοντας της Πιλόττας","Lord of Pilotta"],["Προχωρημένος","Advanced"],["Έμπειρος","Experienced"],["Αρχάριος","Beginner"],["Μάστρος","Master"],["% νίκες","% wins"],[" παιχνίδια · "," games · "],[" παιχνίδια"," games"],["Αιτήματα","Requests"],["Οι φίλοι μου","My friends"],["Αποδοχή","Accept"],["Απόρριψη","Decline"],["Αφαίρεση","Remove"],["Αίτημα","Request"],["Username φίλου","Friend's username"],["Φορτώνω…","Loading…"],["Συνολικά","Overall"],["Εβδομάδα","Week"],["Μήνας","Month"],["Γενική","General"],["Κατάταξη","Leaderboard"],["Φίλοι","Friends"],[" (εσύ)"," (you)"],["Κοντά μου (χωρίς internet): παίζεις με φίλους που είναι στο ίδιο δωμάτιο, χωρίς internet. Ο ένας φτιάχνει το τραπέζι και οι άλλοι το βρίσκουν.","Nearby (no internet): you play with friends in the same room, without internet. One person creates the table and the others find it."],["Καλώς ήρθες στην Πιλόττα Παντού!","Welcome to Pilotta Pantou!"],["Παίζεις με τον Σύντροφό σου εναντίον δύο αντιπάλων. Θες μια γρήγορη ξενάγηση στα κουμπιά του παιχνιδιού;","You play with your Partner against two opponents. Would you like a quick tour of the game's buttons?"],["Ναι, δείξε μου τα κουμπιά","Yes, show me the buttons"],["Όχι, ξέρω να παίζω","No, I know how to play"],["Ξενάγηση, βήμα ","Quick guide, step "],["Παράλειψη","Skip"],["Το κεντρικό μενού","The main menu"],["Τρόποι παιχνιδιού","Ways to play"],["Μέσα στο παιχνίδι","During the game"],["Νέο παιχνίδι: ξεκινάς παιχνίδι, μόνος σου με bots, με φίλους ή γρήγορο παιχνίδι online.","New game: play on your own against bots, with friends, or in an online quick match."],["Πώς παίζεται (οδηγός): μια εξήγηση του παιχνιδιού, βήμα βήμα.","How to play (guide): an explanation of the game, step by step."],["Κανόνες: όλοι οι κανόνες και η βαθμολόγηση.","Rules: all the rules and how scoring works."],["Ρυθμίσεις: ήχος, επιφάνεια τραπεζιού, σχέδιο φύλλων, avatar και emotes.","Settings: sound, table surface, card design, avatar and emotes."],["Το κουμπί με τη σφαίρα αλλάζει τη γλώσσα, Ελληνικά ή English.","The globe button switches the language between Greek and English."],["Γρήγορο παιχνίδι: μπαίνεις σε ένα τραπέζι με άλλους τυχαίους παίκτες. Όπου λείπουν παίκτες, παίζουν bots. Με Pilotta Plus έχεις προτεραιότητα στην αναμονή.","Quick match: you join a table with random players. Bots fill any empty seats. With Pilotta Plus you get priority in the queue."],["Με φίλους: φτιάχνεις τραπέζι και δίνεις τον κωδικό, ή μπαίνεις με τον κωδικό ενός φίλου. Διαλέγεις μόνος σου θέση.","With friends: create a table and share its code, or join with a friend's code. You choose your own seat."],["Offline (με bots): παίζεις μόνος σου με 3 bots.","Offline (with bots): play on your own against 3 bots."],["Πάνω βλέπεις τους πόντους: Εμείς, Στόχος και Αυτοί. Το χρώμα κάθε ομάδας φαίνεται και δίπλα στα ονόματα.","The scores are at the top: We, Target and They. Each team's colour also appears next to the player names."],["Τα φύλλα σου είναι κάτω. Τα φύλλα που μπορείς να παίξεις έχουν περίγραμμα, και πατάς πάνω τους για να τα ρίξεις.","Your cards are at the bottom. The cards you can play are outlined: tap one to play it."],["Πάνω δεξιά έχεις πάντα τους Κανόνες και το Μενού. Από το Μενού ανοίγεις και τις Ρυθμίσεις.","The Rules and the Menu are always at the top right. The Menu also opens the Settings."],["Σε παιχνίδι με άλλους παίκτες (γρήγορο ή με φίλους) έχεις και το κουμπί 💬 για emotes. Στο παιχνίδι με φίλους έχεις επίσης μικρόφωνο και κάμερα.","In a game with other players (quick match or with friends) you also have the 💬 button for emotes. In a game with friends you also have a microphone and camera."],["Αυτό το username δεν επιτρέπεται. Διάλεξε άλλο.","This username is not allowed. Choose another one."],["Δώσε τον κωδικό στους φίλους σου. Όσοι κάθονται απέναντι παίζουν μαζί. Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.","Give the code to your friends. Players sitting opposite each other are partners. If you do not have enough players, the host can add bots to the empty seats."],["Ομάδα Α: θέσεις 1 και 3","Team A: seats 1 and 3"],["Ομάδα Β: θέσεις 2 και 4","Team B: seats 2 and 4"],["Ομάδα Α","Team A"],["Ομάδα Β","Team B"],["Θέση 1","Seat 1"],["Θέση 2","Seat 2"],["Θέση 3","Seat 3"],["Θέση 4","Seat 4"],["Έπαιξες τα 2 δοκιμαστικά παιχνίδια. Φτιάξε λογαριασμό για να συνεχίσεις.","You have played the 2 trial games. Create an account to continue."],["Για να παίξεις Κοντά μου χρειάζεται λογαριασμός. Τον φτιάχνεις μία φορά, με internet.","To play Nearby you need an account. You only create it once, online."],["Για να παίξεις online χρειάζεται λογαριασμός.","To play online you need an account."],["Σύνδεση / Λογαριασμός","Sign in / Account"],["Νέος λογαριασμός","New account"],["Σύνδεση","Sign in"],["Δημιουργία λογαριασμού","Create account"],["Ξέχασα τον κωδικό","I forgot my password"],["Κωδικός (τουλάχιστον 6)","Password (at least 6 characters)"],["Username (3-14 γράμματα)","Username (3-14 characters)"],["Διάβασα και αποδέχομαι τη ","I have read and accept the "],["Δήλωση απορρήτου","Privacy statement"],["Για να συνεχίσεις αποδέξου τη Δήλωση απορρήτου.","To continue, accept the Privacy statement."],["Γράψε email και κωδικό.","Type your email and password."],["Γράψε πρώτα το email σου.","Type your email first."],["Σου στείλαμε email για να αλλάξεις κωδικό.","We sent you an email to reset your password."],["Αυτό το email χρησιμοποιείται ήδη.","This email is already in use."],["Το email δεν είναι σωστό.","The email is not valid."],["Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.","The password needs at least 6 characters."],["Λάθος email ή κωδικός.","Wrong email or password."],["Πολλές προσπάθειες. Περίμενε λίγο.","Too many attempts. Please wait a moment."],["Δεν υπάρχει σύνδεση στο internet.","There is no internet connection."],["Η σύνδεση με email δεν έχει ενεργοποιηθεί ακόμα.","Email sign-in is not enabled yet."],["Αυτό το username το έχει ήδη κάποιος.","Someone already has this username."],["Το username θέλει 3 έως 14 γράμματα, αριθμούς ή _ (χωρίς κενά).","The username needs 3 to 14 letters, numbers or _ (no spaces)."],["Κάτι πήγε στραβά. Έλεγξε το internet και δοκίμασε ξανά.","Something went wrong. Check your internet and try again."],["Μισό λεπτό…","One moment…"],["Στέλνω…","Sending…"],["Τι αποθηκεύουμε όταν φτιάχνεις λογαριασμό: το email σου (το κρατά η υπηρεσία σύνδεσης της Google, Firebase), το username και το avatar σου, και τα αποτελέσματα των online παιχνιδιών σου.","What we store when you create an account: your email (kept by Google's sign-in service, Firebase), your username and avatar, and the results of your online games."],["Τα στατιστικά σου (παιχνίδια, νίκες) τα βλέπουν μόνο οι φίλοι σου. Στη γενική κατάταξη φαίνονται μόνο το username και το rating σου. Το email σου δεν το βλέπει κανένας άλλος παίκτης.","Only your friends can see your statistics (games, wins). The general leaderboard shows only your username and rating. No other player sees your email."],["Δεν πουλάμε και δεν δίνουμε τα στοιχεία σου σε κανέναν. Τα παιχνίδια Κοντά μου και με bots δεν στέλνουν στατιστικά πουθενά.","We do not sell or give your details to anyone. Nearby games and games with bots do not send statistics anywhere."],["Μπορείς να διαγράψεις τον λογαριασμό σου όποτε θέλεις από το προφίλ σου. Τότε σβήνονται το email, το username, το avatar και τα στατιστικά σου.","You can delete your account at any time from your profile. Your email, username, avatar and statistics are then erased."],["Θα διαγραφούν ο λογαριασμός, το username, το avatar και τα στατιστικά σου. Δεν γίνεται αναίρεση. Γράψε τον κωδικό σου για να επιβεβαιώσεις.","Your account, username, avatar and statistics will be deleted. This cannot be undone. Type your password to confirm."],["Διαγραφή λογαριασμού","Delete account"],["Αποσύνδεση","Sign out"],["Διαγράφω…","Deleting…"],["Γράψε τον κωδικό σου.","Type your password."],["Διαγραφή","Delete"],["Άκυρο","Cancel"],["Ο κωδικός σου","Your password"],["Emotes άλλων: ","Others' emotes: "],["Το avatar σου","Your avatar"],["Τα emotes σου","Your emotes"],["Διάλεξε μία από τις 5 θέσεις και μετά ένα emote για να την αλλάξεις.","Pick one of the 5 slots, then an emote to replace it."],["Παρακαλώ","You're welcome"],["Βιάσου","Hurry up"],["Φωτιά!","Fire!"],["Μπράβο!","Bravo!"],["Μπράβο","Nice"],["Ωπ!","Whoa!"],["Χα χα","Haha"],["Ουφ","Phew"],["Εύκολο","Easy"],["Χμμ","Hmm"],["Ευχαριστώ","Thanks"],["Πάμε!","Let's go!"],["Σχέδιο φύλλων","Card design"],["Κλασικό","Classic"],["Λευκαρίτικο","Lefkara lace"],["Θάλασσα","Sea"],["Νύχτα","Night"],["Μπορντό","Burgundy"],["Μπλε","Blue"],["Τιρκουάζ","Teal"],["Ξύλο","Wood"],["Μπορείς να ξεκινήσεις όποτε θέλεις. Όσοι δεν έχουν διαλέξει θέση μπαίνουν σε τυχαία θέση και οι κενές θέσεις παίρνουν bots.","You can start whenever you like. Players who haven't chosen a seat are placed at random, and bots fill the empty seats."],["Διάλεξε θέση ή περίμενε. Αν ο οικοδεσπότης ξεκινήσει, θα μπεις σε τυχαία θέση.","Choose a seat or wait. If the host starts, you will get a random seat."],["Το παιχνίδι ξεκίνησε χωρίς εσένα.","The game started without you."],["Περιμένουν να καθίσουν: ","Waiting to sit: "],["Κενή (bot)","Empty (bot)"],["Αν η ομάδα του ανοίγματος αποτύχει, η δήλωση και η πιλόττα της πάνε στους αντιπάλους.","If the bidding team fails, its declaration and pilotta go to the opponents."],["Σε «Κλειστό» η ομάδα που χάνει δεν παίρνει τίποτα. Η δήλωση και η πιλόττα της πάνε στην ομάδα που κερδίζει.","In «Closed» the losing team gets nothing. Its declaration and pilotta go to the winning team."],["Αν η ομάδα του ανοίγματος αποτύχει, οι δηλώσεις της πάνε στους αντιπάλους.","If the bidding team fails, its declarations go to the opponents."],["Πόντοι γύρου (μόνο από τις μπάζες):","Round points (tricks only):"],["Μικρόφωνο: ΟΧΙ","Microphone: OFF"],["Μικρόφωνο: ΝΑΙ","Microphone: ON"],["Κάμερα: ΟΧΙ","Camera: OFF"],["Κάμερα: ΝΑΙ","Camera: ON"],["Δεν δόθηκε άδεια για μικρόφωνο.","Microphone permission was denied."],["Δεν δόθηκε άδεια για κάμερα.","Camera permission was denied."],["Η συσκευή ή ο browser δεν επιτρέπει μικρόφωνο.","This device or browser does not allow the microphone."],["Η συσκευή ή ο browser δεν επιτρέπει κάμερα.","This device or browser does not allow the camera."],["Πιλόττα Παντού","Pilotta Anywhere"],["Οι γύροι αποθηκεύονται ανώνυμα (χωρίς ονόματα), για να γίνονται καλύτερα τα bots.","Rounds are saved anonymously (no names) to help improve the bots."],["Δώσε τον κωδικό στους φίλους σου. Οι θέσεις 1 και 3 παίζουν μαζί, και οι θέσεις 2 και 4. Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.","Give the code to your friends. Seats 1 and 3 play together, as do seats 2 and 4. If there are not enough players, the host can put bots in the empty seats."],["Βάλε bots στις κενές θέσεις","Add bots to empty seats"],["Βγάλε","Remove"],["Για να ξεκινήσει το παιχνίδι πρέπει και οι 4 θέσεις να είναι γεμάτες.","All 4 seats must be filled to start the game."],["Αν δεν έχεις αρκετούς παίκτες, ο οικοδεσπότης μπορεί να βάλει bots στις κενές θέσεις.","If there are not enough players, the host can put bots in the empty seats."],["Με φίλους","With friends"],["Γράψε το όνομά σου. Μετά φτιάξε τραπέζι ή γράψε τον κωδικό που σου έδωσε ο φίλος σου.","Type your name. Then create a table or type the code your friend gave you."],["Νέο τραπέζι","New table"],["Κωδικός","Code"],["Μπες","Join"],["Όνομα","Name"],["Πίσω","Back"],["Συνδέομαι…","Connecting…"],["Δεν μπόρεσα να συνδεθώ. Έλεγξε το internet.","Could not connect. Check your internet."],["Ο κωδικός έχει 4 γράμματα.","The code has 4 letters."],["Δεν βρέθηκε τραπέζι με αυτόν τον κωδικό.","No table found with this code."],["Το παιχνίδι έχει ήδη ξεκινήσει.","The game has already started."],["Το τραπέζι είναι γεμάτο.","The table is full."],["Κάτσε","Sit here"],["Ξεκίνα","Start"],["Φύγε","Leave"],["(εσύ)","(you)"],["Περιμένουμε τον οικοδεσπότη να ξεκινήσει.","Waiting for the host to start."],["Στόχος","Target"],["Τραπέζι","Table"],["Δώσε τον κωδικό στους φίλους σου. Οι θέσεις 1 και 3 παίζουν μαζί, και οι θέσεις 2 και 4. Οι κενές θέσεις παίζονται από bots.","Give the code to your friends. Seats 1 and 3 play together, as do seats 2 and 4. Bots play the empty seats."],["Η σύνδεση για παιχνίδι με φίλους δεν έχει ρυθμιστεί σε αυτή την έκδοση.","Playing with friends is not set up in this version."],["Περιμένουμε…","Waiting…"],["Ήχος: ΝΑΙ","Sound: ON"],["Ήχος: ΟΧΙ","Sound: OFF"],["παίρνει όλες τις υπόλοιπες μπάζες","takes all the remaining tricks"],["Πώς θέλεις να παίξεις;","How do you want to play?"],["Γρήγορο παιχνίδι","Quick match"],["Με φίλους","With friends"],["Offline (με bots)","Offline (with bots)"],["Θα σε βάζει σε τραπέζι με 4 τυχαίους παίκτες online.","It puts you at a table with random players online."],["Μέχρι 4 άτομα στο ίδιο τραπέζι. Κάθε παίκτης που μπαίνει θα διαλέγει πού θα κάτσει.","Up to 4 people at the same table. Each player who joins will choose where to sit."],["Δεν είναι έτοιμο ακόμα. Σύντομα.","Not ready yet. Coming soon."],["Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου την ψηλότερη δήλωσή σου πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Δηλώνεις πάντα μόνο την ψηλότερη (π.χ. με δύο τρίτες λες 20, με πενήντα και τρίτη λες 50). Αν η ψηλότερη δήλωση της ομάδας σου κερδίσει, τις δείχνεις όλες και μετράνε όλες. Λάθος ποσό σημαίνει ότι δεν μετράει.","In the 1st trick, you may announce your highest declaration yourself before you play a card. It is optional: if you play a card, you declare nothing. You only ever announce the highest one (e.g. with two tierces you say 20; with a fifty and a tierce you say 50). If your team's highest declaration wins, you show them all and they all count. Announcing the wrong amount means it doesn't count."],["Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου την ψηλότερη δήλωσή σου, πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Δηλώνεις πάντα μόνο την ψηλότερη: με δύο τρίτες (40) λες 20. Αν η ψηλότερη δήλωση της ομάδας σου κερδίσει, δείχνεις όλες τις δηλώσεις σου. Λάθος ποσό σημαίνει ότι δεν μετράει.","In the 1st trick, you may announce your highest declaration yourself, before you play a card. It is optional: if you play a card, you declare nothing. You only ever announce the highest one: with two tierces (40) you say 20. If your team's highest declaration wins, you show all your declarations. Announcing the wrong amount means it doesn't count."],["Ξεκινούν από 80, πολλαπλάσια του 10, και κάθε άνοιγμα ανεβάζει. Η 250 σημαίνει όλες τις μπάζες, και με τις δηλώσεις μπορείς να πας πιο ψηλά. Το μέγιστο που γίνεται είναι 820: 250 για όλες τις μπάζες, 550 από δηλώσεις (τέσσερα Βαλέ 200, τέσσερα 9 150 και δύο ακόμα τετράδες 100) και 20 η πιλόττα.","Bids start at 80, in multiples of 10, and each bid must be higher than the last. 250 means all the tricks, and with declarations you can go higher. The highest possible bid is 820: 250 for all the tricks, 550 from declarations (four Jacks 200, four 9s 150 and two more fours of a kind 100) and 20 for the pilotta."],["Οποιοσδήποτε αντίπαλος του ψηλότερου ανοίγματος μπορεί να πει «Κλειστό» όποτε έρθει η σειρά του, μέχρι να κλείσουν τα ανοίγματα. Το άνοιγμα μετράει ×2 και τα ανοίγματα κλείνουν. Μετά, μόνο η ομάδα του ανοίγματος μπορεί να πει «Ανοιχτό» (×4).","Either opponent of the highest bidder may say «Closed» on their turn, as long as bidding is still open. The bid then counts ×2 and bidding ends. After that, only the bidding team may say «Open» (×4)."],["150: τέσσερα εννιάρια, ζητώ Βαλέ ή να με γυρίσει εκεί που τον έχει. 160: τέσσερις Άσοι, να με γυρίσει όπου είναι πιο δυνατός στα κόζια. 220: τέσσερις Βαλέδες, ζητώ εννιάρι ή να με γυρίσει όπου το έχει (τουλάχιστον στο Σπαθί).","150: four nines. I ask for the Jack, or for my partner to switch to the suit where he holds it. 160: four Aces. My partner should switch to his strongest trump suit. 220: four Jacks. I ask for the nine, or for my partner to switch to the suit where he holds it (at least in Clubs)."],["Μετράει μόνο η ομάδα με τη μεγαλύτερη δήλωση, και παίρνει και του συντρόφου. Στα ίσα ισχύει η σειρά που τελειώνει σε ψηλότερο φύλλο. Στα απολύτως ίσα, κερδίζει όποια είναι σε κόζια, αλλιώς δεν μετράει καμία.","Only the team with the highest declaration scores, and it also scores its partner's declarations. On a tie, the run ending in the higher card wins. On an exact tie, the one in trumps wins; otherwise neither counts."],["Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το κάνεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η μπάζα, όπου μπορεί να δείξει ο αντίπαλος.","In the 2nd trick, if your team has the highest declaration, press «Show your declaration» before you play a card. If you don't, it is lost and the declarations are compared again in the 3rd trick, where the opponents may show theirs."],["80 σημαίνει Βαλές ή εννιάρι και τουλάχιστον έναν Άσο. 90: και τα δύο κόζια. 100: πες μου τους Άσους σου. 130 και 140: έχω πενήντα. 180 και 190: έχω πέντε στη σειρά. 150: τέσσερα εννιάρια. 160: τέσσερις Άσοι. 220: τέσσερις Βαλέδες.","80 means Jack or nine and at least one Ace. 90: both top trumps. 100: tell me your Aces. 130 and 140: I have a fifty. 180 and 190: I have a run of five. 150: four nines. 160: four Aces. 220: four Jacks."],["Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο: Βαλές της φυλής του 1, εννιάρι της φυλής του με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, και κάθε Άσος εκτός κοζιών 1 ακόμα.","When your partner bids, you raise by 10 for each point: Jack of his suit 1, nine of his suit with at least one more trump 1, Jack and nine together 3, and 1 more for each Ace outside trumps."],["Πόσο ανεβαίνεις έχει νόημα: άνοιγμα 80 ή +10 πάνω από το προηγούμενο άνοιγμα σημαίνει Βαλές ή 9 με Άσο. 90 ή +20: Βαλές και 9. 100 ή +30: ζητάς από τον σύντροφο να πει τους Άσους του.","The size of your raise matters: opening 80 or raising by 10 means Jack or 9 with an Ace. 90 or +20: Jack and 9. 100 or +30: you ask your partner to show his Aces."],["Πόσο ανεβαίνεις: 80 ή +10 πάνω από το προηγούμενο άνοιγμα = Βαλές ή 9 με Άσο. 90 ή +20 = Βαλές και 9. 100 ή +30 = ο σύντροφος να πει τους Άσους του, και προσθέτει 10 για κάθε Άσο.","How much you raise: 80 or +10 over the previous bid = Jack or 9 with an Ace. 90 or +20 = Jack and 9. 100 or +30 = your partner should show his Aces, adding 10 for each one."],["Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο που έχεις: Βαλές της φυλής του 1, εννιάρι με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, κάθε Άσος εκτός κοζιών 1.","When your partner bids, you raise by 10 for each point you have: Jack of his suit 1, nine with at least one more trump 1, Jack and nine together 3, each Ace outside trumps 1."],["Όταν τα κόζια είναι δικά σας και πετάς φύλλα σε μπάζα του συντρόφου: κατεβαίνεις (Ρήγας, Ντάμα, 9) αν δεν έχεις Άσο σε εκείνη τη φυλή, ανεβαίνεις (9, Βαλές, Ρήγας) αν έχεις.","When your team holds the trumps and you discard on your partner's trick: play high to low (King, Queen, 9) if you have no Ace in that suit, low to high (9, Jack, King) if you do."],["Το σκορ μετριέται σε δεκάδες. Στους πόντους του γύρου, αν το τελευταίο ψηφίο είναι 7 ή πάνω, στρογγυλοποιείς προς τα πάνω (17 γίνεται 2), αλλιώς προς τα κάτω (16 γίνεται 1).","The score is kept in tens. For round points, if the last digit is 7 or more you round up (17 becomes 2), otherwise you round down (16 becomes 1)."],["Το άνοιγμα πετυχαίνει όταν η ομάδα κάνει τουλάχιστον όσους πόντους έταξε. Η δήλωση και η πιλόττα της μετρούν ήδη σε αυτό (π.χ. άνοιγμα 80 με τρίτη: πρέπει να κάνει 60).","The bid succeeds when the team makes at least as many points as it bid. Its declarations and pilotta count towards this (e.g. a bid of 80 with a tierce: it must make 60)."],["Η ομάδα του ανοίγματος ανοίγει πρώτα κόζια για να πάρει τα κόζια των αντιπάλων. Όταν ο σύντροφος παίζει κόζια, ρίχνεις τα δυνατά σου κόζια (όχι το 9 αν βγει ο Βαλές).","The bidding team leads trumps early to draw the opponents' trumps. When your partner leads trumps, you play your strong trumps (but not the 9 if the Jack has been played)."],["Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το πατήσεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η.","In the 2nd trick, if your team has the highest declaration, press «Show your declaration» before you play a card. If you don't, it is lost and the declarations are compared again in the 3rd trick."],["Πιλόττα: Ρήγας και Ντάμα στα κόζια, 20. Μετράει πάντα και δεν δηλώνεται στην 1η μπάζα. Την ανακοινώνεις όταν ρίξεις το πρώτο (πιλόττα) και το δεύτερο (ρεπιλόττα).","Pilotta: King and Queen of trumps, worth 20. It always counts and is not declared in the 1st trick. You announce it as you play the first card («Pilotta») and the second («Repilotta»)."],["100: ο σύντροφος να πει ποιους Άσους έχει, ανεξάρτητα από τα κόζια του. Έτσι ανοίγεις και όταν ο αντίπαλος έχει ήδη προσφέρει 80 σε άλλη φυλή, αντί για 90.","100: your partner should say which Aces he has, regardless of his trumps. This lets you open 100 instead of 90 even when an opponent has already bid 80 in another suit."],["4 παίκτες σε 2 ομάδες: εσύ και ο Σύντροφος απέναντι σε Ανατολή και Δύση. 32 φύλλα, από το 7 ως τον Άσο. Η φορά είναι αντίθετη από των δεικτών του ρολογιού.","4 players in 2 teams: you and your Partner against East and West. 32 cards, from 7 up to Ace. Play goes counter-clockwise."],["Η ομάδα του ανοίγματος που παίρνει όλες τις μπάζες παίρνει 25 αντί για 16. Αν οι αντίπαλοι πάρουν όλες τις μπάζες («ανάποδο»), κερδίζουν αμέσως το παιχνίδι.","If the bidding team takes all the tricks, it gets 25 instead of 16. If the opponents take all the tricks («reverse»), they win the game immediately."],["Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Δεν το έχεις; Αν έχεις κόζια, πρέπει να κόψεις, ακόμα και πάνω από τον σύντροφό σου. Αυτό είναι το τσάκκισμα.","You must follow suit. Can't? If you have trumps, you must cut, even if your partner is winning. This is forced trumping (tsakkisma)."],["Οποιοσδήποτε αντίπαλος του ψηλότερου ανοίγματος μπορεί να πει «Κλειστό» (×2 στο άνοιγμα). Η ομάδα του ανοίγματος μπορεί τότε να απαντήσει «Ανοιχτό» (×4).","Any opponent of the highest bid may say «Closed» (×2 on the bid). The bidding team may then answer «Open» (×4)."],["Αν η ομάδα δεν είχε δήλωση και έκανε μόνο 70, χάνει. Οι αντίπαλοι παίρνουν 8 (άνοιγμα) + 16 (ολόκληρος ο γύρος) = 24, και η ομάδα του ανοίγματος τίποτα.","If the team had no declaration and made only 70, it fails. The opponents get 8 (bid) + 16 (whole round) = 24, and the bidding team gets nothing."],["Κερδίζει όποιος φτάσει πρώτος στον στόχο (101 έως 601, ανά 50). Αν φτάσουν και οι δύο, κερδίζει το μεγαλύτερο σκορ. Σε ισοπαλία παίζεται κι άλλος γύρος.","The first team to reach the target wins (101 to 601, in steps of 50). If both reach it, the higher score wins. If they are tied, another round is played."],["Ποτέ δεν προσθέτεις πόντους που δεν μπορεί να βγάλει η ομάδα. Αν ο σύντροφος επιμένει και έχεις δήλωση, μπορείς να του βάλεις «ψεύτικους» πόντους.","Never add points your team cannot make. If your partner keeps raising and you have a declaration, you can add «fake» points to help him."],["Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Αν δεν έχεις και έχεις κόζια, πρέπει να τσακκίσεις (να κόψεις), ακόμα κι αν κερδίζει ο σύντροφός σου.","You must follow suit. If you can't and you have trumps, you must cut (forced trumping), even if your partner is winning."],["Άνοιγμα 80 στο Καρό: η ομάδα πρέπει να κάνει τουλάχιστον 80 από τους 162 πόντους του γύρου. Έχει τρίτη (20); Χρειάζεται μόνο 60 από τα φύλλα.","Bid 80 in Diamonds: the team must make at least 80 of the round's 162 points. Does it have a tierce (20)? Then it needs only 60 from the cards."],["Στο παιχνίδι: Πιλόττα με Ντάμα σημαίνει τουλάχιστον 3 κόζια, με Ρήγα σημαίνει μόνο την πιλόττα. Όταν κόβεις στην 1η μπάζα, ρίχνεις μικρό κόζι.","In play: a pilotta started with the Queen means at least 3 trumps; started with the King, it means only the pilotta. When you cut in the 1st trick, use a small trump."],["Η ομάδα έκανε 100 πόντους και είχε τρίτη: παίρνει 10 (φύλλα) + 2 (τρίτη) + 8 (άνοιγμα) = 20 στο σκορ. Οι αντίπαλοι με 62 πόντους παίρνουν 6.","The team made 100 points and had a tierce: it scores 10 (cards) + 2 (tierce) + 8 (bid) = 20. The opponents, with 62 points, get 6."],["5. Μετράτε πόντους. Αν η ομάδα του ανοίγματος έκανε όσους υποσχέθηκε, τους παίρνει μαζί με το άνοιγμα. Αλλιώς τους παίρνουν οι αντίπαλοι.","5. Count the points. If the bidding team made what it bid, it scores them plus the bid. Otherwise the opponents take them."],["Οι φυλές: Κούπα ♥, Καρό ♦, Σπαθί ♣, Πίκα ♠. Τα φύλλα σου εμφανίζονται ανά φυλή, κόκκινη και μαύρη εναλλάξ, από το μικρό στο μεγάλο.","The suits: Hearts ♥, Diamonds ♦, Clubs ♣, Spades ♠. Your cards are sorted by suit, alternating red and black, from low to high."],["Αν έχεις τα πιο δυνατά φύλλα μιας φυλής, ρίχνεις τον Άσο της για να δείξεις στον σύντροφο ότι θα του κάνεις τις μπάζες που του λείπουν.","If you hold the top cards of a suit, play its Ace to show your partner that you will win the tricks he is missing."],["Αποτυχημένο: οι αντίπαλοι παίρνουν το άνοιγμα, 16 για τον γύρο, τις δηλώσεις τους και την πιλόττα. Η ομάδα του ανοίγματος παίρνει 0.","Failed bid: the opponents get the bid, 16 for the round, their declarations and the pilotta. The bidding team gets 0."],["Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100, με 9 150, με βαλέδες 200 (7 και 8 δεν μετράνε).","Three in a row: 20. Four in a row: 50. Five or more: 100. Four of a kind: 100; nines 150, Jacks 200 (7s and 8s don't count)."],["Αν η ομάδα του ανοίγματος πετύχει: παίρνει τους πόντους της, το άνοιγμα και τις δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους.","If the bidding team succeeds: it gets its points, the bid and the declarations. The opponents get their own."],["Όλες οι μπάζες από την ομάδα του ανοίγματος: 25 αντί για 16. Όλες οι μπάζες από τους αντιπάλους: «ανάποδο», κερδίζουν το παιχνίδι.","All tricks to the bidding team: 25 instead of 16. All tricks to the opponents: «reverse», and they win the game."],["Δήλωση (προαιρετική): αν έχεις, πες την ψηλότερη δήλωσή σου πριν ρίξεις φύλλο. Αν ρίξεις φύλλο χωρίς δήλωση, δεν δηλώνεις τίποτα.","Declaration (optional): if you have one, announce your highest before you play a card. If you play a card without declaring, you declare nothing."],["Ο «Οδηγός παιχνιδιού» στο μενού προτείνει κάθε κίνηση και την εξηγεί. Είναι κλειστός από την αρχή και ανοίγει από το ίδιο μενού.","The «Game coach» in the menu suggests every move and explains it. It is off from the start and can be turned on from the same menu."],["Πετυχημέντο άνοιγμα: η ομάδα παίρνει πόντους φύλλων, άνοιγμα και δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους πόντους.","Successful bid: the team gets its card points, the bid and its declarations. The opponents get their own points."],["Ρήγας και Ντάμα στα κόζια είναι η πιλόττα (20). Δεν δηλώνεται, αλλά μετράει πάντα. Την ανακοινώνεις όταν ρίχνεις τα φύλλα.","King and Queen of trumps are the pilotta (20). It is not declared, but it always counts. You announce it when you play the cards."],["Αν αποτύχει: οι αντίπαλοι παίρνουν το άνοιγμα, 162 πόντους και τις δηλώσεις, και η ομάδα του ανοίγματος παίρνει μηδέν.","If it fails: the opponents get the bid, the 162 points and the declarations, and the bidding team gets nothing."],["Κάθε γύρος έχει 8 μπάζες και 162 πόντους. Οι πόντοι έρχονται από τα φύλλα που μαζεύουν οι μπάζες και από τις δηλώσεις.","Each round has 8 tricks and 162 points. Points come from the cards won in tricks and from declarations."],["Το άνοιγμα 250 σημαίνει όλες τις μπάζες. Με δηλώσεις μπορεί να ανέβει ακόμα παραπάνω. Το απόλυτο μέγιστο είναι 820.","A bid of 250 means all the tricks. With declarations it can go even higher. The absolute maximum is 820."],["Όταν παίζονται κόζια, ο επόμενος πρέπει να ρίξει πιο δυνατό κόζια αν έχει. Αν δεν έχει, ρίχνει όποιο κόζια θέλει.","When trumps are led, each player must play a higher trump if he has one. If not, he plays any trump."],["Κόζια: Βαλές 20, 9 14, Άσος 11, 10 10, Ρήγας 4, Ντάμα 3. Άλλες φυλές: Άσος 11, 10 10, Ρήγας 4, Ντάμα 3, Βαλές 2.","Trumps: Jack 20, 9 14, Ace 11, 10 10, King 4, Queen 3. Other suits: Ace 11, 10 10, King 4, Queen 3, Jack 2."],["80: Βαλές ή εννιάρι και τουλάχιστον έναν Άσο εκτός κοζιών. Ο σύντροφος να πει αν έχει το άλλο και ποιους Άσους.","80: Jack or nine and at least one Ace outside trumps. Your partner should say whether he has the other one, and which Aces."],["Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100 (εννιάρια 150, βαλέδες 200).","Three in a row: 20. Four in a row: 50. Five or more: 100. Four of a kind: 100 (nines 150, Jacks 200)."],[" Έχεις και πιλόττα (Ρήγα και Ντάμα στα κόζια): δεν δηλώνεται, την ανακοινώνεις όταν ρίξεις το πρώτο από τα δύο."," You also have the pilotta (King and Queen of trumps): it is not declared; you announce it when you play the first of the two."],["Ο σύντροφός σου ανέβασε +20: ζητά τους Άσους σου, αλλά μόνο αν έχεις τουλάχιστον ένα κόζι στη φυλή του. Έχεις ","Your partner raised by 20: he is asking for your Aces, but only if you have at least one trump in his suit. You have "],["90: και Βαλές και εννιάρι. Ο σύντροφος προσθέτει 10 για κάθε Άσο εκτός κοζιών, αν έχει τουλάχιστον ένα κόζι.","90: both Jack and nine. Your partner adds 10 for each Ace outside trumps, if he has at least one trump."],["Δοκίμασε να παίξεις πρώτα με χαμηλά ανοίγματα (80 με 100) μέχρι να συνηθίσεις τις μπάζες και το τσάκκισμα.","Start with low bids (80 to 100) until you get used to the tricks and forced trumping."],["3. 1η μπάζα: δηλώνεις αν έχεις δήλωση (προαιρετικό). 2η μπάζα: η ομάδα με τη μεγαλύτερη δήλωση τη δείχνει.","3. 1st trick: declare if you have a declaration (optional). 2nd trick: the team with the highest declaration shows it."],["Έχεις Βαλέ ή εννιάρι της φυλής με Άσο εκτός και τουλάχιστον 3 κόζια. Το 80 το λέει και στον σύντροφό σου.","You have the Jack or nine of the suit, an outside Ace and at least 3 trumps. Bidding 80 also tells your partner this."],["Το άνοιγμα είναι υπόσχεση: η ομάδα του πρέπει να κάνει τόσους πόντους. Αλλιώς τους παίρνουν οι αντίπαλοι.","The bid is a promise: the team must make that many points. Otherwise the opponents take them."],["Τελειώνουν όταν μετά από ένα άνοιγμα ακολουθούν 3 πάσο στη σειρά. Ένα νέο άνοιγμα μηδενίζει το μέτρημα.","Bidding ends when a bid is followed by 3 passes in a row. A new bid restarts the count."],["Κόζια: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7. Στις άλλες φυλές: Άσος, 10, Ρήγας, Ντάμα, Βαλές, 9, 8, 7.","Trumps: Jack, 9, Ace, 10, King, Queen, 8, 7. In other suits: Ace, 10, King, Queen, Jack, 9, 8, 7."],["Έχεις πέντε φύλλα στη σειρά (εκατό) με Βαλέ: το bid είναι 80 (μόνο Βαλές) ή 90 (Βαλές και 9) συν τα 100.","You have five in a row (a hundred) with the Jack: bid 80 (Jack only) or 90 (Jack and 9) plus the 100."],["Ανοίγεις κόζια για να χάσουν οι αντίπαλοι τα δυνατά τους κόζια. Παίζεις μικρό για να μη χάσεις πόντους.","You lead trumps to draw out the opponents' strong trumps. You lead low so you don't lose points."],["Χωρίς φυλή και χωρίς κόζια, ρίχνεις ό,τι θες. Την επόμενη μπάζα ανοίγει όποιος κέρδισε την προηγούμενη.","With no suit and no trumps, you play whatever you like. The winner of the previous trick leads the next."],["2. Ανοίγματα: λέτε πάσο ή προσφέρετε πόντους και φυλή. Η φυλή του τελευταίου ανοίγματος γίνεται κόζια.","2. Bidding: each player passes or bids points and a suit. The suit of the last bid becomes trumps."],["Δίνεις τη μπάζα επίτηδες: κρατάς τον Άσο για αργότερα, ώστε να πάρεις και το 10 που δεν έχει παιχτεί.","You give up the trick on purpose: you keep your Ace for later, so you can also catch the 10 that hasn't been played yet."],["Πιλόττα με Ντάμα σημαίνει τουλάχιστον 3 κόζια. Πιλόττα με Ρήγα σημαίνει ότι κρατάς μόνο την πιλόττα.","A pilotta started with the Queen means at least 3 trumps. Started with the King, it means you hold only the pilotta."],["Έχεις Βαλέ, εννιάρι και 4 ή περισσότερα κόζια. Το 100 ζητά από τον σύντροφο να πει τους Άσους του.","You have the Jack, the nine and 4 or more trumps. Bidding 100 asks your partner to show his Aces."],["130 (10 έως Ρήγας ή Βαλές έως Άσος) και 140 (άλλο πενήντα): έχω πενήντα. Ψάχνω εννιάρι και Άσους.","130 (10 to King or Jack to Ace) and 140 (another fifty): I have a fifty. I'm looking for the nine and Aces."],["180 και 190: έχω πέντε ή περισσότερα στη σειρά (100) με Βαλέ. 180 = μόνο Βαλές (80+100), 190 = Βαλές και εννιάρι (90+100).","180 and 190: I have a run of five or more (100) with the Jack. 180 = Jack only (80+100), 190 = Jack and nine (90+100)."],["Δεν έχεις ούτε τη φυλή ούτε κόζια; Ρίχνεις ό,τι θες. Στη μπάζα που κέρδισες ανοίγεις την επόμενη.","You have neither the suit nor trumps? Play anything. Whoever wins a trick leads the next one."],["Δεν έχεις ούτε τη φυλή ούτε κόζια, ρίχνεις ό,τι θες. Ρίχνεις αυτό που σου χρειάζεται λιγότερο.","You have neither the suit nor trumps, so you can play anything. Play the card you need least."],["Είναι το πιο δυνατό φύλλο της φυλής που έμεινε, άρα παίρνει τη μπάζα (εκτός αν κοπεί με κόζι).","It is the highest card left in the suit, so it wins the trick (unless someone cuts with a trump)."],["Ένα φύλλο μετράει σε μία μόνο δήλωση. Μεγάλη σειρά σπάει σε δύο (π.χ. 7-8-9 και 10 έως Άσος).","A card can count in only one declaration. A long run splits into two (e.g. 7-8-9 and 10 to Ace)."],["Δεν μπορείς να κερδίσεις τη μπάζα, οπότε ρίχνεις το φύλλο που χάνει τους λιγότερους πόντους.","You can't win the trick, so you play the card that gives away the fewest points."],["Η φυλή του τελευταίου ανοίγματος γίνεται κόζια. Τα ανοίγματα κλείνουν όταν ακολουθούν 3 πάσο.","The suit of the last bid becomes trumps. Bidding ends when 3 passes follow."],[" Θυμήσου: η ομάδα σου πρέπει να κάνει τόσους πόντους από τους 162, και οι δηλώσεις μετράνε."," Remember: your team must make that many points out of 162, and declarations count."],["Δεν έχεις αρκετή δύναμη στα κόζια (Βαλέ ή 9 με Άσο εκτός και 3 κόζια). Πάσο είναι ασφαλές.","You don't have enough in trumps (Jack or 9 with an outside Ace and 3 trumps). It's safer to pass."],["ζητά 3 μπάζες σε μια φυλή εκτός κόζια, δηλαδή Άσο, 10 και Ρήγα (10 για κάθε τέτοια φυλή).","he is asking for 3 tricks in a suit outside trumps, i.e. Ace, 10 and King (10 for each such suit)."],["Όταν παίζονται κόζια, ρίχνεις πιο δυνατό κόζια αν έχεις. Αλλιώς ρίχνεις όποιο κόζια θες.","When trumps are led, play a higher trump if you have one. Otherwise play any trump."],["Ο σύντροφός σου ανέβασε το άνοιγμα κατά 30 (ή άνοιξε 100): ζητά τους Άσους σου. Έχεις ","Your partner raised the bid by 30 (or opened 100): he is asking for your Aces. You have "],["Είναι το πιο δυνατό κόζι που έμεινε: παίρνει τη μπάζα και τραβά τα κόζια των αντιπάλων.","It is the highest trump left: it wins the trick and draws out the opponents' trumps."],["Το σκορ μετριέται σε δεκάδες. Κερδίζει η ομάδα που φτάνει πρώτη τον στόχο που διάλεξες.","The score is kept in tens. The first team to reach the target you chose wins."],["Αν πεις «Ανοιχτό», το άνοιγμα μετράει ×4. Μόνο η ομάδα του ανοίγματος μπορεί να το πει.","If you say «Open», the bid counts ×4. Only the bidding team can say it."],["Η ομάδα σου έχει τη μεγαλύτερη δήλωση. Αν ρίξεις φύλλο χωρίς να τη δείξεις, χάνεται.","Your team has the highest declaration. If you play a card without showing it, it is lost."],["Όταν κόβεις φυλή στην 1η μπάζα, ρίχνεις μικρό κόζι για να το καταλάβει ο σύντροφος.","When you cut a suit in the 1st trick, use a small trump so your partner gets the message."],["Κάθε παίκτης λέει πάσο ή άνοιγμα: 80 ή πάνω, πολλαπλάσια του 10, μαζί με μια φυλή.","Each player passes or bids 80 or more, in multiples of 10, together with a suit."],["Κάθε άνοιγμα έχει και φυλή, και η φυλή του τελευταίου ανοίγματος γίνεται κόζια.","Each bid also names a suit, and the suit of the last bid becomes trumps."],["Το άνοιγμα πρέπει να είναι μεγαλύτερο από το τελευταίο. Το χέρι σου αντέχει ","The bid must be higher than the last one. Your hand can support "],["Με «Κλειστό» ή «Ανοιχτό» παίρνει πόντους μόνο η ομάδα που κερδίζει τον γύρο.","With «Closed» or «Open», only the team that wins the round scores."],["Ο γύρος έχει 162 πόντους: 152 από τα φύλλα και 10 για την τελευταία μπάζα.","A round has 162 points: 152 from the cards and 10 for the last trick."],["Με αυτό το φύλλο παίρνεις τη μπάζα, και είναι το πιο μικρό που κερδίζει.","This card wins the trick, and it is the lowest card that does."],["Με το κουμπί «Προηγούμενη μπάζα» βλέπεις τα φύλλα της τελευταίας μπάζας.","Use the «Previous trick» button to see the cards of the last trick."],["Ο σύντροφός σου παίρνει τη μπάζα, δεν χρειάζεται να ρίξεις μεγάλο φύλλο.","Your partner is winning the trick, so you don't need to play a high card."],["Παίζεις με τον Σύντροφό σου εναντίον δύο αντιπάλων. 4 παίκτες, 32 φύλλα.","You play with your Partner against two opponents. 4 players, 32 cards."],["Έχεις τέσσερα φύλλα στη σειρά (πενήντα): το bid το λέει στον σύντροφο.","You have four in a row (a fifty): your bid tells your partner."],["Παίζετε σε ζευγάρια: εσύ με τον Σύντροφο απέναντι σε Ανατολή και Δύση.","You play in pairs: you and your Partner against East and West."],["Η πιλόττα της ομάδας που χάνει πάει στην ομάδα που κερδίζει τον γύρο.","The losing team's pilotta goes to the team that wins the round."],[" και το χέρι σου δεν αρκεί για να το ξεπεράσεις με ασφάλεια. Πάσο."," and your hand is not enough to beat it safely. Pass."],["4. Παίζονται 8 μπάζες. Όποιος παίρνει τη μπάζα ανοίγει την επόμενη.","4. 8 tricks are played. The winner of a trick leads the next."],["Σε «Κλειστό» που πετυχαίνει, δεν μετράνε οι δηλώσεις των αντιπάλων.","When «Closed» succeeds, the opponents' declarations don't count."],[". Πάτα «Δηλώνω» πριν ρίξεις φύλλο. Αν κερδίσει, τις δείχνεις όλες.",". Press «Declare» before you play a card. If it wins, you show them all."],["Ο σύντροφός σου παίρνει τη μπάζα, οπότε βάζεις πολλούς πόντους (","Your partner is winning the trick, so you give him plenty of points ("],["Στα κόζια η σειρά είναι: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7.","In trumps the order is: Jack, 9, Ace, 10, King, Queen, 8, 7."],["Μια μπάζα χωρίς πόντους μετράει 10 (20 αν είναι η τελευταία).","A trick with no points counts 10 (20 if it is the last)."],["Έχεις μόνο ένα επιτρεπτό φύλλο, οπότε δεν υπάρχει επιλογή.","You have only one legal card, so there is no choice."],["Διάλεξε στόχο σκορ. Όποια ομάδα τον φτάσει πρώτη κερδίζει.","Choose a target score. The first team to reach it wins."],["Δεν έχεις δήλωση (τρία φύλλα στη σειρά ή τέσσερα ίδια).","You have no declaration (three in a row or four of a kind)."],["Οι bots παίζουν έτσι, οπότε μπορείς να τους διαβάζεις.","The bots play this way, so you can read their signals."],[" αλλά η ψηλότερη δήλωσή σου είναι άλλη. Δεν μετράει."," but your highest declaration is another one. It doesn't count."],["Δεν δήλωσες τίποτα, οπότε η δήλωσή σου δεν μετράει.","You declared nothing, so your decl αθιστά bot."," disconnected: a bot takes their place."],["Είσαι ακόμα εδώ;","Are you still there?"],["Πάτησε το κουμπί, αλλιώς σε ","Tap the button, or a bot will take your place in "],[" δευτερόλεπτα θα σε αντικαταστήσει bot."," seconds."],["Είμαι εδώ","I'm here"],["Σε αντικατέστησε bot","A bot took your place"],["Δεν απάντησες εγκαίρως. Το bot παίζει για σένα μέχρι να γυρίσεις.","You did not respond in time. The bot plays for you until you come back."],["Γύρισα","I'm back"],["Ψάχνουμε παίκτες… Έτοιμοι: ","Looking for players… Ready: "],["Αν δεν βρεθούν 4 άτομα σε λίγα δευτερόλεπτα, οι κενές θέσεις παίρνουν bots.","If 4 players aren't found within a few seconds, bots take the empty seats."],[" · μικρόφωνο"," · microphone"],["Δεν δόθηκε άδεια για μικρόφωνο. Σε iPhone: Ρυθμίσεις → Safari → Μικρόφωνο → Ρώτα/Επιτρέπω, και ξαναφόρτωσε τη σελίδα.","Microphone permission was not given. On iPhone: Settings → Safari → Microphone → Ask/Allow, and reload the page."],["Δεν δόθηκε άδεια για κάμερα. Σε iPhone: Ρυθμίσεις → Safari → Κάμερα → Ρώτα/Επιτρέπω, και ξαναφόρτωσε τη σελίδα.","Camera permission was not given. On iPhone: Settings → Safari → Camera → Ask/Allow, and reload the page."],["Σφάλμα μικροφώνου","Microphone error"],["Σφάλμα κάμερας","Camera error"],["Στην εφαρμογή Android, το «Κοντά μου» ζητά την άδεια τοποθεσίας, γιατί το Android την απαιτεί για να βρει κοντινές συσκευές. Δεν συλλέγουμε, δεν αποθηκεύουμε και δεν στέλνουμε την τοποθεσία σου πουθενά.","In the Android app, Nearby asks for the location permission because Android requires it to find nearby devices. We do not collect, store or send your location anywhere."],["Φόντο πίσω από το τραπέζι","Background behind the table"],["Φόντο","Background"],["Απλό","Plain"],["Λινό","Linen"],["Μέντα","Mint"],["Ουρανός","Sky"],["Σούρουπο","Dusk"],["Πέτρα","Stone"],["Κανονικά","Standard"],["Χριστούγεννα","Christmas"],["Κάμερα/μικρόφωνο: δεν έγινε σύνδεση με ","Camera/microphone: could not connect with "],[". Συνήθως δουλεύει όταν είστε συνδεδεμένοι σε Wi-Fi.",". It usually works when you are connected to Wi-Fi."],["Φύγε από το τραπέζι","Leave the table"],["Είσαι ο οικοδεσπότης: αν φύγεις, το τραπέζι κλείνει για όλους.","You are the host: if you leave, the table closes for everyone."],["Θα φύγεις και τη θέση σου θα πάρει bot. Δεν μπορείς να ξαναμπείς σε αυτό το παιχνίδι.","You will leave and a bot will take your seat. You cannot rejoin this game."],["Θα μετρήσει ως ήττα στην κατάταξη.","It will count as a loss in the rankings."],["Δεν θα μπορείς να παίξεις Γρήγορο παιχνίδι για 15 λεπτά.","You will not be able to play Quick match for 15 minutes."],[" έφυγε από το τραπέζι: τη θέση του παίρνει bot."," left the table: a bot takes their seat."],["Το παιχνίδι τελείωσε","The game is over"],["Ο οικοδεσπότης έφυγε από το τραπέζι.","The host left the table."],["Online παιχνίδι","Online game"],["Το προηγούμενο online παιχνίδι σου έκλεισε πριν τελειώσει και μέτρησε ως ήττα","Your previous online game closed before it finished and counted as a loss"],["Έφυγες από παιχνίδι πριν τελειώσει. Μπορείς να ξαναπαίξεις Γρήγορο παιχνίδι σε ","You left a game before it finished. You can play Quick match again in "],[" λεπτά."," minutes."],["Για τη φωνή και το βίντεο κρατάμε ανώνυμα στοιχεία σύνδεσης (αν πέτυχε, διάρκεια, όγκος δεδομένων), χωρίς ονόματα ή διευθύνσεις, για να βελτιώνουμε την υπηρεσία. Σβήνονται αυτόματα μετά από περίπου 60 ημέρες. Όταν η φωνή ή η κάμερα δεν μπορούν να συνδεθούν απευθείας ανάμεσα στις συσκευές, ο ήχος και η εικόνα περνούν κρυπτογραφημένα από servers αναμετάδοσης της Cloudflare, χωρίς να αποθηκεύονται.","For voice and video we keep anonymous connection data (whether it worked, duration, amount of data), without names or addresses, to improve the service. It is deleted automatically after about 60 days. When voice or video cannot connect directly between devices, the audio and video pass encrypted through Cloudflare relay servers and are not stored."],["Το παιχνίδι με τα bots θα σταματήσει. Το σκορ από τους γύρους που έχουν τελειώσει κρατιέται και μπορείς να συνεχίσεις από το Κύριο μενού.","The game with the bots will stop. The score of the rounds already finished is kept, and you can continue from the Main menu."],["Ρεβάνς","Rematch"],["Η ρεβάνς ξεκίνησε χωρίς εσένα.","The rematch started without you."],[" μοίρασε. Ξεκινούν τα ανοίγματα."," has dealt. Bidding starts."],["Μοίρασες. Ξεκινούν τα ανοίγματα.","You have dealt. Bidding starts."],["Μοιράζεις.","You are dealing."],["Διάλεξε επιφάνεια τραπεζιού","Choose the table surface"],["Διάλεξε φόντο","Choose the background"],["Διάλεξε τον avatar σου","Choose your avatar"],["Διάλεξε τα emotes σου","Choose your emotes"],["Emotes άλλων","Other players' emotes"],["Οδηγός παιχνιδιού","Game coach"],["Ήχος","Sound"],["Διάλεξε σχέδιο φύλλων","Choose the card design"],["Εμφάνιση","Appearance"],["Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού, φόντο, σχέδιο φύλλων, τον avatar σου και τα emotes σου.","Appearance: choose the table surface, the background, the card design, your avatar and your emotes."],["Ρυθμίσεις: ανοίγεις ή κλείνεις τα emotes των άλλων, τον Οδηγό παιχνιδιού, τον ήχο και τα animation.","Settings: turn other players' emotes, the Game coach, sound and animations on or off."],["Ρεβάνς: στο τέλος ενός παιχνιδιού με φίλους ή στο «Κοντά μου» πατάς Ρεβάνς και γυρνάς στο ίδιο τραπέζι, στη θέση σου. Όταν μπουν όλοι, ο οικοδεσπότης ξεκινάει. Όποιος δεν πατήσει Ρεβάνς δεν παίζει.","Rematch: at the end of a game with friends or on “Nearby”, tap Rematch to go back to the same table, in your seat. Once everyone is in, the host starts the game. Anyone who doesn't tap Rematch sits out."],["Στην αρχή κόβεται η τράπουλα: το φύλλο που κόπηκε δείχνει ποιος μοιράζει. Σε κάθε γύρο μοιράζει 3, 2 και 3 φύλλα στον καθένα.","At the start the deck is cut: the cut card decides who deals. Each round, the dealer deals 3, then 2, then 3 cards to each player."],["Σε παιχνίδι με άλλους παίκτες, από το Μενού μπορείς να φύγεις από το τραπέζι. Τη θέση σου την παίρνει bot.","In a game with other players, you can leave the table from the Menu. A bot takes your seat."],["Ο «Οδηγός παιχνιδιού» προτείνει κάθε κίνηση και την εξηγεί. Είναι κλειστός από την αρχή και ανοίγει από τις Ρυθμίσεις.","The «Game coach» suggests every move and explains it. It is off from the start and can be switched on in Settings."],["Τα κόζια είναι δικά σας, ο σύντροφος βγάζει κόζι κι εσύ δεν έχεις: ρίχνεις τον Άσο μιας φυλής για να πεις ότι παίρνεις όλες τις μπάζες της. Ο σύντροφος βγάζει όλα τα κόζια και μετά σου παίζει αυτή τη φυλή.","When your team holds the trumps, your partner leads a trump and you have none: discard the Ace of a suit to say you will take all its tricks. Your partner then draws all the trumps and leads that suit to you."],["Δεν έχεις παίξει ακόμα online παιχνίδι με κατάταξη.","You have not played a rated online game yet."],["Οι κατηγορίες ανανεώνονται κάθε ώρα.","The categories are updated every hour."],[" Elo · σου λείπουν "," Elo · points needed: "],["Χωρίς κατηγορία ακόμα","No category yet"],["Κατηγορία: ","Category: "],["Σήματα","Badges"],["Δεν έχει σήματα ακόμα.","No badges yet."],["Το προφίλ μου","My profile"],["Τα σήματα τα κερδίζεις με λογαριασμό: το σήμα της κατηγορίας σου από το πρώτο σου online παιχνίδι με κατάταξη, και αργότερα ειδικά σήματα, π.χ. από τουρνουά.","You earn badges with an account: the badge of your category from your first rated online game, and later special badges, e.g. from tournaments."],["Φαίνεται δίπλα στο avatar σου","Shown next to your avatar"],["Διάλεξε ποιο σήμα φαίνεται δίπλα στο avatar σου. Όταν κάποιος ανοίξει το προφίλ σου, βλέπει όλα τα σήματά σου.","Choose which badge is shown next to your avatar. When someone opens your profile, they see all your badges."],["Δεν έχεις σήματα ακόμα. Το πρώτο το παίρνεις με το πρώτο σου online παιχνίδι με κατάταξη: είναι το σήμα της κατηγορίας σου.","You have no badges yet. You get the first one with your first rated online game: the badge of your category."],["Κατηγορίες: Αρχάριος, Προχωρημένος (Top 50%), Έμπειρος (Top 25%), Μάστρος (Top 10%), Άρχοντας της Πιλόττας (Top 3%), ανάμεσα σε όλους τους ενεργούς παίκτες. Ανανεώνονται κάθε ώρα.","Categories: Beginner, Advanced (Top 50%), Experienced (Top 25%), Master (Top 10%), Lord of Pilotta (Top 3%), among all active players. Updated every hour."],["Η κατάταξη θα ανοίξει σύντομα, όταν μαζευτούν αρκετοί παίκτες. Μέχρι τότε, η κατηγορία σου φαίνεται στο προφίλ σου.","The leaderboard will open soon, once there are enough players. Until then, your category is shown in your profile."],["Οι άλλοι παίκτες βλέπουν στο προφίλ σου το username, το avatar, την κατηγορία και τα σήματά σου. Η κατηγορία βγαίνει από τη θέση του rating σου ανάμεσα σε όλους τους ενεργούς παίκτες.","Other players see your username, avatar, category and badges in your profile. Your category is based on where your rating ranks among all active players."],["Μπορείς να διαγράψεις τον λογαριασμό σου όποτε θέλεις από το προφίλ σου. Τότε σβήνονται το email, το username, το avatar, τα σήματα και τα στατιστικά σου.","You can delete your account any time from your profile. Your email, username, avatar, badges and statistics are then deleted."],["Αν δεν μπεις στον λογαριασμό σου για 60 μέρες, κρύβεται από τις λίστες φίλων και την κατάταξη, μέχρι να ξαναμπείς. Αν δεν μπεις για 180 μέρες, ο λογαριασμός και όλα τα στοιχεία του διαγράφονται αυτόματα.","If you do not sign in for 60 days, your account is hidden from friend lists and the leaderboard until you come back. If you do not sign in for 180 days, the account and all its data are deleted automatically."],["Πάνω δεξιά είναι το avatar σου: ανοίγει το προφίλ σου, όπου αλλάζεις avatar και διαλέγεις ποιο σήμα φαίνεται δίπλα του.","Your avatar is at the top right: it opens your profile, where you change your avatar and choose which badge is shown next to it."],["Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού, φόντο, σχέδιο φύλλων και τα emotes σου.","Appearance: choose the table surface, the background, the card design and your emotes."],["Πάτα το avatar ενός παίκτη για να δεις το προφίλ του (κατηγορία και σήματα) και να του στείλεις αίτημα φιλίας.","Tap a player's avatar to see their profile (category and badges) and send them a friend request."],["Βρέθηκαν παίκτες. Ξεκινάμε… ","Players found. Starting… "],["Οι θέσεις μοιράζονται τυχαία. Όσες θέσεις μείνουν κενές τις παίρνουν bots.","Seats are assigned at random. Bots take any empty seats."],["Ακύρωση","Cancel"],["Ο οικοδεσπότης έφυγε. Το παιχνίδι συνεχίζεται με το ίδιο σκορ και ο γύρος ξαναμοιράζεται.","The host left. The game continues with the same score, and the round is dealt again."],["Ο οικοδεσπότης έφυγε. Συνεχίζουμε…","The host left. Continuing…"],["Το παιχνίδι συνεχίζεται.","The game continues."],["Έλειπες αρκετή ώρα και το παιχνίδι συνεχίστηκε με άλλον οικοδεσπότη.","You were away for a while, and the game continued with another host."],["Προφίλ","Profile"],["Το γρήγορο παιχνίδι και το παιχνίδι με φίλους θέλουν λογαριασμό. Συνδέσου από το «Προφίλ», πάνω δεξιά στο κύριο μενού.","Quick match and playing with friends require an account. Sign in from «Profile», at the top right of the main menu."],["Το γρήγορο παιχνίδι, το παιχνίδι με φίλους και το «Κοντά μου» θέλουν λογαριασμό. Συνδέσου από το «Προφίλ», πάνω δεξιά στο κύριο μενού.","Quick match, playing with friends and Nearby require an account. Sign in from «Profile», at the top right of the main menu."],["Οι γύροι που παίζεις (φύλλα, ανοίγματα, κινήσεις, αποτέλεσμα) αποθηκεύονται ανώνυμα, χωρίς ονόματα ή οτιδήποτε σε αναγνωρίζει, για να γίνονται καλύτερα τα bots. Σβήνονται αυτόματα μετά από περίπου 15 μέρες.","The rounds you play (cards, bids, moves, result) are saved anonymously, without names or anything that identifies you, to improve the bots. They are deleted automatically after about 15 days."],["Έρχεται σύντομα.","Coming soon."],["Διάστημα","Space"],["Βαθύ διάστημα","Deep space"],["Νεφέλωμα","Nebula"],["Γαλαξίας","Galaxy"],["Σελήνη","Moon"],["Άρης","Mars"],["Αστρόσκονη","Stardust"],["Σέλας","Aurora"],["Τροχιά","Orbit"],["Κομήτης","Comet"],["Σεληνόφως","Moonlight"],["Αστέρια","Stars"],["Κρατήρες","Craters"],["Απογείωση!","Lift-off!"],["Σε άλλο πλανήτη","On another planet"],["Εξωγήινο!","Alien!"],["Κάνε μια ευχή","Make a wish"],["Με απήγαγαν","I got abducted"],["Αυτό είναι μέρος του Pilotta Plus. Το Plus έρχεται σύντομα.","This is part of Pilotta Plus. Plus is coming soon."],["Το Pilotta Plus ενεργοποιήθηκε!","Pilotta Plus is now active!"],["Αυτό είναι μέρος του Pilotta Plus, με μία πληρωμή από 2,99 €.","This is part of Pilotta Plus: a one-time payment from €2.99."],["Δες το Plus","See Plus"],["Άλλο ποσό (από 2,99 €)","Other amount (from €2.99)"],["Οι πληρωμές ανοίγουν σύντομα.","Payments are opening soon."],["Συνδέσου πρώτα, για να μπει το Plus στον λογαριασμό σου.","Sign in first, so Plus is added to your account."],["Η πληρωμή γίνεται στη σελίδα της Stripe. Το Plus ενεργοποιείται αυτόματα, το πολύ μέσα σε μία ώρα.","You pay on Stripe's page. Plus is activated automatically within an hour."],["Τι περιλαμβάνει","What is included"],["Όροι χρήσης","Terms of use"],["Επιστροφές","Refunds"],["Υποστήριξέ μας","Support us"],["Pilotta Plus · Υποστήριξέ μας","Pilotta Plus · Support us"],["Με μία πληρωμή ξεκλειδώνεις για πάντα το θέμα «Διάστημα» (επιφάνειες, φόντα, φύλλα, avatars, emotes), παίρνεις το σήμα Pilotta Plus και προτεραιότητα στην αναμονή του Γρήγορου παιχνιδιού. Το παιχνίδι μένει δωρεάν για όλους: το Plus δεν δίνει πλεονέκτημα στο τραπέζι.","With a single payment you unlock the «Space» theme forever (table surfaces, backgrounds, cards, avatars, emotes), and get the Pilotta Plus badge and priority in the Quick match queue. The game stays free for everyone: Plus gives no advantage at the table."],["Έχεις ήδη Plus. Ευχαριστούμε!","You already have Plus. Thank you!"],[" Αν θες, μπορείς να μας στηρίξεις κι άλλο."," If you like, you can support us further."],["Χωρίς διαφημίσεις για πάντα: όταν μπουν διαφημίσεις στο παιχνίδι, εσύ δεν θα τις βλέπεις.","No ads, ever: when ads come to the game, you won't see them."],["Με «Άλλο ποσό» γράφεις όσο θέλεις. Από 2,99 € και πάνω παίρνεις το Plus· μικρότερο ποσό είναι στήριξη για το παιχνίδι, χωρίς Plus.","With «Other amount» you choose how much to pay. From €2.99 up you get Plus; a smaller amount is a donation to the game, without Plus."],["Άλλο ποσό","Other amount"],["Χωρίς διαφημίσεις + Bonus θέμα","No ads + bonus theme"],[". Έχεις Βαλέ και 9 στη φυλή του",". You have the Jack and 9 in his suit"],[". Έχεις Βαλέ στη φυλή του",". You have the Jack in his suit"],[". Έχεις 9 στη φυλή του",". You have the 9 in his suit"],["Κόζια Κούπα.","Trumps: Hearts."],["Κόζια Καρό.","Trumps: Diamonds."],["Κόζια Σπαθί.","Trumps: Clubs."],["Κόζια Πίκα.","Trumps: Spades."],[") από ",") at "],["Αποσυνδέθηκες","You have been signed out"],["Ο λογαριασμός σου συνδέθηκε σε άλλη συσκευή. Ένας λογαριασμός μπορεί να είναι ανοιχτός σε μία μόνο συσκευή τη φορά.","Your account was signed in on another device. An account can only be signed in on one device at a time."],["Για να παίξεις από εδώ, συνδέσου ξανά. Τότε θα αποσυνδεθεί η άλλη συσκευή.","To play from here, sign in again. The other device will then be signed out."],["Φαίνεται δίπλα στο avatar σου. Πάτα ξανά για να το βγάλεις.","Shown next to your avatar. Tap it again to remove it."],["Σε βάζουμε σε τραπέζι με τυχαίους παίκτες. Παίζεται μέχρι τους 201 πόντους.","We put you at a table with random players. The game is played to 201 points."],["Φτιάξε τραπέζι ή γράψε τον κωδικό που σου έδωσε ο φίλος σου.","Create a table or type the code your friend gave you."],["Παίζεις ως ","Playing as "],["ενεργοί παίκτες","players online"],["ενεργός παίκτης","player online"],["Μικρόφωνο","Microphone"],["Κάμερα","Camera"],["Πρόσκληση σε τραπέζι","Game invitation"],[" σε καλεί να παίξετε μαζί."," invites you to play together."],["Όχι τώρα","Not now"],["Κάλεσε φίλους","Invite friends"],["Διάλεξε έως ","Choose up to "],[". Θα καθίσουν όπου θέλουν.",". They will choose their own seats."],["Κανένας φίλος σου δεν είναι online αυτή τη στιγμή.","None of your friends are online right now."],["Στάλθηκε","Sent"],["Στείλε","Send"],["Οι προσκλήσεις στάλθηκαν.","Invitations sent."],["Φίλος","Friend"],["Μήνυμα","Message"],["Δεν υπάρχουν μηνύματα ακόμα. Γράψε το πρώτο!","No messages yet. Send the first one!"],["Τα μηνύματα που στέλνεις σε φίλους στο chat αποθηκεύονται για να τα βλέπετε, και τα βλέπετε μόνο εσείς οι δύο. Σβήνονται αυτόματα μετά από 7 μέρες. Λέξεις που προσβάλλουν αντικαθίστανται με ***. Κρατάμε και πότε διάβασες τελευταία φορά κάθε συνομιλία, για να σου δείχνουμε πόσα νέα μηνύματα έχεις.","Chat messages you send to friends are stored so that you can both read them, and no one else can see them. They are deleted automatically after 7 days. Offensive words are replaced with ***. We also store when you last read each conversation, so we can show you how many new messages you have."],["Ο λογαριασμός σου","Your account"],["Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού, φόντο, σχέδιο φύλλων και τα emotes σου. Τα σχέδια με το λουκέτο (π.χ. Διάστημα) είναι μέρος του Pilotta Plus. Κράτα πατημένο ένα σχέδιο για να το δεις σε μεγάλο μέγεθος.","Appearance: choose the table surface, background, card design and your emotes. Designs with a padlock (e.g. Space) are part of Pilotta Plus. Press and hold a design to see it full size."],["Πώς παίζεται (οδηγός): μια εξήγηση του παιχνιδιού, βήμα βήμα. Ξενάγηση: αυτή εδώ, μια γρήγορη ματιά στα κουμπιά.","How to play (guide): a step-by-step explanation of the game. Quick guide: this tour of the buttons."],["Όταν έχεις συνδεθεί, πάνω αριστερά βλέπεις πόσοι παίκτες παίζουν αυτή τη στιγμή.","When you're signed in, the top left shows how many players are online right now."],["Πάνω δεξιά είναι το avatar σου: ανοίγει το προφίλ σου, όπου αλλάζεις avatar και διαλέγεις ποιο σήμα φαίνεται δίπλα του. Αν πατήσεις το σήμα που ήδη φαίνεται, το βγάζεις.","Your avatar is at the top right: it opens your profile, where you can change your avatar and choose which badge appears next to it. Tap the badge that is already showing to remove it."],["Φίλοι: στέλνεις αίτημα με το username ενός φίλου. Η πράσινη τελεία στο κουμπί δείχνει πόσοι φίλοι σου είναι online. Στη λίστα βλέπεις το avatar και το σήμα κάθε φίλου, και πράσινη τελεία δίπλα στο όνομα όταν είναι online. Κίτρινη τελεία σημαίνει ότι είναι away: δεν έχει πατήσει τίποτα για 15 λεπτά.","Friends: send a friend request using your friend's username. The green dot on the button shows how many of your friends are online. The list shows each friend's avatar and badge, with a green dot next to their name when they are online. A yellow dot means they are away: they haven't tapped anything for 15 minutes."],["Πάτα το 💬 δίπλα σε έναν φίλο για να του στείλεις μήνυμα. Ο κόκκινος αριθμός δείχνει πόσα νέα μηνύματα έχεις, και φαίνεται και στο κουμπί Φίλοι. Τα μηνύματα σβήνονται αυτόματα μετά από 7 μέρες.","Tap 💬 next to a friend to send them a message. The red number shows how many new messages you have, and it also appears on the Friends button. Messages are deleted automatically after 7 days."],["Κατάταξη: οι καλύτεροι παίκτες, όλοι ή μόνο οι φίλοι σου, συνολικά, την εβδομάδα ή τον μήνα.","Leaderboard: the top players, overall or just your friends, for all time, this week or this month."],["Ο λογαριασμός σου μένει συνδεδεμένος σε μία συσκευή. Αν συνδεθείς σε άλλη, αποσυνδέεσαι από την προηγούμενη.","Your account stays signed in on one device at a time. If you sign in on another device, you are signed out of the previous one."],["Κάλεσε φίλους: όταν φτιάχνεις τραπέζι, καλείς έως 3 φίλους που είναι online. Τους έρχεται πρόσκληση, μπαίνουν στο τραπέζι και κάθονται όπου θέλουν.","Invite friends: when you create a table, you can invite up to 3 friends who are online. They get an invitation, join the table and sit wherever they like."],["Σε παιχνίδι με άλλους παίκτες (γρήγορο ή με φίλους) έχεις και το κουμπί 💬 για emotes. Στο παιχνίδι με φίλους έχεις επίσης Μικρόφωνο και Κάμερα (Beta), που ανοίγουν και κλείνουν με διακόπτη.","In a game with other players (quick match or with friends) you also have the 💬 button for emotes. In a game with friends you can also use the Microphone and Camera (Beta), each with its own on/off switch."],["Όσο η εφαρμογή είναι ανοιχτή και έχεις συνδεθεί, οι φίλοι σου βλέπουν ότι είσαι online, ή away αν δεν έχεις πατήσει τίποτα για 15 λεπτά. Όταν καλείς φίλους σε τραπέζι, αποθηκεύεται η πρόσκληση (το username σου και ο κωδικός του τραπεζιού). Ο αριθμός των online παικτών στο μενού είναι μόνο ένας αριθμός, χωρίς ονόματα. Για να είναι ο λογαριασμός σου συνδεδεμένος σε μία συσκευή κάθε φορά, η εφαρμογή κρατά έναν τυχαίο κωδικό συσκευής, χωρίς στοιχεία της συσκευής σου.","While the app is open and you are signed in, your friends can see that you are online, or away if you haven't tapped anything for 15 minutes. When you invite friends to a table, the invitation (your username and the table code) is stored. The online player count in the menu is only a number, with no names. To keep your account signed in on one device at a time, the app stores a random device code that contains no information about your device."],["Ξενάγηση","Quick guide"],["Πρόσθεσε φίλο","Add friend"],["Έχεις στείλει αίτημα φιλίας.","You have sent a friend request."],["Τα κόζια είναι δικά σας και ο σύντροφος ανοίγει μια άλλη φυλή με οτιδήποτε εκτός από το 10: αν έχεις τον Άσο, παίρνεις με τον Άσο και του ξαναπαίζεις την ίδια φυλή.","When your team holds the trumps and your partner leads another suit with anything but the 10: if you hold the Ace, win with it and lead the same suit back to him."],["Αλλαγή username","Change username"],["Σύντομα θα μπορείς να αλλάζεις το username σου. Τα στατιστικά, οι φίλοι και τα σήματά σου θα μείνουν ίδια.","You'll soon be able to change your username. Your stats, friends and badges will stay the same."],["Pilotta Plus: έχεις προτεραιότητα στην αναμονή.","Pilotta Plus: you have priority in the queue."],["Τα φύλλα που έμειναν","Remaining cards"],["Η αγορά μέσω Google Play έρχεται σύντομα.","Buying through Google Play is coming soon."]];
/* longest Greek first, so a short entry (e.g. "Στόχος") never breaks a longer sentence that contains it */
D.sort(function(a,b){ return b[0].length-a[0].length; });
var GR=/[\u0370-\u03ff\u1f00-\u1fff]/;
function tr(s){
  if(!GR.test(s)) return s;
  for(var i=0;i<D.length;i++){ if(s.indexOf(D[i][0])>=0) s=s.split(D[i][0]).join(D[i][1]); if(!GR.test(s)) break; }
  return s;
}
function fix(n){
  if(n.nodeType===3){ var v=n.nodeValue; if(GR.test(v)){ var t=tr(v); if(t!==v) n.nodeValue=t; } return; }
  if(n.nodeType!==1) return;
  if(n.tagName==='SCRIPT'||n.tagName==='STYLE') return;
  ['aria-label','title','placeholder'].forEach(function(a){ var v=n.getAttribute(a); if(v && GR.test(v)){ var t=tr(v); if(t!==v) n.setAttribute(a,t); } });
  for(var c=n.firstChild;c;c=c.nextSibling) fix(c);
}
var busy=false;
function run(){ busy=true; try{ fix(document.body); if(GR.test(document.title)) document.title=tr(document.title); document.documentElement.lang='en'; }finally{ busy=false; } }
var timer=null;
new MutationObserver(function(){ if(busy||timer) return; timer=setTimeout(function(){ timer=null; run(); },0); }).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','placeholder']});
run();
})();
