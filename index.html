/* Layout: one phone-width column. Header and scores, felt table with the three other players, your hand, then a single action panel. */

}

/* network speed of an online game, measured on this device's own clock: how long the database takes to confirm my writes (host: the table state, guest: my moves)
   and how long a bot needs for the end-of-round simulation. One small summary per game is sent when the game ends (no names, no ids). */
var NET={h:[],g:[],bm:[]};
function netW(role,fn){
  var t0=Date.now(), r=fn();
  try{ if(r && r.then) r.then(function(){ var a=NET[role]; if(a.length<600) a.push(Date.now()-t0); },function(){}); }catch(e){}
  return r;
}
function netPct(a,q){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){ return x-y; }); return b[Math.min(b.length-1,Math.floor(b.length*q))]; }
function netLog(){
  try{
    if(!MP.on || MP.nearby || (AUTO && !window.__LOG)) return;
    var a=MP.host ? NET.h : NET.g, bm=NET.bm;
    if(a.length>=5){
      var cn=navigator.connection||{}, hu=MP.ctl.filter(function(c){ return c!=='bot'; }).length;
      /* hands:0 only so that the database rule for log/ (it requires a 'hands' child) accepts this record */
      fbLog({k:'net',v:1,hands:0,ts:Date.now(),role:MP.host?'h':'g',n:a.length,p50:netPct(a,0.5),p95:netPct(a,0.95),mx:Math.max.apply(null,a),
        bn:bm.length,bp95:netPct(bm,0.95),bmx:bm.length?Math.max.apply(null,bm):0,
        ct:cn.effectiveType||'',rtt:cn.rtt||0,dl:cn.downlink||0,app:IS_APP?1:0,mob:/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?1:0,
        hu:hu,qm:MP.auto?1:0,rtc:(RTC.micOn||RTC.camOn)?1:0});
    }
    NET.h=[]; NET.g=[]; NET.bm=[];
  }catch(e){}
}
/* when the app runs outside Claude (own site), rounds go to the Firebase project, write-only, without names. Failures are silent: the game also works offline. */
var LOGT=null, LOGP=null, LOGC=false;
function fbLog(rec){
  try{
    if(MP.nearby) return;
    if(!FIREBASE_CONFIG && !window.__mockTransport) return;
    if(!(MP.on && MP.T)){ if(navigator.onLine===false) return; if(!LOGT) LOGT=mpTransport(); }
    var T=(MP.on && MP.T) ? MP.T : LOGT; if(!T) return;
    var ready=(T===MP.T) ? Promise.resolve() : (LOGP=LOGP||T.init());
    var data=JSON.parse(JSON.stringify(rec));
    var B=Math.floor(Date.now()/21600000); /* 6-hour buckets: a bucket older than 15 days (60 buckets) is deleted */
    ready.then(function(){
      if(!LOGC){ LOGC=true; for(var k=B-61;k>=B-120;k--) T.remove('log/'+k); }
      return T.set('log/'+B+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7),data);
    }).catch(function(){ LOGP=null; });
  }catch(e){}
}

/* ---------- flow ---------- */
function log(p,t,bid,val,s){ G.bidLog.push({p:p,t:t,bid:!!bid,val:val,s:s}); }

async function bidding(){
  var cur=(G.dealer+1)%4, passes=0, high=null;
  G.bidLog=[]; G.suitPick=null; G.trump=null; G.bid=null; G.klistoBy=-1;
  while(true){
    if(high && passes>=3) break;
    if(!high && passes>=4) return null;
    G.active=cur; render();
    var canK = !!high && (cur%2)!==(high.p%2);
    var act;
    if(cur===G.me){ act = await humanBid(high,canK); }
    else if(MP.on && MP.ctl[cur]==='remote'){
      waitPanel(nm(cur)+' σκέφτεται…');
      var ra=await mpRemoteAct(cur,'bid',{high:high?{p:high.p,val:high.val,s:high.s}:null,canK:canK});
      act = ra ? mpCleanBid(ra,high,canK) : botBid(cur,high,canK);
    }
    else { waitPanel(nm(cur)+' σκέφτεται…'); await sleep(850); act = botBid(cur,high,canK); }
    if(act.type==='pass'){ passes++; log(cur,'Πάσο'); sfx('pass'); }
    else if(act.type==='bid'){
      var jmp = high ? act.val-high.val : act.val-70;
      var teamBid=G.bidLog.some(function(x){ return x.bid && (x.p%2)===(cur%2); });
      var nTeam=G.bidLog.filter(function(x){ return x.bid && (x.p%2)===(cur%2); }).length;
      var oppBid=G.bidLog.some(function(x){ return x.bid && (x.p%2)!==(cur%2); });
      var prevH=high;
      high={p:cur,val:act.val,s:act.s}; passes=0;
      /* only a team's first bid can be the call that asks for aces (+30 always, +20 if the partner has a trump); later raises are not */
      log(cur,act.val+' '+SYM[act.s],true,act.val,act.s);
      sfx('bid');
      var ent=G.bidLog[G.bidLog.length-1];
      var isF2=(teamBid && nTeam>=2 && !oppBid && prevH && prevH.p===(cur+2)%4);
      /* the human's +30 / +20 is always the call for aces (also over his partner's bid), unless it is the second ask */
      var askOK=(!teamBid) || (cur===G.me && !isF2);
      ent.tri=(jmp===30 && askOK); ent.dbl=(jmp===20 && askOK);
      /* a second ask after the partner showed his aces, with no opponent bid in between: +10 tens under the aces, +20 two-card tens, +30 the next top cards */
      ent.f2=(teamBid && nTeam>=2 && !oppBid && prevH && prevH.p===(cur+2)%4 && (jmp===10 || jmp===20 || jmp===30)) ? jmp : 0;
    }
    else if(act.type==='klisto'){ G.klistoBy=cur; sfx('klisto'); log(cur,'Κλειστό!'); G.active=-1; render(); toast(nm(cur)+': Κλειστό!',1500); await sleep(900); return {p:high.p,val:high.val,s:high.s,mult:2}; }
    cur=(cur+1)%4;
  }
  return {p:high.p,val:high.val,s:high.s,mult:1};
}

function announceFor(p){
  var d=G.decl[p];
  if(d.total>0) toast(nm(p)+' δηλώνει '+bestMeld(d.melds).pts, 1100);
}
function revealHTML(note){
  var c=G.contest, h='';
  if(note) h+='<div>'+esc(note)+'</div>';
  if(!G.decl.some(function(d){ return d.total>0; })) return h;
  if(c.winner===null) return h+'<b>Ίδιες δηλώσεις</b> και καμία δεν είναι σε κόζια. Δεν μετράει καμία.';
  var t=c.winner, lines=[];
  [t,t+2].forEach(function(p){
    if(p===G.me && G.needShow && !G.shown){ lines.push('Εσύ: δεν έδειξες ακόμα'); return; }
    if(p!==G.me && !G.rev[p]) return;

/* a player may declare less than the full amount, as long as it is the sum of some of his melds (e.g. only the tierce instead of fifty plus tierce) */
function subsetFor(d,amount){
  var ms=d.melds, best=null;
  for(var mask=1; mask<(1<<ms.length); mask++){
    var sub=ms.filter(function(_,i){ return (mask>>i)&1; });
    var sum=sub.reduce(function(a,m){ return a+m.pts; },0);
    if(sum===amount){ var bm=bestMeld(sub); if(!best || cmpMeld(bm,best.bm)>0) best={sub:sub,bm:bm}; }
  }
  return best ? best.sub : null;
}

/* the leader is sure to win every remaining trick, whatever the others play, so the round can end here:
   - his trumps all beat every trump left in the other hands, and nobody else holds more trumps than he does;
     if the others still hold trumps, his whole hand must be trumps (so no order of play can go wrong);
   - with no trumps of his own, nobody else may hold a trump;
   - in every other suit, each of his cards beats every card of that suit left in the other hands.
   This is checked on the real hands, so it never ends a round that could still go differently. */
function canClaim(p){
  var h=G.hands[p], tr=G.trump; if(!h.length) return false;
  var oth=[]; [1,2,3].forEach(function(i){ oth=oth.concat(G.hands[(p+i)%4]); });
  var myT=h.filter(function(c){ return c.s===tr; }), othT=oth.filter(function(c){ return c.s===tr; });
  if(myT.length){
    if(othT.length && Math.min.apply(null,myT.map(tStr)) <= Math.max.apply(null,othT.map(tStr))) return false;
    if([1,2,3].some(function(i){ return G.hands[(p+i)%4].filter(function(c){ return c.s===tr; }).length > myT.length; })) return false;
    if(othT.length && myT.length<h.length) return false;   /* others still hold trumps and he holds other suits too: the order he plays matters (a plain card could be trumped), so it is played out */
  } else if(othT.length) return false;
  return SUITS.every(function(s){
    if(s===tr) return true;
    var mine=h.filter(function(c){ return c.s===s; }), them=oth.filter(function(c){ return c.s===s; });
    if(!mine.length || !them.length) return true;
    return Math.min.apply(null,mine.map(pStr)) > Math.max.apply(null,them.map(pStr));
  });
}
/* the round ends early: everybody's remaining cards are shown for a moment (also on the other phones, through the table state) */

/* the bid can no longer be made: the opponents already hold more points than the bidding team can lose and still reach its target.
   Not before the bidding team has won a trick (otherwise the opponents may still win every trick: «ανάποδο») */
function bidLost(){
  if(!G.bid || !G.contest || !G.pil) return false;
  var b=G.bid.p%2, o=1-b;
  if(!G.tricks[b].length) return false;
  var dt=(G.contest.winner===b) ? G.decl[b].total+G.decl[b+2].total : 0;
  var pil=0; [b,b+2].forEach(function(q){ if(G.pil[q]) pil+=20; });
  var need=G.bid.val-dt-pil;
  /* the bid needs more than the 162 points of the cards (250, or 170+ without declarations): it can only be made by taking ALL the tricks (capot), so it is lost
     only when the opponents have taken a trick. Before, a 250 was cut after the 4th trick even though the opponents had no trick at all */
  if(need>162) return G.tricks[o].length>0;
  var opp=G.tricks[o].reduce(function(a,x){ return a+x.pts; },0);
  return opp > 162-need;
}

function scoreRound(){
  var b=G.bid.p%2, o=1-b, trump=G.trump;
  var raw=[0,0], n=[0,0], zero=[0,0];
  G.wins.forEach(function(x,i){
    var t=x.w%2; n[t]++; raw[t]+=x.pts; zero[t]+=x.pts;
    if(i===7) raw[t]+=10;
  });
  var lastT = G.lastW%2;
  // a single trick that holds no card points still counts for 10 (20 if it is the last trick)
  [0,1].forEach(function(t){
    if(n[t]===1 && zero[t]===0){
      var a = 10 + (lastT===t ? 10 : 0);
      raw[t]=a; raw[1-t]=162-a;
    }
  });
  var capo = !G.early && n[b]===8, anapodo = !G.early && n[b]===0;
  var dw = G.contest.winner;
  var declTot=[0,0]; if(dw!==null) declTot[dw]=G.decl[dw].total+G.decl[dw+2].total;
  var pil=[0,0]; [0,1,2,3].forEach(function(p){ if(G.pil[p]) pil[p%2]+=20; });
  var need = G.bid.val - declTot[b] - pil[b];
  var made = (anapodo || G.early) ? false : ((capo ? 250 : raw[b]) >= need);
  var mult = G.mult, bidT = G.bid.val*mult/10;
  var R=[{cards:0,bid:0,decl:0,pil:0},{cards:0,bid:0,decl:0,pil:0}];
  if(made){
    if(mult===1){
      R[b].cards = capo ? 25 : tens(raw[b]); R[b].bid=bidT; R[b].decl=declTot[b]/10; R[b].pil=pil[b]/10;
      R[o].cards = tens(raw[o]); R[o].decl=declTot[o]/10; R[o].pil=pil[o]/10;
    } else {
      R[b].cards = capo ? 25 : 16; R[b].bid=bidT; R[b].decl=(declTot[b]+declTot[o])/10; R[b].pil=(pil[b]+pil[o])/10;
    }
  } else {
    R[o].cards=16; R[o].bid=bidT; R[o].decl=(declTot[o]+declTot[b])/10; R[o].pil=(pil[b]+pil[o])/10;
  }
  var tot=R.map(function(r){ return r.cards+r.bid+r.decl+r.pil; });
  var dm=[[],[]];
  if(dw!==null) [dw,dw+2].forEach(function(p){ ((G.decl[p]&&G.decl[p].melds)||[]).forEach(function(m){ dm[dw].push(meldName(m)+' '+meldCards(m)); }); });
  return {early:!!G.early,R:R,tot:tot,made:made,capo:capo,anapodo:anapodo,raw:raw,n:n,need:need,declTot:declTot,pil:pil,b:b,o:o,dm:dm};
}

async function playRound(){
  G.round++;

  $('#reveal').hidden=true; $('#reveal').innerHTML='';
  var d=shuffle(newDeck());
  for(var p=0;p<4;p++){ G.hands[p]=d.slice(p*8,p*8+8); }   /* the hands stay in the order they were dealt while the dealing is shown (3, 2, 3); they are sorted when it ends */

  G.active=-1;
  var selfD=(G.dealer===G.me && !MP.on);
  waitPanel(selfD ? 'Μοιράζεις.' : nm(G.dealer)+' μοιράζει.');
  await dealAnim();

  render();
  waitPanel(selfD ? 'Μοίρασες. Ξεκινούν τα ανοίγματα.' : nm(G.dealer)+' μοίρασε. Ξεκινούν τα ανοίγματα.');
  await sleep(AUTO?900:500);
  var con=await bidding();
  if(!con){
    G.active=-1; render();
    toast('Όλοι πάσο. Μοιράζει ο επόμενος.',1500);
    waitPanel('Όλοι είπαν πάσο. Ξαναμοιράζουν.');
    await sleep(1600);
    G.round--; G.dealer=(G.dealer+1)%4; save(); return;
  }
  if(con.mult===2){
    var team=con.p%2, up;
    var dec=[con.p,(con.p+2)%4].filter(function(q){ return q===G.me || (MP.on && MP.ctl[q]==='remote'); })[0];
    if(dec===G.me) up=await humanAnikto(con);
    else if(dec!==undefined){ waitPanel(nm(dec)+' απαντά στο «Κλειστό»…'); var ra2=await mpRemoteAct(dec,'anikto',{con:{p:con.p,val:con.val,s:con.s}},40000); up = ra2 ? !!ra2.yes : botAnikto(con); }
    else { waitPanel(nm(con.p)+' και ο σύντροφός του απαντούν στο «Κλειστό»…'); await sleep(900); up=botAnikto(con); }
    if(up){ con.mult=4; log(con.p,'Ανοιχτό!'); toast('Ανοιχτό ×4!',1500); await sleep(900); }
  }
  G.bid={p:con.p,val:con.val,s:con.s}; G.mult=con.mult; G.trump=con.s;
  G.orig=G.hands.map(function(h){ return h.slice(); });
  G.hands.forEach(function(h){ sortHand(h,G.trump); });
  G.decl=G.orig.map(function(h){ return declEval(h); });
  G.pil=G.orig.map(function(h){ return hasPil(h,G.trump); });
  G.active=-1; render();
  waitPanel('Κόζια '+SNAME[G.trump]+'. Η μπάζα ξεκινά από: '+nm((G.dealer+1)%4)+'.');
  await sleep(1100);
  await playTricks();
  var S=scoreRound();
  render();
  if(S.anapodo){ G.over=S.o; G.scores[S.o]=Math.max(G.scores[S.o],G.target); }
  else { G.scores[0]+=S.tot[0]; G.scores[1]+=S.tot[1]; var w=checkWinner(); if(w!==null) G.over=w; }
  window.__last=S;
  logRound(S);
  if(AUTO){ (window.__hist=window.__hist||[]).push({bid:G.bid.val,mult:G.mult,s:G.bid.s,bp:G.bid.p,made:S.made,capo:S.capo,anapodo:S.anapodo,tot:S.tot,raw:S.raw,n:S.n,R:S.R,dw:G.contest.winner,pil:S.pil,early:!!G.early,need:S.need,nt:G.wins.length}); }
  renderScore();
  if(AUTO){ window.__rounds=(window.__rounds||0)+1; }
  if(MP.on){ await mpRoundEnd(S); }
  else if(!AUTO){
    openSheet(summaryHTML(S),function(sh){ sh.querySelector('#nextR').addEventListener('click',function(){ closeSheet(); answer(true); }); });
    await ask();
  }
  G.dealer=(G.dealer+1)%4;
  if(G.over===null){ if(!MP.on) save(); } else store.del('pil.state');
}

  {h:'Το κεντρικό μενού', l:['Νέο παιχνίδι: ξεκινάς παιχνίδι, μόνος σου με bots, με φίλους ή γρήγορο παιχνίδι online.','Κανόνες: όλοι οι κανόνες και η βαθμολόγηση.','Κατάστημα (πάνω αριστερά): εδώ βρίσκεις το Pilotta Plus και τα θέματα που πωλούνται χωριστά: με το 🎨 τα γενικά (π.χ. Κυπριακό καφενείο) και με το ⚽ τα ποδοσφαιρικά, σε διάφορους συνδυασμούς χρωμάτων. Με Plus έχεις 50% έκπτωση σε κάθε θέμα. Τις επιφάνειες, τα φόντα και τα σχέδια φύλλων τα βλέπεις μόνο εσύ. Τα avatars και τα emotes τα βλέπουν και οι άλλοι παίκτες.','Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού (και αν θα έχει πλαίσιο), φόντο, σχέδιο φύλλων, τα emotes σου και τη Σούπερ τσάκα. Τα σχέδια με το λουκέτο (π.χ. Διάστημα) είναι μέρος του Pilotta Plus. Κράτα πατημένο ένα σχέδιο για να το δεις σε μεγάλο μέγεθος.','Πώς παίζεται (οδηγός): μια εξήγηση του παιχνιδιού, βήμα βήμα. Ξενάγηση: αυτή εδώ, μια γρήγορη ματιά στα κουμπιά.','Ρυθμίσεις: ανοίγεις ή κλείνεις τα emotes των άλλων, τον Οδηγό παιχνιδιού, τον ήχο και τα animation.','Το κουμπί με τη σφαίρα αλλάζει τη γλώσσα, Ελληνικά ή English.','Όταν έχεις συνδεθεί, πάνω αριστερά βλέπεις πόσοι παίκτες παίζουν αυτή τη στιγμή.','Μεγέθυνση/σμίκρυνση: με τα κουμπιά «−» και «+» πάνω δεξιά, κάτω από τα σκορ, μικραίνεις ή μεγαλώνεις όλη την οθόνη του παιχνιδιού (100%, 90%, 80%, 70%), ώστε να χωράνε όλα χωρίς κύλιση. Το θυμάται την επόμενη φορά.']},
  {h:'Ο λογαριασμός σου', l:['Πάνω δεξιά είναι το avatar σου: ανοίγει το προφίλ σου, όπου αλλάζεις avatar και διαλέγεις ποιο σήμα φαίνεται δίπλα του. Αν πατήσεις το σήμα που ήδη φαίνεται, το βγάζεις. Από το προφίλ αλλάζεις και το username σου, μία φορά κάθε 30 μέρες.','Φίλοι: στέλνεις αίτημα με το username ενός φίλου. Η πράσινη τελεία στο κουμπί δείχνει πόσοι φίλοι σου είναι online. Στη λίστα βλέπεις το avatar και το σήμα κάθε φίλου, και πράσινη τελεία δίπλα στο όνομα όταν είναι online. Κίτρινη τελεία σημαίνει ότι είναι away: δεν έχει πατήσει τίποτα για 15 λεπτά.','Πάτα το 💬 δίπλα σε έναν φίλο για να του στείλεις μήνυμα. Ο κόκκινος αριθμός δείχνει πόσα νέα μηνύματα έχεις, και φαίνεται και στο κουμπί Φίλοι. Τα μηνύματα σβήνονται αυτόματα μετά από 7 μέρες.','Κατάταξη: οι καλύτεροι παίκτες, όλοι ή μόνο οι φίλοι σου, συνολικά, την εβδομάδα ή τον μήνα.','Φύλλα: από την Εμφάνιση, στο «Διάλεξε εμφάνιση φύλλων», στην «Όψη φύλλων» διαλέγεις ανάμεσα στα «Απλά φύλλα» και στα «Κλασικά φύλλα». Στα κλασικά το δικό σου χέρι γίνεται μεγαλύτερο και τα φύλλα μπαίνουν λίγο το ένα πάνω στο άλλο, με pips στα 7–10, φιγούρες στα J, Q, K και μικρό σύμβολο κάτω από τον αριθμό στη γωνία.','Ενεργοί παίκτες: πάνω αριστερά στο κεντρικό μενού φαίνεται πόσοι παίκτες είναι online. Πατώντας το ανοίγεις τη λίστα με τα ονόματά τους, και πατώντας ένα όνομα βλέπεις το προφίλ του. Αν δεν θέλεις να φαίνεσαι στη λίστα, κλείσε το «Να φαίνομαι στη λίστα online» από τις Ρυθμίσεις.','Ο λογαριασμός σου μένει συνδεδεμένος σε μία συσκευή. Αν συνδεθείς σε άλλη, αποσυνδέεσαι από την προηγούμενη.','Χωρίς λογαριασμό παίζεις έως 2 παιχνίδια με bots. Στην εφαρμογή Android μπορείς να δεις μια διαφήμιση για ένα ακόμα παιχνίδι. Η εφαρμογή δείχνει και ένα banner στο κεντρικό μενού· με το Pilotta Plus δεν βλέπεις διαφημίσεις. Την επιλογή σου για τις διαφημίσεις την αλλάζεις από τις Ρυθμίσεις.']},
  {h:'Τρόποι παιχνιδιού', l:['Γρήγορο παιχνίδι: μπαίνεις σε ένα τραπέζι με άλλους τυχαίους παίκτες. Όπου λείπουν παίκτες, παίζουν bots. Με Pilotta Plus έχεις προτεραιότητα στην αναμονή.','Με φίλους: φτιάχνεις τραπέζι και δίνεις τον κωδικό, ή μπαίνεις με τον κωδικό ενός φίλου. Διαλέγεις μόνος σου θέση. Αν φύγει ο οικοδεσπότης, το παιχνίδι συνεχίζεται με άλλον παίκτη και τη θέση του παίρνει bot.','Κάλεσε φίλους: όταν φτιάχνεις τραπέζι, καλείς έως 3 φίλους που είναι online. Τους έρχεται πρόσκληση, μπαίνουν στο τραπέζι και κάθονται όπου θέλουν.','Ψάξε παίκτες: αν στο τραπέζι σου λείπουν παίκτες, ο οικοδεσπότης πατάει «Ψάξε παίκτες» και οι κενές θέσεις γεμίζουν με τυχαίους παίκτες που ψάχνουν παιχνίδι. Αν δεν βρεθούν σε 1 λεπτό, σε ρωτάει αν θες να παίξετε με bots. Με τυχαίους παίκτες το παιχνίδι μετράει στο rating, με bots όχι.','Offline (με bots): παίζεις μόνος σου με 3 bots.','Ρεβάνς: στο τέλος ενός παιχνιδιού με φίλους ή στο «Κοντά μου» πατάς Ρεβάνς και γυρνάς στο ίδιο τραπέζι, στη θέση σου. Όταν μπουν όλοι, ο οικοδεσπότης ξεκινάει. Όποιος δεν πατήσει Ρεβάνς δεν παίζει. Ο οικοδεσπότης βλέπει στο τραπέζι ποιος μπήκε, ποιος έφυγε και ποιος δεν έχει μπει ακόμα.']},
  {h:'Μέσα στο παιχνίδι', l:['Στην αρχή κόβεται η τράπουλα: το φύλλο που κόπηκε δείχνει ποιος μοιράζει. Σε κάθε γύρο μοιράζει 3, 2 και 3 φύλλα στον καθένα.','Πάνω βλέπεις τους πόντους: Εμείς, Στόχος και Αυτοί. Το χρώμα κάθε ομάδας φαίνεται και δίπλα στα ονόματα.','Τα φύλλα σου είναι κάτω. Τα φύλλα που μπορείς να παίξεις έχουν περίγραμμα, και πατάς πάνω τους για να τα ρίξεις.','Πάνω δεξιά έχεις πάντα τους Κανόνες και το Μενού. Από το Μενού ανοίγεις και τις Ρυθμίσεις.','Σε παιχνίδι με άλλους παίκτες (γρήγορο ή με φίλους) έχεις και το κουμπί 💬 για emotes. Στο παιχνίδι με φίλους έχεις επίσης Μικρόφωνο και Κάμερα (Beta), που ανοίγουν και κλείνουν με διακόπτη.','Σε παιχνίδι με άλλους παίκτες, από το Μενού μπορείς να φύγεις από το τραπέζι. Τη θέση σου την παίρνει bot.','Αν δεν παίξεις όταν έρθει η σειρά σου, παίρνεις ένα strike κάθε 30 δευτερόλεπτα και οι άλλοι βλέπουν × στο πρώτο και ×× στο δεύτερο δίπλα στο όνομά σου. Στο τρίτο βγαίνεις από το τραπέζι και παίζει bot στη θέση σου. Τα strikes δεν μηδενίζονται αν γυρίσεις, και ισχύουν μόνο για το ίδιο παιχνίδι.','Πάτα το avatar ενός παίκτη για να δεις το προφίλ του (κατηγορία και σήματα) και να του στείλεις αίτημα φιλίας.']}
];
function showGuide(i,done){
  var st=GUIDE[i], last=i===GUIDE.length-1, lines=st.l.slice();
  /* the Android app also has the offline table "Κοντά μου" */
  if(i===2){ var hasNb=false; try{ hasNb=!!nbPlugin(); }catch(e){} if(hasNb) lines.splice(3,0,'Κοντά μου (χωρίς internet): παίζεις με φίλους που είναι στο ίδιο δωμάτιο, χωρίς internet. Ο ένας φτιάχνει το τραπέζι και οι άλλοι το βρίσκουν.'); }
  openSheet('<h3>Ξενάγηση, βήμα '+(i+1)+' από '+GUIDE.length+'</h3><h2>'+esc(st.h)+'</h2><ul>'+lines.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
    +'<div class="row">'+(i>0?'<button class="btn" id="gPrev" type="button">Πίσω</button>':'')+'<button class="btn primary" id="gNext" type="button">'+(last?'Τέλος':'Επόμενο')+'</button></div>'
    +(last?'':'<button class="btn" id="gSkip" type="button">Παράλειψη</button>'),function(sh){
    var pv=sh.querySelector('#gPrev'); if(pv) pv.addEventListener('click',function(){ showGuide(i-1,done); });
    sh.querySelector('#gNext').addEventListener('click',function(){ if(last) done(); else showGuide(i+1,done); });
    var sk=sh.querySelector('#gSkip'); if(sk) sk.addEventListener('click',done);
  });
}
function showWelcome(done){
  store.set('pil.seen','1');
  openSheet('<h2>Καλώς ήρθες στην Πιλόττα Παντού!</h2><p>Παίζεις με τον Σύντροφό σου εναντίον δύο αντιπάλων. Θες μια γρήγορη ξενάγηση στα κουμπιά του παιχνιδιού;</p>'
    +'<div class="stack"><button class="btn primary big" id="wTour" type="button">Ναι, δείξε μου τα κουμπιά</button>'
    +'<button class="btn big" id="wTut" type="button">Πώς παίζεται (οδηγός)</button>'
    +'<button class="btn big" id="wSkip" type="button">Όχι, ξέρω να παίζω</button></div>',function(sh){
    sh.querySelector('#wTour').addEventListener('click',function(){ showGuide(0,done); });
    sh.querySelector('#wTut').addEventListener('click',function(){ showTutorial(0,done); });
    sh.querySelector('#wSkip').addEventListener('click',done);
  });
}

function rulesHTML(label){
  return '<h2>Κανόνες</h2>'
  +'<h3>Βασικά</h3><ul><li>4 παίκτες σε 2 ομάδες: εσύ και ο Σύντροφος απέναντι στο Bot 1 και στο Bot 2. 32 φύλλα, από το 7 ως τον Άσο. Η φορά είναι αντίθετη από των δεικτών του ρολογιού.</li>'
  +'<li>Κόζια: Βαλές, 9, Άσος, 10, Ρήγας, Ντάμα, 8, 7. Στις άλλες φυλές: Άσος, 10, Ρήγας, Ντάμα, Βαλές, 9, 8, 7.</li>'
  +'<li>Οι φυλές: Κούπα ♥, Καρό ♦, Σπαθί ♣, Πίκα ♠. Τα φύλλα σου εμφανίζονται ανά φυλή, κόκκινη και μαύρη εναλλάξ, από το μικρό στο μεγάλο.</li></ul>'
  +'<h3>Ανοίγματα</h3><ul><li>Ξεκινούν από 80, πολλαπλάσια του 10, και κάθε άνοιγμα ανεβάζει. Η 250 σημαίνει όλες τις μπάζες, και με τις δηλώσεις μπορείς να πας πιο ψηλά. Το μέγιστο άνοιγμα είναι 800.</li>'
  +'<li>Κάθε άνοιγμα έχει και φυλή, και η φυλή του τελευταίου ανοίγματος γίνεται κόζια.</li>'
  +'<li>Τελειώνουν όταν μετά από ένα άνοιγμα ακολουθούν 3 πάσο στη σειρά. Ένα νέο άνοιγμα μηδενίζει το μέτρημα.</li>'
  +'<li>Οποιοσδήποτε αντίπαλος του ψηλότερου ανοίγματος μπορεί να πει «Κλειστό» όποτε έρθει η σειρά του, μέχρι να κλείσουν τα ανοίγματα. Το άνοιγμα μετράει ×2 και τα ανοίγματα κλείνουν. Μετά, μόνο η ομάδα του ανοίγματος μπορεί να πει «Ανοιχτό» (×4).</li></ul>'
  +'<h3>Μπάζες</h3><ul><li>Πρέπει να ρίξεις φύλλο της φυλής που άνοιξε. Αν δεν έχεις και έχεις κόζια, πρέπει να τσακκίσεις (να κόψεις), ακόμα κι αν κερδίζει ο σύντροφός σου.</li>'
  +'<li>Όταν παίζονται κόζια, ο επόμενος πρέπει να ρίξει πιο δυνατό κόζια αν έχει. Αν δεν έχει, ρίχνει όποιο κόζια θέλει.</li>'
  +'<li>Χωρίς φυλή και χωρίς κόζια, ρίχνεις ό,τι θες. Την επόμενη μπάζα ανοίγει όποιος κέρδισε την προηγούμενη.</li>'
  +'<li>Με το κουμπί «Προηγούμενη μπάζα» βλέπεις τα φύλλα της τελευταίας μπάζας.</li></ul>'
  +'<h3>Πόντοι φύλλων</h3><ul><li>Κόζια: Βαλές 20, 9 14, Άσος 11, 10 10, Ρήγας 4, Ντάμα 3. Άλλες φυλές: Άσος 11, 10 10, Ρήγας 4, Ντάμα 3, Βαλές 2.</li>'
  +'<li>Ο γύρος έχει 162 πόντους: 152 από τα φύλλα και 10 για την τελευταία μπάζα.</li>'
  +'<li>Μια μπάζα χωρίς πόντους μετράει 10 (20 αν είναι η τελευταία).</li></ul>'
  +'<h3>Δηλώσεις</h3><ul><li>Τρία φύλλα στη σειρά: 20. Τέσσερα: 50. Πέντε ή περισσότερα: 100. Τέσσερα ίδια: 100, με 9 150, με βαλέδες 200 (7 και 8 δεν μετράνε).</li>'
  +'<li>Ένα φύλλο μετράει σε μία μόνο δήλωση. Μεγάλη σειρά σπάει σε δύο (π.χ. 7-8-9 και 10 έως Άσος).</li>'
  +'<li>Μετράει μόνο η ομάδα με τη μεγαλύτερη δήλωση, και παίρνει και του συντρόφου. Στα ίσα ισχύει η σειρά που τελειώνει σε ψηλότερο φύλλο. Στα απολύτως ίσα, κερδίζει όποια είναι σε κόζια, αλλιώς δεν μετράει καμία.</li>'
  +'<li>Στην 1η μπάζα, αν θες, δηλώνεις μόνος σου πριν ρίξεις φύλλο. Δεν είναι υποχρεωτικό: αν ρίξεις φύλλο, δεν δηλώνεις τίποτα. Συνήθως λες την ψηλότερη δήλωσή σου, αλλά μπορείς να πεις και λιγότερο, και μετράει μόνο όσο δηλώσεις: με πενήντα που δηλώνεις 20 δείχνεις την ψηλότερη τρίτη και μετράνε 20, με δύο τρίτες λες 20 και μετράνε 40, με πενήντα και τρίτη λες 50 και μετράνε 70. Αν η δήλωση της ομάδας σου κερδίσει, τις δείχνεις όλες και μετράνε όλες. Αν δηλώσεις περισσότερο από όσο έχεις, δεν μετράει. Την τετράδα τη δηλώνεις μόνο με την αξία της.</li>'
  +'<li>Στη 2η μπάζα, αν η ομάδα σου έχει τη μεγαλύτερη δήλωση, πατάς «Δείξε τη δήλωσή σου» πριν ρίξεις φύλλο. Αν δεν το κάνεις, χάνεται και η μέτρηση ξαναγίνεται στην 3η μπάζα, όπου μπορεί να δείξει ο αντίπαλος.</li>'
  +'<li>Πιλόττα: Ρήγας και Ντάμα στα κόζια, 20. Μετράει πάντα και δεν δηλώνεται στην 1η μπάζα. Την ανακοινώνεις όταν ρίξεις το πρώτο (πιλόττα) και το δεύτερο (ρεπιλόττα).</li></ul>'
  +'<h3>Βαθμολογία</h3><ul><li>Το σκορ μετριέται σε δεκάδες. Στους πόντους του γύρου, αν το τελευταίο ψηφίο είναι 7 ή πάνω, στρογγυλοποιείς προς τα πάνω (17 γίνεται 2), αλλιώς προς τα κάτω (16 γίνεται 1).</li>'
  +'<li>Το άνοιγμα πετυχαίνει όταν η ομάδα κάνει τουλάχιστον όσους πόντους έταξε. Η δήλωση και η πιλόττα της μετρούν ήδη σε αυτό (π.χ. άνοιγμα 80 με τρίτη: πρέπει να κάνει 60).</li>'
  +'<li>Πετυχημέντο άνοιγμα: η ομάδα παίρνει πόντους φύλλων, άνοιγμα και δηλώσεις. Οι αντίπαλοι παίρνουν τους δικούς τους πόντους.</li>'
  +'<li>Αποτυχημένο: οι αντίπαλοι παίρνουν το άνοιγμα, 16 για τον γύρο, τις δηλώσεις τους και την πιλόττα. Η ομάδα του ανοίγματος παίρνει 0.</li>'
  +'<li>Αν οι αντίπαλοι πάρουν τόσους πόντους που το άνοιγμα δεν μπορεί πια να επιτευχθεί, ο γύρος τελειώνει αμέσως (αρκεί η ομάδα του ανοίγματος να έχει πάρει τουλάχιστον μία μπάζα).</li>'
  +'<li>Με «Κλειστό» ή «Ανοιχτό» παίρνει πόντους μόνο η ομάδα που κερδίζει τον γύρο.</li>'
  +'<li>Η ομάδα του ανοίγματος που παίρνει όλες τις μπάζες παίρνει 25 αντί για 16. Αν οι αντίπαλοι πάρουν όλες τις μπάζες («ανάποδο»), κερδίζουν αμέσως το παιχνίδι.</li>'
  +'<li>Κερδίζει όποιος φτάσει πρώτος στον στόχο (101 έως 601, ανά 50). Αν φτάσουν και οι δύο, κερδίζει το μεγαλύτερο σκορ. Σε ισοπαλία παίζεται κι άλλος γύρος.</li></ul>'
  +'<h3>Συμβάσεις ανοιγμάτων με τον σύντροφο</h3><ul><li>Όταν ο σύντροφος προσφέρει, του προσθέτεις 10 για κάθε πόντο: Βαλές της φυλής του 1, εννιάρι της φυλής του με ακόμα ένα κόζι 1, Βαλές και εννιάρι μαζί 3, και κάθε Άσος εκτός κοζιών 1 ακόμα.</li>'
  +'<li>80: Βαλές ή εννιάρι και τουλάχιστον έναν Άσο εκτός κοζιών. Ο σύντροφος να πει αν έχει το άλλο και ποιους Άσους.</li>'
  +'<li>90: και Βαλές και εννιάρι. Ο σύντροφος προσθέτει 10 για κάθε Άσο εκτός κοζιών, αν έχει τουλάχιστον ένα κόζι.</li>'
  +'<li>Πόσο ανεβαίνεις: 80 ή +10 πάνω από το προηγούμενο άνοιγμα = Βαλές ή 9 με Άσο. 90 ή +20 = Βαλές και 9. 100 ή +30 = ο σύντροφος να πει τους Άσους του εκτός κοζιών, και προσθέτει 10 για κάθε τέτοιο Άσο.</li>'
  +'<li>100: ο σύντροφος να πει ποιους Άσους έχει, ανεξάρτητα από τα κόζια του. Έτσι ανοίγεις και όταν ο αντίπαλος έχει ήδη προσφέρει 80 σε άλλη φυλή, αντί για 90.</li>'
  +'<li>130 (10 έως Ρήγας ή Βαλές έως Άσος) και 140 (άλλο πενήντα): έχω πενήντα. Ψάχνω εννιάρι και Άσους.</li>'
  +'<li>180 και 190: έχω πέντε ή περισσότερα στη σειρά (100) με Βαλέ. 180 = μόνο Βαλές (80+100), 190 = Βαλές και εννιάρι (90+100).</li>'
  +'<li>150: τέσσερα εννιάρια, ζητώ Βαλέ ή να με γυρίσει εκεί που τον έχει. 160: τέσσερις Άσοι, να με γυρίσει όπου είναι πιο δυνατός στα κόζια. 220: τέσσερις Βαλέδες, ζητώ εννιάρι ή να με γυρίσει όπου το έχει (τουλάχιστον στο Σπαθί).</li>'

/* the categories of the pickers come in three groups, like the Store: the standard items, 🎨 general themes and ⚽ football themes.

function catGrp(c){ return c==='std' ? 'std' : (PAID_CATS[c] && PAID_CATS[c].fb ? 'fb' : 'gen'); }
function catBar(kind,ids){
  var cs=[]; ids.forEach(function(id){ var c=catOf(kind,id); if(CATS[c] && cs.indexOf(c)<0) cs.push(c); });
  if(cs.length<2) return '';

  var one=function(c){ return '<button class="btn cat" data-cat="'+c+'" type="button" role="tab" aria-label="'+esc(CATS[c].n)+'" title="'+esc(CATS[c].n)+'">'+CATS[c].i+'</button>'; };

    +(g.fb.length?'<button class="btn cat" data-grp="fb" type="button" role="tab" aria-label="Ποδόσφαιρο" title="Ποδόσφαιρο">'+em('⚽')+'</button>':'');

/* shows the items of one category; cur = category to open on; onCat(c) is told when the player switches */
function catBind(sh,cur,onCat){
  var bar=sh.querySelector('.catbar[data-top]'); if(!bar) return;
  var cats=[].map.call(sh.querySelectorAll('[data-c]'),function(b){ return b.dataset.c; }).filter(function(c,i,a){ return a.indexOf(c)===i; });
  var last={};
  function show(c){
    var gc=catGrp(c); last[gc]=c;
    sh.querySelectorAll('[data-c]').forEach(function(b){ b.hidden=(b.dataset.c!==c); });
    sh.querySelectorAll('.catbar [data-cat]').forEach(function(t){ var on=(t.dataset.cat===c); t.classList.toggle('primary',on); t.setAttribute('aria-selected',on?'true':'false'); });
    sh.querySelectorAll('.catbar [data-grp]').forEach(function(t){ var on=(t.dataset.grp===gc); t.classList.toggle('primary',on); t.setAttribute('aria-selected',on?'true':'false'); });
    sh.querySelectorAll('.catbar[data-sub]').forEach(function(r){ r.hidden=(r.dataset.sub!==gc); });
  }
  sh.querySelectorAll('.catbar [data-cat]').forEach(function(t){ t.addEventListener('click',function(){ show(t.dataset.cat); if(onCat) onCat(t.dataset.cat); }); });
  sh.querySelectorAll('.catbar [data-grp]').forEach(function(t){ t.addEventListener('click',function(){ var g=t.dataset.grp, c=last[g] || cats.filter(function(x){ return catGrp(x)===g; })[0]; if(c){ show(c); if(onCat) onCat(c); } }); });

function lpPreview(sh,sel,render){
  var tm=null, x0=0, y0=0, shown=false;
  function hide(){ clearTimeout(tm); tm=null; var v=document.getElementById('lpv'); if(v) v.remove(); }
  sh.querySelectorAll(sel).forEach(function(bt){
    bt.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    bt.addEventListener('pointerdown',function(e){ hide(); shown=false; x0=e.clientX; y0=e.clientY;
      tm=setTimeout(function(){ tm=null; shown=true; var v=document.createElement('div'); v.id='lpv'; v.innerHTML=render(bt)+'<div class="pvn">'+esc((bt.dataset.nm||bt.textContent||'').trim())+'</div>'; document.body.appendChild(v); },450); });

/* change username: free, once every 30 days. The new name is claimed first (usernames/NEW), then the profile is rewritten with the new name and the time of the change, then the old name is released. Stats, friends and badges stay (they belong to the uid). */
var UN_WAIT=30*24*3600*1000;
async function acctChangeName(nu){
  var T=acctT(), me=ACCT.user; if(!me) throw new Error('x');
  if(!acctNameOk(nu)) throw new Error('username-bad');
  if(nu===me.username) throw new Error('username-same');
  if(acctProfane(nu)) throw new Error('username-profane');
  var pr=(await T.get('users/'+me.uid+'/profile'))||{};
  if(pr.unts && Date.now()-pr.unts<UN_WAIT) throw new Error('username-wait');
  var ok=acctKey(nu), ol=acctKey(me.username), same=(ok===ol);
  if(!same){ var got=await T.claim('usernames/'+ok,me.uid); if(!got) throw new Error('username-taken'); }
  var np={}; Object.keys(pr).forEach(function(k){ np[k]=pr[k]; }); np.username=nu; np.unts=Date.now();
  try{ await T.set('users/'+me.uid+'/profile',np); }
  catch(e){ if(!same){ try{ await T.remove('usernames/'+ok); }catch(x){} } throw e; }
  if(!same){ try{ await T.remove('usernames/'+ol); }catch(e){} }
  try{ var lb=await T.get('lb/'+me.uid); if(lb) await T.set('lb/'+me.uid,Object.assign({},lb,{u:nu})); }catch(e){}
  acctSave({uid:me.uid,email:me.email,username:nu,provider:me.provider});
  try{ store.set('pil.name',nu); }catch(e){}
  try{ if(ONLINE.wset) ONLINE.wset(); }catch(e){}
  return np.unts;
}

/* ===== friends, rating (Elo) and leaderboard. All of it stays hidden while LOGIN_ON is false.
   Data (Firebase): stats/UID (own numbers, readable by friends only), friends/UID/FRIEND, friendReq/TO/FROM,
   lb/UID, lbw/WEEK/UID, lbm/MONTH/UID (public list, only for players who chose to appear). ===== */
/* categories by the player's place among all active players with an account (at least 1 rated game, not hibernating):
   bottom 50% / top 50% / top 25% / top 10% / top 3%. The server works out the Elo limits every hour (tiers/cut, c = [top50, top25, top10, top3]);
   each player's own category changes right after his game, against the current limits */
var TIERS=[['Αρχάριος'],['Προχωρημένος'],['Έμπειρος'],['Μάστρος'],['Άρχοντας της Πιλόττας']];
var TIER_PCT=['','Top 50%','Top 25%','Top 10%','Top 3%'];
var TCUT=null; try{ TCUT=JSON.parse(localStorage.getItem('pil.tcut')||'null'); }catch(e){}
function th(t){ if(t<=0) return 0; return (TCUT && TCUT.c && typeof TCUT.c[t-1]==='number') ? TCUT.c[t-1] : Infinity; }
async function tcLoad(){ try{ var T=acctT(); await T.init(); var v=await T.get('tiers/cut'); if(v && v.c){ TCUT=v; store.set('pil.tcut',JSON.stringify(v)); } }catch(e){} }
/* the leaderboard opens when there are enough players; until then its button says «coming soon» */
var LB_OPEN=false;
var TIER_MARGIN=50, ELO0=1000, ST_DAY_MAX=12, ST_PAIR_MAX=4;
function stBlank(){ return {loaded:false,elo:ELO0,g:0,w:0,tr:0,pub:true,wk:null,mo:null,lastTxt:''}; }
var ST=stBlank();
function stReset(){ ST=stBlank(); }
function nowD(){ return new Date(typeof window.__NOW==='number' ? window.__NOW : Date.now()); }
function wkKey(){ var d=nowD(), t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); var n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); var y=t.getUTCFullYear(), w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7); return y+'-W'+(w<10?'0':'')+w; }
function moKey(){ var d=nowD(), m=d.getUTCMonth()+1; return d.getUTCFullYear()+'-'+(m<10?'0':'')+m; }
/* a player keeps his category until he falls TIER_MARGIN points under its limit */
function tierOf(elo,held){ var t=held||0; if(!TCUT || !TCUT.c) return t; while(t+1<TIERS.length && elo>=th(t+1)) t++; while(t>0 && elo<th(t)-TIER_MARGIN) t--; return t; }
function myRating(){ return (LOGIN_ON && loggedIn()) ? ST.elo : 0; }
/* category shown as a badge: mine when I am signed in, the others' from the rating they brought to the table (0 = no account, no badge) */
function myBCache(){ var c=null; try{ c=JSON.parse(localStorage.getItem('pil.myb')||'null'); }catch(e){} return (c && ACCT.user && c.u===ACCT.user.uid) ? c : null; }
/* my category: none before the first rated game. Offline (Nearby) it is the last one saved on the phone */
function myTier(){
  if(!(LOGIN_ON && loggedIn())) return -1;
  if(ST.loaded) return ST.g>0 ? tierOf(ST.elo,ST.tr) : -1;
  var c=myBCache(); return c && typeof c.t==='number' ? c.t : -1;
}
/* the badge shown next to my avatar: the one I chose, or the badge of my category */
function myBadgeDesc(){
  if(!(LOGIN_ON && loggedIn())) return null;
  var c=myBCache(), t=myTier(), b=ACCT.bd || (c && c.b) || 'tier';
  if(b==='none'){ try{ localStorage.setItem('pil.myb',JSON.stringify({u:ACCT.user.uid,b:b,t:t})); }catch(e){} return null; }
  if(b==='plus' ? !hasPlus() : (b!=='tier' && (!BADGES[b] || (ACCT.badges && !ACCT.badges[b])))) b='tier';
  try{ localStorage.setItem('pil.myb',JSON.stringify({u:ACCT.user.uid,b:b,t:t})); }catch(e){}
  return (b==='tier' && t<0) ? null : (b==='tier' ? {b:'tier',t:t} : {b:b});

/* limits against rating farming: at most ST_DAY_MAX counted games a day, and ST_PAIR_MAX against the same two opponents */
function stLimit(opp){
  var day=nowD().toISOString().slice(0,10), L=null;
  try{ L=JSON.parse(localStorage.getItem('pil.stl')||'null'); }catch(e){}
  if(!L || L.d!==day) L={d:day,n:0,p:{}};
  var key=(opp||[]).slice().sort().join('+');

/* end of a game: only a table of 4 real logged-in players counts (friends or quick match), nobody replaced by a bot, no Nearby */
function stRecord(){
  if(MP.on && G.over!==null) mpPendClear();
  if(!LOGIN_ON || !loggedIn() || !MP.on || MP.nearby || G.over===null || MP.statDone) return;
  MP.statDone=true; ST.lastTxt='';
  var okG=MP.host ? (MP.stOK && !MP.stBad) : !!MP.el;
  if(!okG || !ST.loaded || !MP.rt || MP.rt.length!==4 || G.round<2) return;
  var me=G.me, t=me%2, won=(G.over===t), ui=(MP.host ? MP.uids : MP.ui) || [];
  var rt=MP.rt.map(function(x,i){ return i===me ? ST.elo : (x>0 ? x : ELO0); });
  var ra=(rt[t]+rt[t+2])/2, rb=(rt[1-t]+rt[3-t])/2;
  var E=1/(1+Math.pow(10,(rb-ra)/400)), K=ST.g<10 ? 80 : 50, d=Math.round(K*((won?1:0)-E));
  if(!stLimit([ui[1-t],ui[3-t]])){ ST.lastTxt='Το παιχνίδι δεν μετρά στην κατάταξη (όριο παιχνιδιών της ημέρας).'; return; }
  var tr0=ST.tr;
  ST.elo=Math.max(100,ST.elo+d); ST.g++; if(won) ST.w++;
  ST.tr=tierOf(ST.elo,ST.tr);
  ST.wk=stPer(ST.wk,wkKey(),d,won); ST.mo=stPer(ST.mo,moKey(),d,won);
  ST.lastTxt=(d>=0?'+':'')+d+' Elo · '+TIERS[ST.tr][0]+(ST.g>1 && ST.tr>tr0 ? ' (ανέβηκες κατηγορία!)' : ST.tr<tr0 ? ' (έπεσες κατηγορία)' : '');
  stWrite().catch(function(){});
}

/* ---- leaderboard: general list by default, friends list with the switch; all time, this week, this month ---- */
async function lbFetch(sc,per){
  var T=acctT(), me=ACCT.user.uid; await T.init();
  var pk=per==='week' ? wkKey() : moKey(), rows=[], myRank=0;
  if(sc==='g'){
    var path=per==='all' ? 'lb' : (per==='week' ? 'lbw/' : 'lbm/')+pk, ch=per==='all' ? 'elo' : 'd';
    var mk=function(r,rk){ return {uid:r.k,u:r.u||'Παίκτης',elo:r.elo,tr:r.tr,d:r.d,g:0,w:0,pub:1,rk:rk}; };
    var top=await T.qry(path,ch,{n:50});
    rows=top.map(function(r,i){ return mk(r,i+1); });
    var mi=top.findIndex(function(r){ return r.k===me; });
    if(mi>=0) myRank=mi+1;
    else {
      /* not in the first 50: show them, then a gap, then 15 above and 15 below the player */
      var mv=per==='all' ? ST.elo : (per==='week' ? ST.wk : ST.mo);
      if(per!=='all') mv=(mv && mv.k===pk) ? mv.d : null;
      if(mv!=null && ST.g>0){
        var A=await T.qry(path,ch,{s:mv}), ix=A.findIndex(function(r){ return r.k===me; });
        if(ix>=50){
          myRank=ix+1;
          var seen={}; A.forEach(function(r){ seen[r.k]=1; });
          var after=A.slice(ix+1,ix+16);
          if(after.length<15){ var B=await T.qry(path,ch,{e:mv,n:60}); B=B.filter(function(r){ return !seen[r.k]; }); after=after.concat(B.slice(0,15-after.length)); }
          var from=Math.max(50,ix-15);
          if(from>50) rows.push({gap:1});
          A.slice(from,ix+1).forEach(function(r,n){ rows.push(mk(r,from+n+1)); });
          after.forEach(function(r,n){ rows.push(mk(r,ix+2+n)); });
        }
      }
    }
  } else {
    var fr=(await T.get('friends/'+me))||{}, ids=Object.keys(fr).concat([me]);
    for(var i=0;i<ids.length;i++){
      var uid=ids[i], s=null;
      if(uid!==me && await frGone(T,uid)){ frRemove(uid).catch(function(){}); continue; }
      if(uid!==me && await T.get('users/'+uid+'/hib').catch(function(){ return null; })) continue;
      if(uid===me) s=stPayload(); else { try{ s=await T.get('stats/'+uid); }catch(e){} }
      var nm=uid===me ? ACCT.user.username : await frName(T,uid), c=s;
      if(per!=='all'){ var pr=s && (per==='week' ? s.wk : s.mo); c=(pr && pr.k===pk) ? pr : {d:0,g:0,w:0}; }
      rows.push({uid:uid,u:nm,elo:s?s.elo:ELO0,tr:s?s.tr:0,d:c?c.d:0,g:(per==='all'?(s?s.g:0):c.g)||0,w:(per==='all'?(s?s.w:0):c.w)||0});
    }
    rows.sort(function(a,b){ return per==='all' ? (b.elo-a.elo || b.g-a.g) : (b.d-a.d || b.g-a.g); });
    rows.forEach(function(r,n){ r.rk=n+1; if(r.uid===me) myRank=n+1; });
  }
  return {rows:rows,myRank:myRank};
}
function lbRowHtml(i,r,per,me){

  var pc=new RTCPeerConnection({iceServers:RTC.ice}); RTC.pcs[q]=pc;
  RTC.t0[q]=Date.now(); pc.onconnectionstatechange=function(){ if(pc.connectionState==='connected') RTC.ok[q]=1; rtcShow(); };
  if(offerer){ pc.rtcTx={a:pc.addTransceiver('audio',{direction:'sendrecv'}), v:pc.addTransceiver('video',{direction:'sendrecv'})}; }
  var ms=new MediaStream(); RTC.ms[q]=ms; RTC.vids[q].srcObject=ms;
  pc.ontrack=function(e){ ms.addTrack(e.track); var p=RTC.vids[q].play(); if(p&&p.catch) p.catch(function(){}); };
  var dbg=(RTC.dbg=RTC.dbg||{})[q]={host:0,srflx:0,relay:0,err:''};
  pc.onicecandidate=function(e){ if(e.candidate){ var cm=/ typ (host|srflx|relay)/.exec(e.candidate.candidate||''); if(cm) dbg[cm[1]]++; MP.T.set(base+'i'+me+'/'+(pcN++),JSON.stringify(e.candidate)); } };
  pc.onicecandidateerror=function(e){ dbg.err=String(e.errorCode||'')+(e.url?'@'+String(e.url).replace(/^[a-z]+:/,'').split(':')[0].split('.')[0]:''); };
  /* connection lost or never made (for example the phone switched from Wi-Fi to mobile data): restart the ICE negotiation.
     The side with the lower seat makes the new offer (paths ro / ra); the other side asks for it by writing rq. */
  var rn=0, lastRo=0, lastTry=0, tries=0, rn_rq=0;
  function restart(){
    if(!offerer || pc.signalingState!=='stable' || !remoteSet) return;
    var n=++rn; try{ pc.restartIce(); }catch(e){}
    pc.createOffer({iceRestart:true}).then(function(o){ return pc.setLocalDescription(o); }).then(function(){ return MP.T.set(base+'ro',{n:n,sdp:pc.localDescription.sdp,type:'offer'}); }).catch(rtcErr(q,'restart'));
  }
  function wantRestart(){
    if(Date.now()-lastTry<5000) return; lastTry=Date.now(); tries++;
    if(offerer) restart(); else MP.T.set(base+'rq',Date.now());
  }
  pc.addEventListener('iceconnectionstatechange',function(){
    var st=pc.iceConnectionState;
    if(st==='failed') wantRestart();
    else if(st==='disconnected') setTimeout(function(){ if(RTC.pcs[q]===pc && pc.iceConnectionState==='disconnected') wantRestart(); },3000);
  });
  var netCh=function(){ setTimeout(function(){ if(RTC.pcs[q]===pc){ tries=0; lastTry=0; wantRestart(); } },1500); };
  window.addEventListener('online',netCh);
  var nc=navigator.connection; if(nc && nc.addEventListener) nc.addEventListener('change',netCh);
  var retryIv=setInterval(function(){ if(RTC.pcs[q]!==pc){ clearInterval(retryIv); return; } if(pc.connectionState!=='connected' && Date.now()-RTC.t0[q]>12000 && tries<8) wantRestart(); },8000);
  RTC.unsubs.push(function(){ clearInterval(retryIv); window.removeEventListener('online',netCh); if(nc && nc.removeEventListener) nc.removeEventListener('change',netCh); });
  if(offerer) RTC.unsubs.push(MP.T.on(base+'ra',function(v){ if(v && v.n===rn && pc.signalingState==='have-local-offer') pc.setRemoteDescription({type:'answer',sdp:v.sdp}).catch(rtcErr(q,'restart answer in')); }));
  else {
    RTC.unsubs.push(MP.T.on(base+'ro',function(v){
      if(!v || v.n<=lastRo || !remoteSet || pc.signalingState!=='stable') return; lastRo=v.n;
      pc.setRemoteDescription({type:'offer',sdp:v.sdp}).then(function(){ return pc.createAnswer(); }).then(function(a){ return pc.setLocalDescription(a); }).then(function(){ return MP.T.set(base+'ra',{n:v.n,sdp:pc.localDescription.sdp,type:'answer'}); }).catch(rtcErr(q,'restart answer out'));
    }));
  }
  if(offerer) RTC.unsubs.push(MP.T.on(base+'rq',function(v){ if(v && v>RTC.t0[q]-60000 && v!==rn_rq){ rn_rq=v; restart(); } }));
  function flush(){ remoteSet=true; pending.splice(0).forEach(function(c){ pc.addIceCandidate(c).catch(rtcErr(q,'candidate')); }); }
  RTC.unsubs.push(MP.T.on(base+'i'+q,function(v){
    if(!v) return;
    Object.keys(v).forEach(function(k){ if(applied[k]) return; applied[k]=1; var c=JSON.parse(v[k]); if(remoteSet) pc.addIceCandidate(c).catch(rtcErr(q,'candidate')); else pending.push(c); });
  }));
  if(offerer){
    pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).then(function(){ return MP.T.set(base+'o',{sdp:pc.localDescription.sdp,type:'offer'}); }).catch(rtcErr(q,'offer'));
    RTC.unsubs.push(MP.T.on(base+'a',function(v){ if(v && !remoteSet && pc.signalingState==='have-local-offer') pc.setRemoteDescription(v).then(flush).catch(rtcErr(q,'answer in')); }));
  } else {
    RTC.unsubs.push(MP.T.on(base+'o',function(v){
      if(!v || remoteSet || pc.signalingState!=='stable') return;
      pc.setRemoteDescription(v).then(function(){
        /* the transceivers made by the offer are receive-only by default: switch them to send+receive so a mic or camera can be attached later without a new negotiation */
        var tx={}; pc.getTransceivers().forEach(function(t){ if(t.mid!==null){ t.direction='sendrecv'; tx[t.receiver.track.kind==='audio'?'a':'v']=t; } });
        pc.rtcTx=tx; if(tx.a && RTC.mic) tx.a.sender.replaceTrack(RTC.mic); if(tx.v && RTC.cam) tx.v.sender.replaceTrack(RTC.cam);
        flush(); return pc.createAnswer(); }).then(function(a){ return pc.setLocalDescription(a); }).then(function(){ return MP.T.set(base+'a',{sdp:pc.localDescription.sdp,type:'answer'}); }).catch(rtcErr(q,'answer out'));
    }));
  }
}
function rtcSend(kind,track){
  RTC.seats.forEach(function(q){ var pc=RTC.pcs[q]; if(pc && pc.rtcTx) pc.rtcTx[kind==='mic'?'a':'v'].sender.replaceTrack(track).catch(function(){}); });
}
function rtcToggle(kind){
  var isMic=kind==='mic', on=isMic?RTC.micOn:RTC.camOn;
  var btn=$(isMic?'#vcMic':'#vcCam');
  function publish(){ setTimeout(rtcShow,0); MP.T.set(rtcBase()+'st/'+RTC.me,{m:RTC.micOn?1:0,c:RTC.camOn?1:0}); var v=isMic?RTC.micOn:RTC.camOn; btn.setAttribute('aria-checked',String(v)); var sw=btn.querySelector('.tsw'); sw.classList.toggle('on',v); sw.querySelector('b').textContent=v?'ON':'OFF'; }
  if(on){
    var tr=isMic?RTC.mic:RTC.cam; if(tr) tr.stop();
    if(isMic){ RTC.mic=null; RTC.micOn=false; } else { RTC.cam=null; RTC.camOn=false; RTC.mineEl.hidden=true; RTC.mineVid.srcObject=null; }
    rtcSend(kind,null); publish(); return;
  }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ toast('Η συσκευή ή ο browser δεν επιτρέπει '+(isMic?'μικρόφωνο':'κάμερα')+'.',2200); return; }
  /* iOS Safari often refuses a second, separate permission prompt (e.g. mic after camera): the first time, ask for both together and keep only the wanted track */
  var aC={echoCancellation:true,noiseSuppression:true}, vC={facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:15}};
  var both=!RTC.asked;
  function use(stream){
    var tr=(isMic?stream.getAudioTracks():stream.getVideoTracks())[0];
    stream.getTracks().forEach(function(t){ if(t!==tr) t.stop(); });
    if(!tr) throw new Error('notrack');
    if(isMic){ RTC.mic=tr; RTC.micOn=true; } else { RTC.cam=tr; RTC.camOn=true; RTC.mineEl.hidden=false; RTC.mineVid.srcObject=new MediaStream([tr]); }
    rtcSend(kind,tr); publish();
  }
  function fail(e){
    var n=(e&&e.name)||'';
    toast(n==='NotAllowedError' ? 'Δεν δόθηκε άδεια για '+(isMic?'μικρόφωνο':'κάμερα')+'. Σε iPhone: Ρυθμίσεις → Safari → '+(isMic?'Μικρόφωνο':'Κάμερα')+' → Ρώτα/Επιτρέπω, και ξαναφόρτωσε τη σελίδα.' : 'Σφάλμα '+(isMic?'μικροφώνου':'κάμερας')+(n?' ('+n+')':'')+'.',4500);
  }
  var req=both ? {audio:aC,video:vC} : (isMic?{audio:aC}:{video:vC});
  navigator.mediaDevices.getUserMedia(req).then(function(s){ RTC.asked=true; use(s); }).catch(function(e){
    if(both){ /* maybe no camera/mic of one kind: fall back to the single request */
      navigator.mediaDevices.getUserMedia(isMic?{audio:aC}:{video:vC}).then(function(s){ RTC.asked=true; use(s); }).catch(fail);
    } else fail(e);
  });
}
var EMO={on:false,unsub:null,seen:null,last:0,btn:null,pop:null};
function emoStart(){
  if(EMO.on || !MP.T || !MP.on) return;
  EMO.on=true; EMO.seen=null;
  var tb=$('#table'); if(!tb) return;
  var btn=document.createElement('button'); btn.className='emobtn'; btn.type='button'; btn.textContent='💬'; btn.setAttribute('aria-label','Emotes');
  var pop=document.createElement('div'); pop.className='emopop'; pop.hidden=true;
  tb.appendChild(btn); tb.appendChild(pop); EMO.btn=btn; EMO.pop=pop;
  function fill(){ pop.innerHTML=EMOLOAD.map(function(id){ return '<button type="button" data-e="'+id+'"><b>'+EMOS[id][0]+'</b>'+EMOS[id][1]+'</button>'; }).join(''); }
  btn.addEventListener('click',function(){ if(Date.now()-EMO.last<3000*(window.__EMOSPEED||1)) return; fill(); pop.hidden=!pop.hidden; });
  pop.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-e]'); if(!b) return;
    pop.hidden=true; EMO.last=Date.now(); btn.disabled=true; setTimeout(function(){ btn.disabled=false; },3000*(window.__EMOSPEED||1));
    MP.T.set(mpBase()+'emo/'+G.me,{e:b.dataset.e,t:Date.now(),n:Math.random()});
  });
  EMO.unsub=MP.T.on(mpBase()+'emo',function(v){
    v=v||{};
    if(EMO.seen===null){ EMO.seen={}; Object.keys(v).forEach(function(q){ EMO.seen[q]=v[q]&&v[q].n; }); return; }   /* the first reading is old news */
    Object.keys(v).forEach(function(q){
      var x=v[q]; if(!x || EMO.seen[q]===x.n) return; EMO.seen[q]=x.n;
      if(EMOOFF && +q!==G.me) return;
      emoShow(+q,x.e);
    });
  });
}
function emoShow(q,id){
  var tb=$('#table'), E=EMOS[id]; if(!tb || !E) return;
  var r=(q-G.me+4)%4, old=tb.querySelector('.eb.r'+r); if(old) old.remove();
  var d=document.createElement('div'); d.className='eb r'+r; d.innerHTML='<b>'+E[0]+'</b><span>'+E[1]+'</span>';
  tb.appendChild(d); setTimeout(function(){ if(d.parentNode) d.remove(); },2900);
}
function emoStop(){
  if(!EMO.on) return; EMO.on=false;
  try{ if(EMO.unsub) EMO.unsub(); }catch(e){} EMO.unsub=null;
  [EMO.btn,EMO.pop].forEach(function(n){ if(n && n.parentNode) n.remove(); }); EMO.btn=EMO.pop=null;
  document.querySelectorAll('#table .eb').forEach(function(n){ n.remove(); });
}

async function main(){
  var resumed=load(), mode;
  var go=store.get('pil.go');
  if(AUTO && !window.__MPMODE){ var ta=parseInt(store.get('pil.target'),10); if(validTarget(ta)) G.target=ta; mode='new'; }
  else if(go){ store.del('pil.go'); var t=parseInt(store.get('pil.target'),10); if(validTarget(t)) G.target=t; mode='new'; }
  else {
    render();
    mode=await new Promise(function(res){
      var onNew=function(tg){ G.target=tg; res('new'); };
      var home=function(){ showHome(false,resumed,function(){ res('resume'); },onNew); };
      home();
      var gm=store.get('pil.goMode'); if(gm) store.del('pil.goMode');
      if(gm==='quick') acctGate('online',function(){ showQuick(home,onNew); },home);
      else if(gm==='friends') acctGate('online',function(){ showFriends(home,onNew); },home);
      else if(gm==='near') acctGate('nearby',function(){ showNearby(home,onNew); },home);
      else if(gm==='invite'){ var ic=store.get('pil.invCode'); store.del('pil.invCode'); acctGate('online',function(){ var T=mpTransport(), fail=function(m){ toast(m,3000); home(); }; if(!T||!ic){ home(); return; } mpJoin(T,ic,mpName(),onNew,home,fail).catch(function(){ fail('Δεν μπόρεσα να συνδεθώ. Έλεγξε το internet.'); }); },home); }
      else if(gm==='new') showMode(home,onNew);
      else {
        /* first popup for someone who is not signed in: continue as a guest or sign in (then the welcome tour, the first time) */
        var afterGuest=function(){ if(WELCOME_ON && !AUTO && !resumed && !store.get('pil.seen')) showWelcome(home); else { if(!store.get('pil.seen')) store.set('pil.seen','1'); home(); } };
        if(AUTO) afterGuest(); else guestNote(home,afterGuest);
      }
    });
    closeSheet();
  }
  await runGame(mode);
}
/* one whole game (also used again for a rematch of an online table) */
async function runGame(mode){
  if(mode==='new'){
    G.scores=[0,0]; G.round=0; G.over=null; G.adCounted=false; store.del('pil.state');
    var cut=SUITS[Math.floor(Math.random()*4)];
    G.dealer=SUITS.indexOf(cut);
    G.cut={s:cut,r:RANKS[Math.floor(Math.random()*RANKS.length)],d:G.dealer,k:Math.random().toString(36).slice(2,8)};
    render();
    waitPanel('Κόβεις την τράπουλα: βγήκε '+SNAME[cut]+'. Μοιράζει: '+nm(G.dealer)+'.');
    if(ANIM) await cutAnim(G.cut); else await sleep(1500);
    await sleep(300);
    G.cut=null;
  } else {
    render();
    waitPanel(mode==='migr' ? 'Ο οικοδεσπότης έφυγε. Το παιχνίδι συνεχίζεται με το ίδιο σκορ και ο γύρος ξαναμοιράζεται.' : 'Συνεχίζεις το παιχνίδι από εκεί που έμεινες.');
    await sleep(mode==='migr' ? 2200 : 1000);
  }
  while(true){
    await playRound();
    if(G.over!==null) break;
    if(AUTO && window.__rounds>=(window.__maxRounds||40)) break;
  }
  window.__done=true; rtcStop();
  if(MP.on && MP.host) stRecord();
  if(LOGIN_ON && !MP.on && !loggedIn() && !AUTO && G.over!==null) store.set('pil.trial',String(trialUsed()+1));
  if(!AUTO){ render(); waitPanel('Τέλος παιχνιδιού.'); endSheet(); }
}
main().catch(function(e){ window.__err=String(e && e.stack || e); setPanel('<div class="status">Κάτι πήγε στραβά: '+esc(e && e.message || e)+'</div><button class="btn" type="button" onclick="location.reload()">Ξανά</button>'); });
})();
