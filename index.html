],["Ήχος: ","Sound: "],["Ο παίκτης","The player"],[" δεν απαντά: τον αντικαθιστά bot."," is not responding: a bot takes their place."],[" αποσυνδέθηκε: τον αντικαθιστά bot."," disconnected: a bot takes their place."],["Είσαι ακόμα εδώ;","Are you still there?"],["Πάτησε το κουμπί, αλλιώς σε ","Tap the button, or a bot will take your place in "],[" δευτερόλεπτα θα σε αντικαταστήσει bot."," seconds."],["Είμαι εδώ","I'm here"],["Σε αντικατέστησε bot","A bot took your place"],["Δεν απάντησες εγκαίρως. Το bot παίζει για σένα μέχρι να γυρίσεις.","You did not respond in time. The bot plays for you until you come back."],["Γύρισα","I'm back"],["Ψάχνουμε παίκτες… Έτοιμοι: ","Looking for players… Ready: "],["Αν δεν βρεθούν 4 άτομα σε περίπου 1 λεπτό, οι κενές θέσεις παίρνουν bots.","If 4 players aren't found within about a minute, bots take the empty seats."],[" · μικρόφωνο"," · microphone"],["Δεν δόθηκε άδεια για μικρόφωνο. Σε iPhone: Ρυθμίσεις → Safari → Μικρόφωνο → Ρώτα/Επιτρέπω, και ξαναφόρτωσε τη σελίδα.","Microphone permission was not given. On iPhone: Settings → Safari → Microphone → Ask/Allow, and reload the page."],["Δεν δόθηκε άδεια για κάμερα. Σε iPhone: Ρυθμίσεις → Safari → Κάμερα → Ρώτα/Επιτρέπω, και ξαναφόρτωσε τη σελίδα.","Camera permission was not given. On iPhone: Settings → Safari → Camera → Ask/Allow, and reload the page."],["Σφάλμα μικροφώνου","Microphone error"],["Σφάλμα κάμερας","Camera error"],["Στην εφαρμογή Android, το «Κοντά μου» ζητά την άδεια τοποθεσίας, γιατί το Android την απαιτεί για να βρει κοντινές συσκευές. Δεν συλλέγουμε, δεν αποθηκεύουμε και δεν στέλνουμε την τοποθεσία σου πουθενά.","In the Android app, Nearby asks for the location permission because Android requires it to find nearby devices. We do not collect, store or send your location anywhere."],["Φόντο πίσω από το τραπέζι","Background behind the table"],["Φόντο","Background"],["Απλό","Plain"],["Λινό","Linen"],["Μέντα","Mint"],["Ουρανός","Sky"],["Σούρουπο","Dusk"],["Πέτρα","Stone"],["Κανονικά","Standard"],["Χριστούγεννα","Christmas"],["Κάμερα/μικρόφωνο: δεν έγινε σύνδεση με ","Camera/microphone: could not connect with "],[". Συνήθως δουλεύει όταν είστε συνδεδεμένοι σε Wi-Fi.",". It usually works when you are connected to Wi-Fi."],["Φύγε από το τραπέζι","Leave the table"],["Είσαι ο οικοδεσπότης: αν φύγεις, το τραπέζι κλείνει για όλους.","You are the host: if you leave, the table closes for everyone."],["Είσαι ο οικοδεσπότης: αν φύγεις, το παιχνίδι συνεχίζεται με άλλον οικοδεσπότη και τη θέση σου παίρνει bot. Ο γύρος που παίζεται ξαναμοιράζεται.","You are the host: if you leave, the game carries on with another host and a bot takes your seat. The round in progress is dealt again."],["Θα φύγεις και τη θέση σου θα πάρει bot. Δεν μπορείς να ξαναμπείς σε αυτό το παιχνίδι.","You will leave and a bot will take your seat. You cannot rejoin this game."],["Θα μετρήσει ως ήττα στην κατάταξη.","It will count as a loss in the rankings."],["Δεν θα μπορείς να παίξεις Γρήγορο παιχνίδι για 15 λεπτά.","You will not be able to play Quick match for 15 minutes."],[" έφυγε από το τραπέζι: τη θέση του παίρνει bot."," left the table: a bot takes their seat."],["Το παιχνίδι τελείωσε","The game is over"],["Ο οικοδεσπότης έφυγε από το τραπέζι.","The host left the table."],["Online παιχνίδι","Online game"],["Το προηγούμενο online παιχνίδι σου έκλεισε πριν τελειώσει και μέτρησε ως ήττα","Your previous online game closed before it finished and counted as a loss"],["Έφυγες από παιχνίδι πριν τελειώσει. Μπορείς να ξαναπαίξεις Γρήγορο παιχνίδι σε ","You left a game before it finished. You can play Quick match again in "],[" λεπτά."," minutes."],["Για τη φωνή και το βίντεο κρατάμε ανώνυμα στοιχεία σύνδεσης (αν πέτυχε, διάρκεια, όγκος δεδομένων), χωρίς ονόματα ή διευθύνσεις, για να βελτιώνουμε την υπηρεσία. Σβήνονται αυτόματα μετά από περίπου 60 ημέρες. Όταν η φωνή ή η κάμερα δεν μπορούν να συνδεθούν απευθείας ανάμεσα στις συσκευές, ο ήχος και η εικόνα περνούν κρυπτογραφημένα από servers αναμετάδοσης της Cloudflare, χωρίς να αποθηκεύονται.","For voice and video we keep anonymous connection data (whether it worked, duration, amount of data), without names or addresses, to improve the service. It is deleted automatically after about 60 days. When voice or video cannot connect directly between devices, the audio and video pass encrypted through Cloudflare relay servers and are not stored."],["Το παιχνίδι με τα bots θα σταματήσει. Το σκορ από τους γύρους που έχουν τελειώσει κρατιέται και μπορείς να συνεχίσεις από το Κύριο μενού.","The game with the bots will stop. The score of the rounds already finished is kept, and you can continue from the Main menu."],["Ρεβάνς","Rematch"],["Η ρεβάνς ξεκίνησε χωρίς εσένα.","The rematch started without you."],[" μοίρασε. Ξεκινούν τα ανοίγματα."," has dealt. Bidding starts."],["Μοίρασες. Ξεκινούν τα ανοίγματα.","You have dealt. Bidding starts."],["Μοιράζεις.","You are dealing."],["Διάλεξε επιφάνεια τραπεζιού","Choose the table surface"],["Διάλεξε φόντο","Choose the background"],["Διάλεξε τον avatar σου","Choose your avatar"],["Διάλεξε τα emotes σου","Choose your emotes"],["Emotes άλλων","Other players' emotes"],["Οδηγός παιχνιδιού","Game coach"],["Ήχος","Sound"],["Διάλεξε σχέδιο φύλλων","Choose the card design"],["Εμφάνιση","Appearance"],["Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού (και αν θα έχει πλαίσιο), φόντο, σχέδιο φύλλων, τον avatar σου και τα emotes σου.","Appearance: choose the table surface, the background, the card design, your avatar and your emotes."],["Ρυθμίσεις: ανοίγεις ή κλείνεις τα emotes των άλλων, τον Οδηγό παιχνιδιού, τον ήχο και τα animation.","Settings: turn other players' emotes, the Game coach, sound and animations on or off."],["Ρεβάνς: στο τέλος ενός παιχνιδιού με φίλους ή στο «Κοντά μου» πατάς Ρεβάνς και γυρνάς στο ίδιο τραπέζι, στη θέση σου. Όταν μπουν όλοι, ο οικοδεσπότης ξεκινάει. Όποιος δεν πατήσει Ρεβάνς δεν παίζει. Ο οικοδεσπότης βλέπει στο τραπέζι ποιος μπήκε, ποιος έφυγε και ποιος δεν έχει μπει ακόμα.","Rematch: at the end of a game with friends or on “Nearby”, tap Rematch to go back to the same table, in your seat. Once everyone is in, the host starts the game. Anyone who doesn't tap Rematch sits out. The host sees on the table who is back, who left and who has not joined yet."],["Στην αρχή κόβεται η τράπουλα: το φύλλο που κόπηκε δείχνει ποιος μοιράζει. Σε κάθε γύρο μοιράζει 3, 2 και 3 φύλλα στον καθένα.","At the start the deck is cut: the cut card decides who deals. Each round, the dealer deals 3, then 2, then 3 cards to each player."],["Σε παιχνίδι με άλλους παίκτες, από το Μενού μπορείς να φύγεις από το τραπέζι. Τη θέση σου την παίρνει bot.","In a game with other players, you can leave the table from the Menu. A bot takes your seat."],["Ο «Οδηγός παιχνιδιού» προτείνει κάθε κίνηση και την εξηγεί. Είναι κλειστός από την αρχή και ανοίγει από τις Ρυθμίσεις.","The «Game coach» suggests every move and explains it. It is off from the start and can be switched on in Settings."],["Τα κόζια είναι δικά σας, ο σύντροφος βγάζει κόζι κι εσύ δεν έχεις: ρίχνεις τον Άσο μιας φυλής για να πεις ότι παίρνεις όλες τις μπάζες της. Ο σύντροφος βγάζει όλα τα κόζια και μετά σου παίζει αυτή τη φυλή.","When your team holds the trumps, your partner leads a trump and you have none: discard the Ace of a suit to say you will take all its tricks. Your partner then draws all the trumps and leads that suit to you."],["Δεν έχεις παίξει ακόμα online παιχνίδι με κατάταξη.","You have not played a rated online game yet."],["Οι κατηγορίες ανανεώνονται κάθε ώρα.","The categories are updated every hour."],[" Elo · σου λείπουν "," Elo · points needed: "],["Χωρίς κατηγορία ακόμα","No category yet"],["Κατηγορία: ","Category: "],["Σήματα","Badges"],["Δεν έχει σήματα ακόμα.","No badges yet."],["Το προφίλ μου","My profile"],["Τα σήματα τα κερδίζεις με λογαριασμό: το σήμα της κατηγορίας σου από το πρώτο σου online παιχνίδι με κατάταξη, και αργότερα ειδικά σήματα, π.χ. από τουρνουά.","You earn badges with an account: the badge of your category from your first rated online game, and later special badges, e.g. from tournaments."],["Φαίνεται δίπλα στο avatar σου","Shown next to your avatar"],["Διάλεξε ποιο σήμα φαίνεται δίπλα στο avatar σου. Όταν κάποιος ανοίξει το προφίλ σου, βλέπει όλα τα σήματά σου.","Choose which badge is shown next to your avatar. When someone opens your profile, they see all your badges."],["Δεν έχεις σήματα ακόμα. Το πρώτο το παίρνεις με το πρώτο σου online παιχνίδι με κατάταξη: είναι το σήμα της κατηγορίας σου.","You have no badges yet. You get the first one with your first rated online game: the badge of your category."],["Κατηγορίες: Αρχάριος, Προχωρημένος (Top 50%), Έμπειρος (Top 25%), Μάστρος (Top 10%), Άρχοντας της Πιλόττας (Top 3%), ανάμεσα σε όλους τους ενεργούς παίκτες. Ανανεώνονται κάθε ώρα.","Categories: Beginner, Advanced (Top 50%), Experienced (Top 25%), Master (Top 10%), Lord of Pilotta (Top 3%), among all active players. Updated every hour."],["Η κατάταξη θα ανοίξει σύντομα, όταν μαζευτούν αρκετοί παίκτες. Μέχρι τότε, η κατηγορία σου φαίνεται στο προφίλ σου.","The leaderboard will open soon, once there are enough players. Until then, your category is shown in your profile."],["Οι άλλοι παίκτες βλέπουν στο προφίλ σου το username, το avatar, την κατηγορία και τα σήματά σου. Η κατηγορία βγαίνει από τη θέση του rating σου ανάμεσα σε όλους τους ενεργούς παίκτες.","Other players see your username, avatar, category and badges in your profile. Your category is based on where your rating ranks among all active players."],["Μπορείς να διαγράψεις τον λογαριασμό σου όποτε θέλεις από το προφίλ σου. Τότε σβήνονται το email, το username, το avatar, τα σήματα και τα στατιστικά σου.","You can delete your account any time from your profile. Your email, username, avatar, badges and statistics are then deleted."],["Αν δεν μπεις στον λογαριασμό σου για 60 μέρες, κρύβεται από τις λίστες φίλων και την κατάταξη, μέχρι να ξαναμπείς. Αν δεν μπεις για 180 μέρες, ο λογαριασμός και όλα τα στοιχεία του διαγράφονται αυτόματα.","If you do not sign in for 60 days, your account is hidden from friend lists and the leaderboard until you come back. If you do not sign in for 180 days, the account and all its data are deleted automatically."],["Πάνω δεξιά είναι το avatar σου: ανοίγει το προφίλ σου, όπου αλλάζεις avatar και διαλέγεις ποιο σήμα φαίνεται δίπλα του.","Your avatar is at the top right: it opens your profile, where you change your avatar and choose which badge is shown next to it."],["Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού (και αν θα έχει πλαίσιο), φόντο, σχέδιο φύλλων και τα emotes σου.","Appearance: choose the table surface, the background, the card design and your emotes."],["Πάτα το avatar ενός παίκτη για να δεις το προφίλ του (κατηγορία και σήματα) και να του στείλεις αίτημα φιλίας.","Tap a player's avatar to see their profile (category and badges) and send them a friend request."],["Βρέθηκαν παίκτες. Ξεκινάμε… ","Players found. Starting… "],["Οι θέσεις μοιράζονται τυχαία. Όσες θέσεις μείνουν κενές τις παίρνουν bots.","Seats are assigned at random. Bots take any empty seats."],["Ακύρωση","Cancel"],["Ο οικοδεσπότης έφυγε. Το παιχνίδι συνεχίζεται με το ίδιο σκορ και ο γύρος ξαναμοιράζεται.","The host left. The game continues with the same score, and the round is dealt again."],["Ο οικοδεσπότης έφυγε. Συνεχίζουμε…","The host left. Continuing…"],["Το παιχνίδι συνεχίζεται.","The game continues."],["Έλειπες αρκετή ώρα και το παιχνίδι συνεχίστηκε με άλλον οικοδεσπότη.","You were away for a while, and the game continued with another host."],["Προφίλ","Profile"],["Το γρήγορο παιχνίδι και το παιχνίδι με φίλους θέλουν λογαριασμό. Συνδέσου από το «Προφίλ», πάνω δεξιά στο κύριο μενού.","Quick match and playing with friends require an account. Sign in from «Profile», at the top right of the main menu."],["Το γρήγορο παιχνίδι, το παιχνίδι με φίλους και το «Κοντά μου» θέλουν λογαριασμό. Συνδέσου από το «Προφίλ», πάνω δεξιά στο κύριο μενού.","Quick match, playing with friends and Nearby require an account. Sign in from «Profile», at the top right of the main menu."],["Οι γύροι που παίζεις (φύλλα, ανοίγματα, κινήσεις, αποτέλεσμα) αποθηκεύονται ανώνυμα, χωρίς ονόματα ή οτιδήποτε σε αναγνωρίζει, για να γίνονται καλύτερα τα bots. Σβήνονται αυτόματα μετά από περίπου 15 μέρες.","The rounds you play (cards, bids, moves, result) are saved anonymously, without names or anything that identifies you, to improve the bots. They are deleted automatically after about 15 days."],["Έρχεται σύντομα.","Coming soon."],["Διάστημα","Space"],["Βαθύ διάστημα","Deep space"],["Νεφέλωμα","Nebula"],["Γαλαξίας","Galaxy"],["Σελήνη","Moon"],["Άρης","Mars"],["Αστρόσκονη","Stardust"],["Σέλας","Aurora"],["Τροχιά","Orbit"],["Κομήτης","Comet"],["Σεληνόφως","Moonlight"],["Αστέρια","Stars"],["Κρατήρες","Craters"],["Απογείωση!","Lift-off!"],["Σε άλλο πλανήτη","On another planet"],["Εξωγήινο!","Alien!"],["Κάνε μια ευχή","Make a wish"],["Με απήγαγαν","I got abducted"],["Αυτό είναι μέρος του Pilotta Plus. Το Plus έρχεται σύντομα.","This is part of Pilotta Plus. Plus is coming soon."],["Το Pilotta Plus ενεργοποιήθηκε!","Pilotta Plus is now active!"],["Αυτό είναι μέρος του Pilotta Plus, από 1,99 € τον μήνα.","This is part of Pilotta Plus, from €1.99 a month."],["Δες το Plus","See Plus"],["Άλλο ποσό (από 2,99 €)","Other amount (from €2.99)"],["Οι πληρωμές ανοίγουν σύντομα.","Payments are opening soon."],["Συνδέσου πρώτα, για να μπει το Plus στον λογαριασμό σου.","Sign in first, so Plus is added to your account."],["Η πληρωμή γίνεται στη σελίδα της Stripe. Το Plus ενεργοποιείται αυτόματα, το πολύ μέσα σε μία ώρα.","You pay on Stripe's page. Plus is activated automatically within an hour."],["Τι περιλαμβάνει","What is included"],["Όροι χρήσης","Terms of use"],["Επιστροφές","Refunds"],["Υποστήριξέ μας","Support us"],["Pilotta Plus · Υποστήριξέ μας","Pilotta Plus · Support us"],["Με μία πληρωμή ξεκλειδώνεις για πάντα το θέμα «Διάστημα» (επιφάνειες, φόντα, φύλλα, avatars, emotes), παίρνεις το σήμα Pilotta Plus και προτεραιότητα στην αναμονή του Γρήγορου παιχνιδιού. Το παιχνίδι μένει δωρεάν για όλους: το Plus δεν δίνει πλεονέκτημα στο τραπέζι.","With a single payment you unlock the «Space» theme forever (table surfaces, backgrounds, cards, avatars, emotes), and get the Pilotta Plus badge and priority in the Quick match queue. The game stays free for everyone: Plus gives no advantage at the table."],["Έχεις ήδη Plus. Ευχαριστούμε!","You already have Plus. Thank you!"],[" Αν θες, μπορείς να μας στηρίξεις κι άλλο."," If you like, you can support us further."],["Χωρίς διαφημίσεις για πάντα: όταν μπουν διαφημίσεις στο παιχνίδι, εσύ δεν θα τις βλέπεις.","No ads, ever: when ads come to the game, you won't see them."],["Με «Άλλο ποσό» γράφεις όσο θέλεις. Από 2,99 € και πάνω παίρνεις το Plus· μικρότερο ποσό είναι στήριξη για το παιχνίδι, χωρίς Plus.","With «Other amount» you choose how much to pay. From €2.99 up you get Plus; a smaller amount is a donation to the game, without Plus."],["Άλλο ποσό","Other amount"],["Χωρίς διαφημίσεις + Bonus θέμα","No ads + bonus theme"],[". Έχεις Βαλέ και 9 στη φυλή του",". You have the Jack and 9 in his suit"],[". Έχεις Βαλέ στη φυλή του",". You have the Jack in his suit"],[". Έχεις 9 στη φυλή του",". You have the 9 in his suit"],["Κόζια Κούπα.","Trumps: Hearts."],["Κόζια Καρό.","Trumps: Diamonds."],["Κόζια Σπαθί.","Trumps: Clubs."],["Κόζια Πίκα.","Trumps: Spades."],[") από ",") at "],["Αποσυνδέθηκες","You have been signed out"],["Ο λογαριασμός σου συνδέθηκε σε άλλη συσκευή. Ένας λογαριασμός μπορεί να είναι ανοιχτός σε μία μόνο συσκευή τη φορά.","Your account was signed in on another device. An account can only be signed in on one device at a time."],["Για να παίξεις από εδώ, συνδέσου ξανά. Τότε θα αποσυνδεθεί η άλλη συσκευή.","To play from here, sign in again. The other device will then be signed out."],["Φαίνεται δίπλα στο avatar σου. Πάτα ξανά για να το βγάλεις.","Shown next to your avatar. Tap it again to remove it."],["Σε βάζουμε σε τραπέζι με τυχαίους παίκτες. Παίζεται μέχρι τους 201 πόντους.","We put you at a table with random players. The game is played to 201 points."],["Φτιάξε τραπέζι ή γράψε τον κωδικό που σου έδωσε ο φίλος σου.","Create a table or type the code your friend gave you."],["Παίζεις ως ","Playing as "],["ενεργοί παίκτες","players online"],["ενεργός παίκτης","player online"],["Μικρόφωνο","Microphone"],["Κάμερα","Camera"],["Πρόσκληση σε τραπέζι","Game invitation"],[" σε καλεί να παίξετε μαζί."," invites you to play together."],["Όχι τώρα","Not now"],["Κάλεσε φίλους","Invite friends"],["Διάλεξε έως ","Choose up to "],[". Θα καθίσουν όπου θέλουν.",". They will choose their own seats."],["Κανένας φίλος σου δεν είναι online αυτή τη στιγμή.","None of your friends are online right now."],["Στάλθηκε","Sent"],["Στείλε","Send"],["Οι προσκλήσεις στάλθηκαν.","Invitations sent."],["Φίλος","Friend"],["Μήνυμα","Message"],["Δεν υπάρχουν μηνύματα ακόμα. Γράψε το πρώτο!","No messages yet. Send the first one!"],["Τα μηνύματα που στέλνεις σε φίλους στο chat αποθηκεύονται για να τα βλέπετε, και τα βλέπετε μόνο εσείς οι δύο. Σβήνονται αυτόματα μετά από 7 μέρες. Λέξεις που προσβάλλουν αντικαθίστανται με ***. Κρατάμε και πότε διάβασες τελευταία φορά κάθε συνομιλία, για να σου δείχνουμε πόσα νέα μηνύματα έχεις.","Chat messages you send to friends are stored so that you can both read them, and no one else can see them. They are deleted automatically after 7 days. Offensive words are replaced with ***. We also store when you last read each conversation, so we can show you how many new messages you have."],["Ο λογαριασμός σου","Your account"],["Εμφάνιση: διαλέγεις επιφάνεια τραπεζιού (και αν θα έχει πλαίσιο), φόντο, σχέδιο φύλλων, τα emotes σου και τη Σούπερ τσάκα. Τα σχέδια με το λουκέτο (π.χ. Διάστημα) είναι μέρος του Pilotta Plus. Κράτα πατημένο ένα σχέδιο για να το δεις σε μεγάλο μέγεθος.","Appearance: choose the table surface (and whether it has a frame), background, card design, your emotes and your Super cut. Designs with a padlock (e.g. Space) are part of Pilotta Plus. Press and hold a design to see it full size."],["Πώς παίζεται (οδηγός): μια εξήγηση του παιχνιδιού, βήμα βήμα. Ξενάγηση: αυτή εδώ, μια γρήγορη ματιά στα κουμπιά.","How to play (guide): a step-by-step explanation of the game. Quick guide: this tour of the buttons."],["Όταν έχεις συνδεθεί, πάνω αριστερά βλέπεις πόσοι παίκτες παίζουν αυτή τη στιγμή.","When you're signed in, the top left shows how many players are online right now."],["Πάνω δεξιά είναι το avatar σου: ανοίγει το προφίλ σου, όπου αλλάζεις avatar και διαλέγεις ποιο σήμα φαίνεται δίπλα του. Αν πατήσεις το σήμα που ήδη φαίνεται, το βγάζεις.","Your avatar is at the top right: it opens your profile, where you can change your avatar and choose which badge appears next to it. Tap the badge that is already showing to remove it."],["Φίλοι: στέλνεις αίτημα με το username ενός φίλου. Η πράσινη τελεία στο κουμπί δείχνει πόσοι φίλοι σου είναι online. Στη λίστα βλέπεις το avatar και το σήμα κάθε φίλου, και πράσινη τελεία δίπλα στο όνομα όταν είναι online. Κίτρινη τελεία σημαίνει ότι είναι away: δεν έχει πατήσει τίποτα για 15 λεπτά.","Friends: send a friend request using your friend's username. The green dot on the button shows how many of your friends are online. The list shows each friend's avatar and badge, with a green dot next to their name when they are online. A yellow dot means they are away: they haven't tapped anything for 15 minutes."],["Πάτα το 💬 δίπλα σε έναν φίλο για να του στείλεις μήνυμα. Ο κόκκινος αριθμός δείχνει πόσα νέα μηνύματα έχεις, και φαίνεται και στο κουμπί Φίλοι. Τα μηνύματα σβήνονται αυτόματα μετά από 7 μέρες.","Tap 💬 next to a friend to send them a message. The red number shows how many new messages you have, and it also appears on the Friends button. Messages are deleted automatically after 7 days."],["Κατάταξη: οι καλύτεροι παίκτες, όλοι ή μόνο οι φίλοι σου, συνολικά, την εβδομάδα ή τον μήνα.","Leaderboard: the top players, overall or just your friends, for all time, this week or this month."],["Ο λογαριασμός σου μένει συνδεδεμένος σε μία συσκευή. Αν συνδεθείς σε άλλη, αποσυνδέεσαι από την προηγούμενη.","Your account stays signed in on one device at a time. If you sign in on another device, you are signed out of the previous one."],["Κάλεσε φίλους: όταν φτιάχνεις τραπέζι, καλείς έως 3 φίλους που είναι online. Τους έρχεται πρόσκληση, μπαίνουν στο τραπέζι και κάθονται όπου θέλουν.","Invite friends: when you create a table, you can invite up to 3 friends who are online. They get an invitation, join the table and sit wherever they like."],["Σε παιχνίδι με άλλους παίκτες (γρήγορο ή με φίλους) έχεις και το κουμπί 💬 για emotes. Στο παιχνίδι με φίλους έχεις επίσης Μικρόφωνο και Κάμερα (Beta), που ανοίγουν και κλείνουν με διακόπτη.","In a game with other players (quick match or with friends) you also have the 💬 button for emotes. In a game with friends you can also use the Microphone and Camera (Beta), each with its own on/off switch."],["Όσο η εφαρμογή είναι ανοιχτή και έχεις συνδεθεί, οι φίλοι σου βλέπουν ότι είσαι online, ή away αν δεν έχεις πατήσει τίποτα για 15 λεπτά. Όταν καλείς φίλους σε τραπέζι, αποθηκεύεται η πρόσκληση (το username σου και ο κωδικός του τραπεζιού). Στο μενού φαίνεται ο αριθμός των online παικτών. Για να είναι ο λογαριασμός σου συνδεδεμένος σε μία συσκευή κάθε φορά, η εφαρμογή κρατά έναν τυχαίο κωδικό συσκευής, χωρίς στοιχεία της συσκευής σου.","While the app is open and you are signed in, your friends can see that you are online, or away if you haven't tapped anything for 15 minutes. When you invite friends to a table, the invitation (your username and the table code) is stored. The menu shows the number of online players. To keep your account signed in on one device at a time, the app stores a random device code that contains no information about your device."],["Ξενάγηση","Quick guide"],["Πρόσθεσε φίλο","Add friend"],["Έχεις στείλει αίτημα φιλίας.","You have sent a friend request."],["Τα κόζια είναι δικά σας και ο σύντροφος ανοίγει μια άλλη φυλή με οτιδήποτε εκτός από το 10: αν έχεις τον Άσο, παίρνεις με τον Άσο και του ξαναπαίζεις την ίδια φυλή.","When your team holds the trumps and your partner leads another suit with anything but the 10: if you hold the Ace, win with it and lead the same suit back to him."],["Αλλαγή username","Change username"],["Σύντομα θα μπορείς να αλλάζεις το username σου. Τα στατιστικά, οι φίλοι και τα σήματά σου θα μείνουν ίδια.","You'll soon be able to change your username. Your stats, friends and badges will stay the same."],["Pilotta Plus: έχεις προτεραιότητα στην αναμονή.","Pilotta Plus: you have priority in the queue."],["Τα φύλλα που έμειναν","Remaining cards"],["Η αγορά μέσω Google Play έρχεται σύντομα.","Buying through Google Play is coming soon."],["Έπαιξες τα 2 δοκιμαστικά παιχνίδια","You have played the 2 trial games"],["Φτιάξε λογαριασμό για να συνεχίσεις χωρίς όριο, ή δες μια διαφήμιση για ένα ακόμα παιχνίδι με bots.","Create an account to keep playing without a limit, or watch an ad for one more game against bots."],["Δες διαφήμιση για ένα ακόμα παιχνίδι","Watch an ad for one more game"],["Φόρτωση διαφήμισης…","Loading the ad…"],["Δεν ήταν διαθέσιμη διαφήμιση. Δοκίμασε ξανά σε λίγο.","No ad was available. Try again in a moment."],["Φτιάξε λογαριασμό για να συνεχίσεις.","Create an account to continue."],["Επιλογές διαφημίσεων","Ad choices"],["Δεν υπάρχει επιλογή για τις διαφημίσεις: ή δεν απαιτείται στη χώρα σου, ή το μήνυμα συγκατάθεσης δεν είναι ακόμα διαθέσιμο.","There is no ad choice to show: either none is required in your country, or the consent message is not available yet."],["Χωρίς λογαριασμό παίζεις έως 2 παιχνίδια με bots. Στην εφαρμογή Android μπορείς να δεις μια διαφήμιση για ένα ακόμα παιχνίδι. Η εφαρμογή δείχνει και ένα banner στο κεντρικό μενού· με το Pilotta Plus δεν βλέπεις διαφημίσεις. Την επιλογή σου για τις διαφημίσεις την αλλάζεις από τις Ρυθμίσεις.","Without an account you can play up to 2 games against bots. In the Android app you can watch an ad for one more game. The app also shows a banner on the main menu; with Pilotta Plus you see no ads. You can change your ad choice in Settings."],["Κατάστημα (πάνω αριστερά): εδώ βρίσκεις το Pilotta Plus και τα θέματα που πωλούνται χωριστά: με το 🎨 τα γενικά (π.χ. Κυπριακό καφενείο) και με το ⚽ τα ποδοσφαιρικά, σε διάφορους συνδυασμούς χρωμάτων. Με Plus έχεις 50% έκπτωση σε κάθε θέμα. Τις επιφάνειες, τα φόντα και τα σχέδια φύλλων τα βλέπεις μόνο εσύ. Τα avatars και τα emotes τα βλέπουν και οι άλλοι παίκτες.","Store (top left): this is where you find Pilotta Plus and the themes sold separately (e.g. Cypriot café). With Plus you get 50% off every theme. Only you see the table surfaces, backgrounds and card designs. Other players see your avatar and emotes."],["Κατάστημα","Store"],["Εδώ βρίσκεις ό,τι ξεκλειδώνει επιπλέον στο παιχνίδι.","Here you find everything that unlocks extras in the game."],["Χωρίς διαφημίσεις και το θέμα «Διάστημα».","No ads and the “Space” theme."],["Νέα θέματα έρχονται σύντομα.","New themes are coming soon."],["Νέον","Neon"],["Μεσόγειος","Mediterranean"],["Χρυσό","Gold"],["Πλέγμα νέον","Neon grid"],["Ροζ νέον","Pink neon"],["Ηλιοβασίλεμα νέον","Neon sunset"],["Κύκλωμα","Circuit"],["Βροχή νέον","Neon rain"],["Γαλάζια θάλασσα","Blue sea"],["Άμμος","Sand"],["Ασβεστωμένος τοίχος","Whitewashed wall"],["Τερακότα","Terracotta"],["Μπλε του Αιγαίου","Aegean blue"],["Μαύρο βελούδο","Black velvet"],["Σμαραγδί","Emerald"],["Μπορντό βελούδο","Burgundy velvet"],["Μαύρο μάρμαρο","Black marble"],["Ναυτικό μπλε","Navy blue"],["Νυχτερινή πόλη","Night city"],["Λέιζερ","Lasers"],["Ψηφιακή βροχή","Digital rain"],["Σάρωση","Scan lines"],["Φωτάκια","Little lights"],["Κύματα","Waves"],["Θόλοι","Domes"],["Βουκαμβίλια","Bougainvillea"],["Δίχτυα","Fishing nets"],["Ηλιόλουστο","Sunny"],["Άρ ντεκό","Art
