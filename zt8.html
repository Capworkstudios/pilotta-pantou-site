<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=0.25,maximum-scale=6,user-scalable=yes"><title>zoom test 8</title><style>body{margin:0;font:20px system-ui;background:#e8eee7;overflow-x:hidden}html{overflow-x:hidden;overscroll-behavior-x:none}p{margin:12px}.b{height:60px;background:#1b5a45;color:#fff;display:flex;align-items:center;justify-content:center;margin:8px 12px;border-radius:10px}</style></head><body><p><b>Test 8</b><br>αόρατη φαρδιά γραμμή + κλείδωμα οριζόντιας κίνησης όταν δεν έχεις κάνει zoom</p><p>Δοκίμασε: 1) zoom out, 2) χωρίς zoom, τράβα αριστερά/δεξιά (πρέπει να μένει ακίνητη), 3) zoom in και πάνω-κάτω/αριστερά-δεξιά κίνηση (πρέπει να δουλεύει).</p><div class="b">κουτί 1</div><div class="b">κουτί 2</div><div class="b">κουτί 3</div><div class="b">κουτί 4</div><div class="b">κουτί 5</div><div style="position:absolute;top:0;left:0;width:1600px;height:1px;visibility:hidden;pointer-events:none"></div><script>(function(){
var de=document.documentElement, vv=window.visualViewport;
function sc(){ return vv ? vv.scale : 1; }
function upd(){ var z=sc()>1.02; de.style.touchAction = z ? 'auto' : 'pan-y pinch-zoom'; document.body.style.touchAction = de.style.touchAction; if(!z && sc()>=0.99 && window.scrollX>0) window.scrollTo(0,window.scrollY); }
if(vv){ vv.addEventListener('resize',upd); vv.addEventListener('scroll',function(){ if(sc()>=0.99 && sc()<=1.02 && window.scrollX>0) window.scrollTo(0,window.scrollY); }); }
window.addEventListener('scroll',function(){ if(sc()>=0.99 && sc()<=1.02 && window.scrollX>0) window.scrollTo(0,window.scrollY); },{passive:true});
upd();
})();</script></body></html>
